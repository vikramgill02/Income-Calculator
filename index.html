<style>
:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --bg: #0c0b0a;
  --surface: #141311;
  --line: rgba(240,228,208,0.08);
  --text: #f6f1e7;
  --muted: #9b9386;

  --nav-h: 64px;
}
html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(1100px 520px at 50% -220px, rgba(201,169,110,0.10), transparent 70%),

  font-family: var(--font);

  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.006em;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Headings are set in the serif; numbers and UI stay in Inter. */
h1 {
  font-family: var(--serif) !important;
  font-weight: 500 !important;
  font-size: clamp(32px, 4.2vw, 42px) !important;
  letter-spacing: -0.01em;
  color: var(--text) !important;
}
::selection { background: rgba(201,169,110,0.35); }
button { font-family: var(--font); transition: background 0.13s ease, border-color 0.13s ease, color 0.13s ease; }
input { font-family: var(--font); }
::-webkit-scrollbar { height: 8px; width: 8px; }
::-webkit-scrollbar-track { background: #141311; }
::-webkit-scrollbar-thumb { background: #3d3933; border-radius: 4px; }

.dash-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.dash-pie-grid {
  display: grid;
  grid-template-columns: minmax(280px, 380px) 1fr;
  gap: 24px;
  margin-bottom: 32px;
}
.dash-employers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}
.bene-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  flex-wrap: wrap;
}
@media (max-width: 640px) {
  .bene-row { gap: 6px; }
}
/* Twelve month chips are wider than a phone. Let them scroll within their own
   row rather than dragging the whole page sideways. */
.chip-strip {
  display: flex;
  gap: 3px;
  flex-wrap: nowrap;
  overflow-x: auto;
  min-width: 0;
  flex: 1 1 auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}
.chip-strip::-webkit-scrollbar { display: none; }
/* Anything tappable clears Apple's 44px minimum without the padding showing. */
.tap {
  position: relative;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
}
.tap-sm { min-height: 44px; display: inline-flex; align-items: center; }
/* Six columns of paystub don't fit a phone. Stack each row into a labelled
   block instead of making a 640px table scroll sideways. */
@media (max-width: 640px) {
  .stub-table, .stub-table tbody, .stub-table tr, .stub-table td { display: block; width: auto; }
  .stub-table { min-width: 0 !important; }

@media (max-width: 560px) {

/* ─── navigation ─── */

@media (max-width: 720px) {
  .topnav-inner { justify-content: center; height: 52px; }

  .wordmark .seal { width: 32px; height: 32px; }

  .bottomnav {

.nw-grid {

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef, useContext } = React;

const FONT = "var(--font)";

const fmt = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
const fmt0 = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

const n = (v) => parseFloat(v) || 0;

const EMPLOYERS = ["CCMC", "NorthBay", "Sutter"];

const EMPLOYER_META = {
  CCMC:     { color: "#a4545f", logo: "/logos/ccmc.png",     full: "Community Medical Centers" },
  NorthBay: { color: "#6f9e80", logo: "/logos/northbay.jpg", full: "NorthBay Healthcare" },
  Sutter:   { color: "#6fa8a2", logo: "/logos/sutter.png",   full: "Sutter Health" },
};

const colorFor = (emp) => EMPLOYER_META[emp]?.color || "#93c4a2";

const formatPayDate = (iso) => {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  const dt = new Date(Number(y), Number(m) - 1, Number(d));
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
};

/* ─── shared bits ─── */

function Field({ label, value, onChange, suffix = "", placeholder = "—" }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ fontSize: 13.5, letterSpacing: "0", color: "#9b9386" }}>{label}</span>
      <div style={{ display: "flex", alignItems: "center", borderBottom: "1px solid #5a554c", paddingBottom: 8 }}>
        <input type="number" step="0.01" value={value} placeholder={placeholder} onChange={onChange}
          style={{ background: "transparent", border: "none", outline: "none", color: "#f6f1e7", fontFamily: FONT, fontSize: 18, width: "100%" }} />
        {suffix && <span style={{ color: "#9b9386", fontSize: 13.5, marginLeft: 4 }}>{suffix}</span>}
      </div>
    </div>
  );
}

function Line({ label, value, highlight = false, muted = false, large = false, note = "" }) {
  return (
    <div style={{
      display: "flex", justifyContent: "space-between", alignItems: "baseline",
      padding: large ? "18px 0 0" : "9px 0",
      borderTop: large ? "1px solid #5a554c" : "none",
    }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
        <span style={{ fontSize: 12.5, letterSpacing: "0", color: muted ? "#8b8477" : "#ddd4c5" }}>{label}</span>
        {note && <span style={{ fontSize: 13.5, color: "#8b8477", fontFamily: FONT }}>{note}</span>}
      </div>
      <span style={{ fontFamily: FONT, fontSize: large ? 23 : 14, fontWeight: large ? 600 : 450, color: highlight ? "#93c4a2" : muted ? "#8b8477" : "#ece5d8" }}>{value}</span>
    </div>
  );
}

/* ─── routing ───
   Every page and sub-tab has its own address, like a normal website, so the
   back button, refresh and bookmarks all work. "/" is Net Worth; a page's
   first sub-tab is the bare page address (/dashboard), the rest add a
   segment (/dashboard/paystubs). worker.js serves index.html for these. */

const PAGES = { worth: "networth", dash: "dashboard", calc: "pay", cards: "cards", prop: "property" };

function parsePath(pathname) {
  const [first = "", second = ""] = pathname.replace(/^\/+|\/+$/g, "").split("/");
  const view = Object.keys(PAGES).find((k) => PAGES[k] === first);
  if (!view) return { view: "worth", sub: "", known: first === "" };
  return { view, sub: second ? decodeURIComponent(second) : "", known: true };
}

const pathFor = (view, sub) =>
  sub ? `/${PAGES[view]}/${encodeURIComponent(sub)}` : view === "worth" ? "/" : `/${PAGES[view]}`;

const RouteContext = React.createContext({ view: "worth", sub: "", navigate: () => {} });

function useRouter() {
  const [route, setRoute] = useState(() => {
    const r = parsePath(window.location.pathname);
    // An address we don't know (e.g. /foo) becomes the home page.
    if (!r.known) window.history.replaceState(null, "", "/");
    return r;
  });
  useEffect(() => {
    const onPop = () => setRoute(parsePath(window.location.pathname));
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  const navigate = useCallback((path) => {
    if (path === window.location.pathname) return;
    const next = parsePath(path);
    window.history.pushState(null, "", path);
    setRoute((prev) => {
      // New page starts at the top; switching sub-tabs keeps your place.
      if (prev.view !== next.view) window.scrollTo(0, 0);
      return next;
    });
  }, []);
  return { view: route.view, sub: route.sub, navigate };
}

/* Sub-tab state kept in the address. `first` is the default sub-tab;
   `valid` (when known) sends a stale or mistyped sub-tab back to it. */
function useSubRoute(view, first, valid) {
  const { sub, navigate } = useContext(RouteContext);
  const value = sub && (!valid || valid.includes(sub)) ? sub : first;
  const href = (key) => pathFor(view, key === first ? "" : key);
  return [value, (key) => navigate(href(key)), href];
}

/* An in-app link: a plain click swaps the page without reloading; cmd/ctrl-
   click or long-press still opens it in a new tab like any other link. */
function Link({ to, onNavigate, children, ...rest }) {
  const { navigate } = useContext(RouteContext);
  const onClick = (e) => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    onNavigate ? onNavigate() : navigate(to);
  };
  return <a href={to} onClick={onClick} {...rest}>{children}</a>;
}

/* ─── tab bar ─── */

const NAV = [
  ["worth", "Net Worth", <path d="M3 17l5-5 4 4 8-9M15 7h5v5" />],
  ["dash", "Dashboard", <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />],
  ["calc", "Pay Calc", <g><rect x="5" y="2.5" width="14" height="19" rx="2.5" /><path d="M8.5 7h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01" /></g>],
  ["cards", "Cards", <g><rect x="2.5" y="5" width="19" height="14" rx="2.5" /><path d="M2.5 10h19M6.5 15h4" /></g>],
  ["prop", "Property", <path d="M3 11l9-7 9 7M5.5 9.5V20h13V9.5M10 20v-5h4v5" />],
];

const NavIcon = ({ children }) => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"
    strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{children}</svg>
);

/* Desktop: a slim header with the wordmark and text tabs. Phone: the header
   keeps only the wordmark and the tabs move to a bar along the bottom. */
function TabBar({ view }) {
  return (
    <>
      <header className="topnav">
        <div className="topnav-inner">
          <div className="wordmark"><img src="/logos/gc-seal.png" alt="" className="seal" /><span>Gill <em>&amp;</em> Co.</span></div>
          <nav className="topnav-tabs">
            {NAV.map(([key, label]) => (
              <Link key={key} to={pathFor(key, "")} className={view === key ? "active" : ""}
                aria-current={view === key ? "page" : undefined}>{label}</Link>
            ))}
          </nav>
        </div>
      </header>
      <nav className="bottomnav">
        {NAV.map(([key, label, icon]) => (
          <Link key={key} to={pathFor(key, "")} className={view === key ? "active" : ""} aria-label={label}
            aria-current={view === key ? "page" : undefined}>
            <NavIcon>{icon}</NavIcon>
            <span>{label}</span>
          </Link>
        ))}
      </nav>
    </>
  );
}

/* Section tabs inside a page: text with a gold underline. */
function SubTabs({ options, value, onChange, href }) {
  return (
    <div className="subtabs" role="tablist">
      {options.map(([key, label]) => (
        <Link key={key} to={href(key)} onNavigate={() => onChange(key)} role="tab" aria-selected={value === key}
          className={value === key ? "active" : ""}>{label}</Link>
      ))}
    </div>
  );
}

/* ─── Pay Calc (unchanged) ─── */

function useHistory(initial) {
  const [history, setHistory] = useState([initial]);
  const [cursor, setCursor] = useState(0);
  const state = history[cursor];
  const set = useCallback((updater) => {
    setHistory((prev) => {
      const next = typeof updater === "function" ? updater(prev[cursor]) : updater;
      return [...prev.slice(0, cursor + 1), next];
    });
    setCursor((c) => c + 1);
  }, [cursor]);
  const undo = useCallback(() => setCursor((c) => Math.max(0, c - 1)), []);
  const redo = useCallback(() => setCursor((c) => Math.min(history.length - 1, c + 1)), [history.length]);
  return { state, set, undo, redo, canUndo: cursor > 0, canRedo: cursor < history.length - 1 };
}

const CALC_INIT = { w1: "", w2: "", deductions: 35 };
// Straight day-shift rate only. Evening/night/weekend differentials are
// deliberately excluded so the estimate reflects pay you can count on.
const SUTTER_BASE   = 78.31;
const SUTTER_OT     = SUTTER_BASE * 1.5;  // 117.465
const WEEKLY_OT_THRESHOLD = 40;
const weekPay = (hrs) => {
  const h = parseFloat(hrs) || 0;
  if (h <= 0) return { hrs: 0, st: 0, ot: 0, total: 0 };
  if (h <= WEEKLY_OT_THRESHOLD) return { hrs: h, st: h * SUTTER_BASE, ot: 0, total: h * SUTTER_BASE };
  const st = WEEKLY_OT_THRESHOLD * SUTTER_BASE;
  const otPay = (h - WEEKLY_OT_THRESHOLD) * SUTTER_OT;
  return { hrs: h, st, ot: otPay, total: st + otPay };
};

function Calc() {
  const { state, set, undo, redo, canUndo, canRedo } = useHistory(CALC_INIT);
  const { w1, w2, deductions } = state;
  const update = (key) => (e) => set((s) => ({ ...s, [key]: e.target.value }));

  const w1Pay = weekPay(w1);
  const w2Pay = weekPay(w2);
  const stTotal = w1Pay.st + w2Pay.st;
  const otTotal = w1Pay.ot + w2Pay.ot;
  const totalGross = w1Pay.total + w2Pay.total;
  const dedPct    = n(deductions);
  const dedAmt    = totalGross * (dedPct / 100);
  const totalNet  = totalGross - dedAmt;
  const hasData   = totalGross > 0;
  const iconColor = (active) => active ? "#ddd4c5" : "#716a5f";

  return (
    <div style={{ display: "flex", justifyContent: "center", padding: "28px 24px 48px" }}>
      <div style={{ width: "100%", maxWidth: 420 }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 52 }}>
          <div>
            <p className="eyebrow">Sutter · biweekly</p>
            <h1 style={{ margin: 0, lineHeight: 1.05 }}>Pay Calculator</h1>
          </div>

/* Hover a slice or legend row (tap on a phone) to focus it. `active` and
   `onActive` are optional, for pages that show more detail elsewhere. */
function PieChart({ data, size = 240, centerLabel = "YTD GROSS", active: activeProp, onActive }) {
  const [own, setOwn] = useState(null);
  const active = activeProp !== undefined ? activeProp : own;
  const setActive = (i) => { setOwn(i); onActive && onActive(i); };
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) {
    return (
      <div style={{ textAlign: "center", color: "#716a5f", fontFamily: FONT, padding: "40px 0" }}>
        No data
      </div>
    );
  }
  const pad = 8;
  const cx = size / 2, cy = size / 2, r = size / 2 - pad, innerR = r * 0.6;
  let cum = -Math.PI / 2;
  const slices = data.map((d) => {
    const angle = (d.value / total) * Math.PI * 2;
    const a1 = cum, a2 = cum + angle;
    cum = a2;
    const large = angle > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const xi1 = cx + innerR * Math.cos(a1), yi1 = cy + innerR * Math.sin(a1);
    const xi2 = cx + innerR * Math.cos(a2), yi2 = cy + innerR * Math.sin(a2);
    const path = `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${innerR} ${innerR} 0 ${large} 0 ${xi1} ${yi1} Z`;
    const mid = (a1 + a2) / 2;
    return { path, color: d.color, label: d.label, value: d.value, pct: (d.value / total) * 100, dx: Math.cos(mid) * 6, dy: Math.sin(mid) * 6 };
  });
  const focus = active != null ? slices[active] : null;
  const toggle = (i) => setActive(active === i ? null : i);
  // Hover follows a real mouse only; a tap fires a fake hover before its
  // click, which would otherwise select and then immediately unselect.
  const isMouse = (e) => e.pointerType === "mouse";
  const lastPointer = useRef("mouse");
  const pick = (i) => (lastPointer.current === "mouse" ? setActive(i) : toggle(i));

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: "100%" }}>
      <svg width={size} height={size} style={{ overflow: "visible" }} onPointerLeave={(e) => isMouse(e) && setActive(null)}
        onPointerDown={(e) => { lastPointer.current = e.pointerType; }}>
        {slices.map((s, i) => (
          <path key={i} d={s.path} fill={s.color} stroke="#0c0b0a" strokeWidth="2"
            transform={active === i ? `translate(${s.dx} ${s.dy})` : undefined}
            opacity={active != null && active !== i ? 0.35 : 1}
            style={{ cursor: "pointer", transition: "transform 0.15s ease, opacity 0.15s ease" }}
            onPointerEnter={(e) => isMouse(e) && setActive(i)} onClick={() => pick(i)} />
        ))}
        <text x={cx} y={cy - 6} textAnchor="middle" style={{ fill: focus ? focus.color : "#9b9386", fontSize: 11, letterSpacing: "0.12em", fontFamily: FONT, textTransform: "uppercase" }}>
          {focus ? (focus.label.length > 22 ? focus.label.slice(0, 21) + "…" : focus.label) : centerLabel}
        </text>
        <text x={cx} y={cy + 20} textAnchor="middle" style={{ fill: "#f6f1e7", fontSize: 21, fontFamily: FONT, fontWeight: 600 }}>
          {fmt0(focus ? focus.value : total)}
        </text>
        {focus && (
          <text x={cx} y={cy + 40} textAnchor="middle" style={{ fill: "#8b8477", fontSize: 12, fontFamily: FONT }}>{focus.pct.toFixed(1)}% of total</text>
        )}
      </svg>
      <div style={{ marginTop: 20, display: "flex", flexDirection: "column", width: "100%" }}>
        {slices.map((s, i) => (
          <div key={i} onPointerEnter={(e) => isMouse(e) && setActive(i)} onPointerLeave={(e) => isMouse(e) && setActive(null)}
            onPointerDown={(e) => { lastPointer.current = e.pointerType; }}
            onClick={() => pick(i)}
            style={{
              display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, cursor: "pointer",
              padding: "6px 8px", margin: "0 -8px", borderRadius: 8,
              background: active === i ? "rgba(240,228,208,0.05)" : "transparent",
              opacity: active != null && active !== i ? 0.55 : 1, transition: "opacity 0.15s ease",
            }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, flexShrink: 0 }} />
              <span style={{ fontSize: 12.5, color: "#ddd4c5", fontFamily: FONT, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.label}</span>
            </div>
            <div style={{ display: "flex", gap: 12, alignItems: "baseline", flexShrink: 0 }}>
              <span style={{ fontFamily: FONT, fontSize: 13.5, color: "#ece5d8" }}>{fmt0(s.value)}</span>
              <span style={{ fontFamily: FONT, fontSize: 12.5, color: "#8b8477", minWidth: 44, textAlign: "right" }}>{s.pct.toFixed(1)}%</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ProjectionCard({ ytdGross, projection, paystubs }) {
  if (!projection || !projection.monthly) return null;
  const actualsByMonth = {};
  for (const p of paystubs || []) {
    if (!p.pay_date) continue;
    const ym = p.pay_date.slice(0, 7);
    if (!actualsByMonth[ym]) actualsByMonth[ym] = {};
    actualsByMonth[ym][p.employer] = (actualsByMonth[ym][p.employer] || 0) + n(p.gross);
  }
  let remaining = 0;
  const byEmployer = {};
  for (const ym in projection.monthly) {
    for (const emp in projection.monthly[ym]) {
      const proj = n(projection.monthly[ym][emp]);
      const actual = (actualsByMonth[ym] && actualsByMonth[ym][emp]) || 0;
      const rem = Math.max(0, proj - actual);
      remaining += rem;
      if (rem > 0) byEmployer[emp] = (byEmployer[emp] || 0) + rem;
    }
  }
  const total = ytdGross + remaining;
  const empKeys = [
    ...EMPLOYERS.filter((e) => byEmployer[e]),
    ...Object.keys(byEmployer).filter((e) => !EMPLOYERS.includes(e)),
  ];
  return (
    <div style={{
      background: "#141311",
      border: "1px solid rgba(240,228,208,0.08)", borderRadius: 16, padding: 28,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24, flexWrap: "wrap", gap: 16 }}>
        <div>
          <div style={{ fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "#9b9386", marginBottom: 12 }}>2026 Year-End Projection</div>
          <div style={{ fontFamily: FONT, fontSize: 34, color: "#93c4a2", fontWeight: 600, lineHeight: 1, letterSpacing: "-0.01em" }}>{fmt(total)}</div>
          <div style={{ fontFamily: FONT, fontSize: 12.5, color: "#8b8477", marginTop: 10 }}>
            {fmt(ytdGross)} earned + {fmt(remaining)} projected
          </div>
        </div>
        {projection.notes && (
          <details className="fine" style={{ maxWidth: 360, fontFamily: FONT }}>
            <summary>How this is projected</summary>
            <div style={{ color: "#9b9386", fontSize: 12.5, lineHeight: 1.55, marginTop: 8 }}>{projection.notes}</div>
          </details>
        )}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 16 }}>
        <div style={{ borderLeft: "2px solid #5a554c", paddingLeft: 14 }}>
          <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#8b8477", marginBottom: 6 }}>YTD Earned</div>
          <div style={{ fontFamily: FONT, fontSize: 18, color: "#ece5d8" }}>{fmt(ytdGross)}</div>
        </div>
        {empKeys.map((emp) => (
          <div key={emp} style={{ borderLeft: `2px solid ${colorFor(emp)}`, paddingLeft: 14 }}>
            <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#8b8477", marginBottom: 6 }}>Projected {emp}</div>
            <div style={{ fontFamily: FONT, fontSize: 18, color: "#ece5d8" }}>{fmt(byEmployer[emp])}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function ChartTooltip({ ym, data, metric, showProjected = true, x, y, containerW }) {
  const [yearStr, monthStr] = ym.split("-");
  const monthName = MONTH_LABELS[Number(monthStr) - 1] + " " + yearStr;
  const stubs = data.stubs || [];
  const projByEmp = showProjected ? (data.projByEmp || {}) : {};
  const hasActual = stubs.length > 0;
  const hasProj = Object.keys(projByEmp).length > 0;

  let totalGross = 0, totalNet = 0;
  for (const p of stubs) {
    totalGross += n(p.gross);
    totalNet += n(p.net);
  }
  for (const emp in projByEmp) {
    totalGross += n(projByEmp[emp].gross);
    totalNet += n(projByEmp[emp].netProxy);
  }
  const totalShown = metric === "net" ? totalNet : totalGross;
  const totalColor = metric === "net" ? "#93c4a2" : "#ece5d8";

  const tipW = 280;
  let left = x + 16;
  if (containerW && left + tipW > containerW - 12) left = Math.max(8, x - tipW - 16);
  const top = Math.max(8, y - 20);

  const label = hasProj && !hasActual ? "Projected" : hasProj && hasActual ? "Partial" : "";

  return (
    <div style={{
      position: "absolute", left, top, width: tipW,
      background: "rgba(12,11,10,0.97)", border: "1px solid #3d3933",
      borderRadius: 10, padding: "12px 14px",
      pointerEvents: "none", zIndex: 10,
      boxShadow: "0 8px 24px rgba(0,0,0,0.5)",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10, gap: 8 }}>
        <div style={{ fontSize: 12.5, letterSpacing: "0", color: "#ece5d8", fontFamily: FONT }}>{monthName}</div>
        {label && <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#c9a96e", fontFamily: FONT }}>{label}</div>}
      </div>

      {hasActual && (
        <div style={{ marginBottom: hasProj ? 12 : 0 }}>
          {stubs.map((p, i) => (
            <div key={i} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "6px 0", borderTop: i === 0 ? "none" : "1px solid rgba(240,228,208,0.05)",
              fontSize: 12.5, fontFamily: FONT, gap: 12,
            }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ color: colorFor(p.employer), fontSize: 13.5, letterSpacing: "0.1em" }}>{p.employer}</div>
                <div style={{ color: "#8b8477", fontSize: 13.5, marginTop: 2 }}>{formatPayDate(p.pay_date)}</div>
              </div>
              <div style={{ color: "#ece5d8", whiteSpace: "nowrap" }}>{fmt(metric === "net" ? n(p.net) : n(p.gross))}</div>
            </div>
          ))}
        </div>
      )}

      {hasProj && (
        <div>
          {hasActual && <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#c9a96e", fontFamily: FONT, marginBottom: 6 }}>Still Projected</div>}
          {Object.keys(projByEmp).map((emp) => {
            const v = metric === "net" ? n(projByEmp[emp].netProxy) : n(projByEmp[emp].gross);
            return (
              <div key={emp} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 12.5, fontFamily: FONT }}>
                <span style={{ color: colorFor(emp), fontSize: 13.5, letterSpacing: "0.1em" }}>{emp}</span>
                <span style={{ color: "#ece5d8", opacity: 0.75 }}>{fmt(v)}</span>

        </div>
      )}

      {!hasActual && !hasProj && (
        <div style={{ fontFamily: FONT, color: "#8b8477", fontSize: 13.5 }}>No paychecks this month.</div>
      )}

      <div style={{ borderTop: "1px solid #3d3933", marginTop: 10, paddingTop: 10, display: "flex", justifyContent: "space-between", fontFamily: FONT }}>
        <span style={{ color: "#9b9386", letterSpacing: "0", fontSize: 13.5 }}>Total {metric}</span>
        <span style={{ color: totalColor, fontSize: 13.5, fontWeight: 500 }}>{fmt(totalShown)}</span>
      </div>
    </div>
  );
}

function MonthlyChart({ paystubs, projection, year }) {
  const [metric, setMetric] = useState("gross");
  const [showProjected, setShowProjected] = useState(true);
  const [hovered, setHovered] = useState(null);
  const containerRef = useRef(null);

  const ratios = useMemo(() => {
    const r = {};
    for (const p of paystubs) {
      if (!r[p.employer]) r[p.employer] = { g: 0, n: 0 };
      r[p.employer].g += n(p.gross);
      r[p.employer].n += n(p.net);
    }
    const out = {};
    for (const e in r) out[e] = r[e].g > 0 ? r[e].n / r[e].g : 1;
    return out;
  }, [paystubs]);

  const monthly = {};
  for (let m = 1; m <= 12; m++) {
    const ym = `${year}-${String(m).padStart(2, "0")}`;
    monthly[ym] = { stubs: [], actualByEmp: {}, projByEmp: {}, hasProjection: false };
  }
  for (const p of paystubs) {
    if (!p.pay_date) continue;
    const ym = p.pay_date.slice(0, 7);
    if (!monthly[ym]) continue;
    monthly[ym].stubs.push(p);
    if (!monthly[ym].actualByEmp[p.employer]) monthly[ym].actualByEmp[p.employer] = { gross: 0, net: 0 };
    monthly[ym].actualByEmp[p.employer].gross += n(p.gross);
    monthly[ym].actualByEmp[p.employer].net += n(p.net);
  }
  if (projection && projection.monthly) {
    for (const ym in projection.monthly) {
      if (!monthly[ym]) continue;
      const mp = projection.monthly[ym];
      for (const emp in mp) {
        const projected = n(mp[emp]);
        const actualGross = (monthly[ym].actualByEmp[emp] && monthly[ym].actualByEmp[emp].gross) || 0;
        const remaining = Math.max(0, projected - actualGross);
        if (remaining > 0.01) {
          const rat = ratios[emp] != null ? ratios[emp] : 1;
          monthly[ym].projByEmp[emp] = { gross: remaining, netProxy: remaining * rat };
          monthly[ym].hasProjection = true;
        }
      }
    }
  }

  const handleHover = (ym) => (e) => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    setHovered({ ym, x: e.clientX - rect.left, y: e.clientY - rect.top });
  };
  const handleLeave = () => setHovered(null);
  const monthsArr = Object.keys(monthly).sort();
  const grossTotals = monthsArr.map((k) => {
    const m = monthly[k];
    let total = 0;
    for (const emp in m.actualByEmp) total += m.actualByEmp[emp].gross;
    for (const emp in m.projByEmp) total += m.projByEmp[emp].gross;
    return total;
  });
  const max = Math.max(...grossTotals, 1);
  const yMax = Math.ceil(max / 5000) * 5000 || 5000;

  const W = 800, H = 280, ML = 56, MR = 12, MT = 12, MB = 30;
  const innerW = W - ML - MR;
  const innerH = H - MT - MB;
  const slot = innerW / 12;
  const barWidth = slot * 0.62;

  const gridSteps = 4;
  const gridLines = [];
  for (let i = 0; i <= gridSteps; i++) {
    const val = (yMax / gridSteps) * i;
    const y = MT + innerH - (val / yMax) * innerH;
    gridLines.push({ val, y });
  }

  const allEmployers = [
    ...EMPLOYERS,
    ...Array.from(new Set(monthsArr.flatMap((k) => [
      ...Object.keys(monthly[k].actualByEmp),
      ...Object.keys(monthly[k].projByEmp),
    ]))).filter((e) => !EMPLOYERS.includes(e)),
  ];

  return (
    <div ref={containerRef} style={{
      background: "#141311",
      border: "1px solid rgba(240,228,208,0.08)", borderRadius: 16, padding: 24,
      position: "relative",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
          <div style={{ fontSize: 13.5, letterSpacing: "0", color: "#9b9386" }}>
            Monthly {metric === "net" ? "Net" : "Gross"} · {year}
          </div>
          <div style={{ display: "flex", gap: 2, background: "#0e0d0c", border: "1px solid rgba(240,228,208,0.08)", borderRadius: 8, padding: 2 }}>
            {[["gross", "Gross"], ["net", "Net"]].map(([key, label]) => {
              const active = metric === key;
              return (
                <button key={key} onClick={() => setMetric(key)} style={{
                  background: active ? (key === "net" ? "#93c4a2" : "#ece5d8") : "transparent",
                  color: active ? "#0c0b0a" : "#8b8477",
                  border: "none", borderRadius: 6, padding: "0 14px", cursor: "pointer",
                  minHeight: 44, display: "inline-flex", alignItems: "center", justifyContent: "center",
                  fontSize: 13.5, letterSpacing: "0",
                  fontFamily: FONT, fontWeight: 500,
                }}>{label}</button>
              );
            })}
          </div>
          <button onClick={() => setShowProjected((v) => !v)} style={{
            display: "flex", alignItems: "center", gap: 7,
            background: showProjected ? "rgba(201,169,110,0.12)" : "transparent",
            border: `1px solid ${showProjected ? "#c9a96e" : "#4a453e"}`,
            borderRadius: 8, padding: "0 14px", minHeight: 44, cursor: "pointer",
            fontSize: 13.5, letterSpacing: "0",
            color: showProjected ? "#c9a96e" : "#8b8477", fontFamily: FONT,
          }}>
            <span style={{
              width: 9, height: 9, borderRadius: 2,
              background: showProjected ? "rgba(201,169,110,0.35)" : "transparent",
              border: `1px dashed ${showProjected ? "#c9a96e" : "#8b8477"}`,
            }} />
            Projected
          </button>
        </div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
          {allEmployers.map((emp) => (
            <div key={emp} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: colorFor(emp) }} />
              <span style={{ fontSize: 13.5, letterSpacing: "0", color: "#ddd4c5", fontFamily: FONT }}>{emp}</span>
            </div>
          ))}
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 10, height: 10, borderRadius: 3, background: "transparent", border: "1px dashed #7a7367" }} />
            <span style={{ fontSize: 13.5, letterSpacing: "0", color: "#8b8477", fontFamily: FONT }}>Projected</span>
          </div>
        </div>
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
        {gridLines.map((g, i) => (
          <g key={i}>
            <line x1={ML} x2={W - MR} y1={g.y} y2={g.y}
              stroke="rgba(240,228,208,0.08)" strokeWidth="1"
              strokeDasharray={i === 0 ? "" : "2,4"} />
            <text x={ML - 8} y={g.y + 3} textAnchor="end"
              style={{ fill: "#716a5f", fontSize: 11.5, fontFamily: FONT }}>
              {g.val >= 1000 ? `$${(g.val / 1000).toFixed(0)}k` : `$${g.val.toFixed(0)}`}
            </text>
          </g>
        ))}
        {monthsArr.map((ym, i) => {
          const data = monthly[ym];
          const x = ML + slot * i + (slot - barWidth) / 2;
          let yCursor = MT + innerH;
          const empSet = new Set([...Object.keys(data.actualByEmp), ...Object.keys(data.projByEmp)]);
          const empOrder = [
            ...EMPLOYERS.filter((e) => empSet.has(e)),
            ...Array.from(empSet).filter((e) => !EMPLOYERS.includes(e)),
          ];
          const segments = [];
          for (const emp of empOrder) {
            const act = data.actualByEmp[emp];
            if (act) {
              const val = metric === "net" ? act.net : act.gross;
              if (val > 0) {
                const h = (val / yMax) * innerH;
                yCursor -= h;
                segments.push({ x, y: yCursor, w: barWidth, h, color: colorFor(emp), emp, isProjection: false });
              }
            }
            const proj = data.projByEmp[emp];
            if (proj && showProjected) {
              const val = metric === "net" ? proj.netProxy : proj.gross;
              if (val > 0) {
                const h = (val / yMax) * innerH;
                yCursor -= h;
                segments.push({ x, y: yCursor, w: barWidth, h, color: colorFor(emp), emp, isProjection: true });
              }
            }
          }
          const monthTotal = segments.reduce((s, seg) => s + (seg.h * yMax) / innerH, 0);
          const isHovered = hovered && hovered.ym === ym;
          const isAllProjection = data.stubs.length === 0 && data.hasProjection && showProjected;
          return (
            <g key={ym}>
              {segments.map((s, j) => (
                <rect key={j} x={s.x} y={s.y} width={s.w} height={s.h}
                  fill={s.isProjection ? `${s.color}55` : s.color}
                  stroke={s.isProjection ? s.color : "none"}
                  strokeDasharray={s.isProjection ? "3,3" : ""}
                  strokeWidth="1.5" rx="2"
                  opacity={hovered && !isHovered ? 0.45 : 1} />
              ))}
              {monthTotal > 0 && (
                <text x={x + barWidth / 2} y={MT + innerH - (monthTotal / yMax) * innerH - 6}
                  textAnchor="middle"
                  style={{ fill: isAllProjection ? "#8b8477" : "#ece5d8", fontSize: 12.5, fontFamily: FONT }}>
                  {monthTotal >= 1000 ? `$${(monthTotal / 1000).toFixed(1)}k` : ""}
                </text>
              )}
              <text x={x + barWidth / 2} y={H - MB + 18} textAnchor="middle"
                style={{ fill: isAllProjection ? "#716a5f" : "#9b9386", fontSize: 13.5, fontFamily: FONT }}>
                {MONTH_LABELS[i]}
              </text>
              <rect x={ML + slot * i} y={MT} width={slot} height={innerH}
                fill="transparent" style={{ cursor: "pointer" }}
                onMouseEnter={handleHover(ym)}
                onMouseMove={handleHover(ym)}
                onMouseLeave={handleLeave} />
            </g>
          );
        })}
      </svg>
      {hovered && monthly[hovered.ym] && (
        <ChartTooltip ym={hovered.ym} data={monthly[hovered.ym]}
          metric={metric} showProjected={showProjected}
          x={hovered.x} y={hovered.y}
          containerW={containerRef.current ? containerRef.current.clientWidth : 800} />
      )}
    </div>
  );
}

          value={sub} onChange={setSub} />

/* ─── Cards ─── */

const CADENCE_META = {
  monthly:    { label: "Monthly",     order: 1 },
  quarterly:  { label: "Quarterly",   order: 2 },
  semiannual: { label: "Semi-Annual", order: 3 },
  annual:     { label: "Annual",      order: 4 },
  multiyear:  { label: "Multi-Year",  order: 5 },
};

// Every period in `year` for a cadence, tagged past / current / future.
const periodsFor = (cadence, year, today) => {
  const now = today || new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  const rel = (startM, endM) => {
    if (year < curY) return "past";
    if (year > curY) return "future";
    if (curM > endM) return "past";
    if (curM < startM) return "future";
    return "current";
  };
  // Last calendar day of month `m` — day 0 of the next month.
  const endOf = (m) => new Date(year, m + 1, 0);
  const out = [];
  if (cadence === "monthly") {
    for (let i = 0; i < 12; i++) {
      out.push({ key: `${year}-${String(i + 1).padStart(2, "0")}`, label: MONTH_LABELS[i], when: rel(i, i), end: endOf(i) });
    }
  } else if (cadence === "quarterly") {
    for (let i = 0; i < 4; i++) {
      out.push({ key: `${year}-Q${i + 1}`, label: `Q${i + 1}`, when: rel(i * 3, i * 3 + 2), end: endOf(i * 3 + 2) });
    }
  } else if (cadence === "semiannual") {
    out.push({ key: `${year}-H1`, label: "Jan–Jun", when: rel(0, 5),  end: endOf(5) });
    out.push({ key: `${year}-H2`, label: "Jul–Dec", when: rel(6, 11), end: endOf(11) });
  } else if (cadence === "annual") {
    out.push({ key: `${year}`, label: String(year), when: rel(0, 11), end: endOf(11) });
  } else {
    out.push({ key: "once", label: "One-time", when: "current", end: new Date(year + 50, 0, 1) });
  }
  return out;
};

const DAY_MS = 86400000;
const daysUntil = (d, today) => {
  const now = today || new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((b - a) / DAY_MS);
};

const benefitStatus = (benefit, year) => {
  const periods = periodsFor(benefit.cadence, year);
  const per = n(benefit.per);
  // An `auto` credit reimburses a charge the card already pays on its own
  // (Disney+, Walmart+), so every period that has come round is captured
  // whether or not anyone ticked it off. Counting those implicitly keeps them
  // out of the to-do list in perpetuity — no monthly upkeep in cards.json.
  const cs = new Set(benefit.claimed || []);
  if (benefit.auto) {
    for (const p of periods) if (p.when !== "future") cs.add(p.key);
  }
  const hits = periods.filter((p) => cs.has(p.key));
  const open = periods.filter((p) => !cs.has(p.key) && p.when === "current");
  // Done for the year: every period claimed, or — for auto-recurring credits —
  // everything up to now, since the rest posts on its own.
  const allClaimed = periods.every((p) => cs.has(p.key));
  const autoDone = !!benefit.auto && periods.filter((p) => p.when !== "future").every((p) => cs.has(p.key));
  // A benefit can override its deadline (e.g. credits that reset on the card
  // anniversary rather than the calendar year).
  const override = benefit.expires ? new Date(benefit.expires + "T00:00:00") : null;
  const expiresAt = open.length ? (override || open[0].end) : null;
  return {
    periods, claimedSet: cs, hits, open, per,
    complete: allClaimed || autoDone,
    captured: hits.length * per,
    total: periods.length * per,
    atStake: open.length * per,
    expiresAt,
    daysLeft: expiresAt ? daysUntil(expiresAt) : null,
  };
};

function PeriodChip({ period, hit, wide, pendingAuto }) {
  // Captured is captured: every claimed period reads green, whether or not the
  // rest of the year is done. What still needs doing stays amber.
  let bg = "transparent", border = "rgba(240,228,208,0.055)", color = "#4a453e", weight = 450;
  if (hit)                            { bg = "rgba(147,196,162,0.13)";  border = "transparent"; color = "#93c4a2"; }
  else if (pendingAuto)               { bg = "transparent"; border = "rgba(147,196,162,0.28)"; color = "#6f9e80"; }
  else if (period.when === "current") { bg = "rgba(201,169,110,0.14)"; border = "#c9a96e"; color = "#c9a96e"; weight = 550; }
  return (
    <div style={{
      minWidth: wide ? 58 : 27, height: 19, padding: "0 4px", flexShrink: 0,
      borderRadius: 4, background: bg, border: `1px solid ${border}`, color,
      fontFamily: FONT, fontSize: 12.5, fontWeight: weight,
      display: "flex", alignItems: "center", justifyContent: "center",
    }}>{period.label}</div>
  );
}

function CardBlock({ card, year }) {
  const accent = card.color || "#93c4a2";
  const [showPerks, setShowPerks] = useState(false);
  let captured = 0, total = 0, openN = 0;
  for (const b of card.benefits || []) {
    const st = benefitStatus(b, year);
    captured += st.captured;
    total    += st.total;
    openN    += st.open.length;
  }
  const pct = total ? (captured / total) * 100 : 0;

  const groups = {};
  for (const b of card.benefits || []) {
    if (!groups[b.cadence]) groups[b.cadence] = [];
    groups[b.cadence].push(b);
  }
  const cadences = Object.keys(groups).sort(
    (a, b) => (CADENCE_META[a]?.order || 99) - (CADENCE_META[b]?.order || 99)
  );

  return (
    <div style={{
      background: "#141311",
      border: "1px solid rgba(240,228,208,0.08)", borderLeft: `3px solid ${accent}`,
      borderRadius: 12, padding: "16px 18px", marginBottom: 12,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{
            width: 30, height: 20, borderRadius: 4, flexShrink: 0,
            background: `linear-gradient(135deg, ${accent} 0%, ${accent}88 100%)`,

          <span style={{ fontFamily: FONT, fontSize: 15.5, fontWeight: 600, color: "#f6f1e7", lineHeight: 1.2 }}>{card.name}</span>
          <span style={{ fontFamily: FONT, fontSize: 13.5, color: "#716a5f" }}>{fmt0(n(card.annual_fee))}/yr</span>
          {openN > 0 && (
            <span style={{ fontSize: 10.5, letterSpacing: "0.1em", color: "#c9a96e", border: "1px solid rgba(201,169,110,0.35)", background: "rgba(201,169,110,0.12)", borderRadius: 3, padding: "1px 5px", fontFamily: FONT }}>{openN} open</span>
          )}
        </div>
        <div style={{ fontFamily: FONT, fontSize: 13.5, color: accent }}>
          {fmt0(captured)}<span style={{ fontSize: 13.5, color: "#4a453e" }}> / {fmt0(total)}</span>
        </div>
      </div>

      <div style={{ height: 3, borderRadius: 3, background: "rgba(240,228,208,0.06)", marginBottom: 14, overflow: "hidden" }}>

        <div key={cad} style={{ marginBottom: 10 }}>

function Cards() {
  const [cards, setCards] = useState([]);
  const [year, setYear] = useState(new Date().getFullYear());
  const [firstYear, setFirstYear] = useState(new Date().getFullYear());
  const [lastUpdated, setLastUpdated] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [sub, setSub, subHref] = useSubRoute("cards", "claim", loaded ? ["claim", ...cards.map((c) => c.id)] : null);

  useEffect(() => {
    fetch("/cards.json", { cache: "no-store" })
      .then((r) => r.ok ? r.json() : { cards: [] })
      .then((data) => {
        setCards(Array.isArray(data.cards) ? data.cards : []);
        // `data.year` is the first year tracked, not the year to show. The view
        // always opens on the current calendar year so Jan 1 rolls over on its
        // own; earlier years stay reachable through the picker.
        if (data.year) setFirstYear(data.year);
        if (data.last_updated) setLastUpdated(data.last_updated);
        setLoaded(true);
      })
      .catch(() => setLoaded(true));
  }, []);

  // Claim keys already carry their year ("2026-03", "2026-Q1", "2026"), so a
  // new year needs no migration — its periods simply start out unclaimed.
  const years = useMemo(() => {
    const seen = new Set([new Date().getFullYear(), firstYear]);
    for (const c of cards) {
      for (const b of c.benefits || []) {
        for (const k of b.claimed || []) {
          const y = parseInt(String(k).slice(0, 4), 10);
          if (!isNaN(y)) seen.add(y);
        }
      }
    }
    return [...seen].sort((a, b) => b - a);
  }, [cards, firstYear]);

  const attention = useMemo(() => {
    const rows = [];
    for (const c of cards) {
      for (const b of c.benefits || []) {
        const st = benefitStatus(b, year);
        if (st.open.length) {
          rows.push({
            card: c, benefit: b, open: st.open, atStake: st.atStake,
            expiresAt: st.expiresAt, daysLeft: st.daysLeft,
          });
        }
      }
    }
    // Soonest deadline first; larger dollars break ties.
    return rows.sort((a, b) => (a.daysLeft - b.daysLeft) || (b.atStake - a.atStake));
  }, [cards, year]);

  return (
    <div className="nw-page" style={{ padding: "28px 24px 56px" }}>
      <div style={{ maxWidth: 1040, margin: "0 auto" }}>

        <div className="page-head">
          <div>
          <p className="eyebrow">Credits &amp; perks</p>
          <h1 style={{ margin: 0, lineHeight: 1.05 }}>
            Cards
            {years.length > 1 ? (
              <span style={{ display: "inline-flex", gap: 4, marginLeft: 12, verticalAlign: "middle" }}>
                {years.map((y) => (
                  <button key={y} onClick={() => setYear(y)} style={{
                    fontFamily: FONT, fontSize: 12.5, letterSpacing: "0.1em", cursor: "pointer",
                    padding: "2px 7px", borderRadius: 5, background: y === year ? "rgba(240,228,208,0.08)" : "transparent",
                    border: "1px solid " + (y === year ? "rgba(240,228,208,0.14)" : "transparent"),
                    color: y === year ? "#ddd4c5" : "#716a5f",
                  }}>{y}</button>
                ))}
              </span>
            ) : (
              <span style={{ fontFamily: FONT, fontSize: 12.5, color: "#716a5f", marginLeft: 12, letterSpacing: "0.1em" }}>{year}</span>
            )}
          </h1>
          </div>
          {lastUpdated && (
            <div style={{ fontFamily: FONT, fontSize: 12.5, color: "#8b8477" }}>
              Updated {formatPayDate(lastUpdated)}
            </div>
          )}
        </div>

        {loaded && cards.length > 0 && (
          <SubTabs value={sub} onChange={setSub} href={subHref}
            options={[["claim", attention.length ? `Claim now · ${attention.length}` : "Claim now"], ...cards.map((c) => [c.id, c.name])]} />
        )}

        {!loaded ? (
          <p style={{ color: "#716a5f", fontFamily: FONT }}>Loading…</p>
        ) : cards.length === 0 ? (
          <p style={{ color: "#716a5f", fontFamily: FONT }}>No cards yet.</p>
        ) : sub === "claim" ? (
          <AttentionPanel rows={attention} />
        ) : (
          cards.filter((c) => c.id === sub).map((c) => <CardBlock key={c.id} card={c} year={year} />)
        )}

        {sub !== "claim" && (
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center", marginTop: 6 }}>
          {[
            ["Captured", "rgba(147,196,162,0.13)", "#93c4a2"],
            ["Posts on its own", "transparent", "rgba(147,196,162,0.28)"],
            ["Open now", "rgba(201,169,110,0.12)", "#c9a96e"],
            ["Not claimed", "transparent", "rgba(240,228,208,0.07)"],
          ].map(([label, bg, border]) => (
            <div key={label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 12, height: 12, borderRadius: 3, background: bg, border: `1px solid ${border}` }} />
              <span style={{ fontFamily: FONT, fontSize: 11.5, letterSpacing: "0.1em", color: "#716a5f" }}>{label}</span>
            </div>
          ))}
          <span style={{ fontFamily: FONT, fontSize: 11.5, color: "#4a453e", marginLeft: "auto" }}>Hover a row for details</span>
        </div>
        )}

      </div>
    </div>
  );
}

  return (

        <span style={{ color: "#8b8477", fontSize: 14 }}>$</span>
        <input
          type="text" inputMode="decimal" value={text} placeholder="—"
          onFocus={() => { setFocused(true); setText(value === "" || value == null ? "" : String(value)); }}
          onBlur={() => {
            setFocused(false);
            const raw = parseFloat(text.replace(/,/g, ""));
            if (text.trim() === "" || isNaN(raw)) { onChange(""); setText(""); }
            else { onChange(raw); setText(commas(raw)); }

          onChange={(e) => {
            const cleaned = e.target.value.replace(/[^0-9.,]/g, "");
            setText(cleaned);
            const num = parseFloat(cleaned.replace(/,/g, ""));
            if (cleaned.trim() === "") onChange(""); else if (!isNaN(num)) onChange(num);

const LOAN_TERM_MONTHS = 360;

/* Pure deal math — everything downstream reads from this. */
function analyzeDeal(inp) {
  const sp = n(inp.salePrice), miscV = n(inp.misc), rehabV = n(inp.rehab), rentV = n(inp.rent);
  const ccPct = pctVal(inp.closingCostPct), ptRate = pctVal(inp.propTaxRate);
  const ir = pctVal(inp.interestRate), dp = pctVal(inp.downPct);
  const insV = n(inp.insurance), hoaV = n(inp.hoa), utilV = n(inp.utilities), lawV = n(inp.lawyer);
  const mgmt = pctVal(inp.mgmtPct), capex = pctVal(inp.capexPct), vac = pctVal(inp.vacancyPct);
  const repairs = pctVal(inp.repairsPct);

  const closingCost = sp * ccPct;
  const totalCost = sp + miscV + closingCost + rehabV;
  const annualPropTax = sp * ptRate;
  const monthlyPropTax = annualPropTax / 12;
  const mgmtFee = rentV * mgmt, capexAmt = rentV * capex, vacancyLoss = rentV * vac;
  const repairAmt = rentV * repairs;

  const downAmt = sp * dp;
  const loanAmt = Math.max(0, sp - downAmt);
  const r = ir / 12;
  /* A 0% loan still has to be repaid — amortize it straight-line rather than
     letting the mortgage silently cost nothing. */
  const pAndI = loanAmt <= 0 ? 0
    : ir > 0
      ? (loanAmt * r * Math.pow(1 + r, LOAN_TERM_MONTHS)) / (Math.pow(1 + r, LOAN_TERM_MONTHS) - 1)
      : loanAmt / LOAN_TERM_MONTHS;

  const rentBasedExp = mgmtFee + repairAmt + capexAmt + vacancyLoss;
  const fixedMonthlyExp = monthlyPropTax + insV + hoaV + utilV + lawV;
  const totalExpNoLoan = fixedMonthlyExp + rentBasedExp;
  const totalExpWithLoan = totalExpNoLoan + pAndI;
  const monthlyProfit = rentV - totalExpWithLoan;
  const annualProfit = monthlyProfit * 12;
  const cashNeeded = downAmt + closingCost + miscV + rehabV;
  const cashOnCash = cashNeeded > 0 ? annualProfit / cashNeeded : null;
  const dscr = pAndI > 0 ? (rentV - totalExpNoLoan) / pAndI : null;

  /* Remaining balance after m payments (closed form, clamped at payoff). */
  const balanceAfter = (m) => {
    if (loanAmt <= 0) return 0;
    const bal = r > 0
      ? loanAmt * Math.pow(1 + r, m) - (pAndI * (Math.pow(1 + r, m) - 1)) / r
      : loanAmt - pAndI * m;
    return Math.max(0, bal);
  };

  return {
    sp, miscV, rehabV, rentV, closingCost, totalCost, annualPropTax, monthlyPropTax,
    mgmtFee, repairAmt, capexAmt, vacancyLoss, insV, hoaV, utilV, lawV,
    mgmt, repairs, capex, vac, ptRate,
    ccPct, dp, ir, downAmt, loanAmt, pAndI, rentBasedExp, fixedMonthlyExp,
    totalExpNoLoan, totalExpWithLoan, monthlyProfit, annualProfit, cashNeeded,
    cashOnCash, dscr, balanceAfter,
    hasData: sp > 0 && rentV > 0,
  };
}

/* Year-by-year cash flow. Rent and the rent-linked expenses grow with rent;
   tax/insurance/HOA/utilities inflate; the mortgage payment is fixed. */
function cashFlowYears(d, rentGrowth, expInflation, years) {
  const rows = [];
  let cumulative = 0;
  for (let t = 0; t < years; t++) {
    const rent = d.rentV * Math.pow(1 + rentGrowth, t);
    const expenses = d.fixedMonthlyExp * Math.pow(1 + expInflation, t)
      + d.rentBasedExp * Math.pow(1 + rentGrowth, t)
      + d.pAndI;
    const profit = rent - expenses;
    cumulative += profit * 12;
    rows.push({
      year: t + 1, rent, expenses, profit,
      annual: profit * 12, cumulative,
      coc: d.cashNeeded > 0 ? (profit * 12) / d.cashNeeded : null,
    });
  }
  return rows;
}

/* Total return over `years`: rent profit + appreciation + principal paydown. */
function totalReturn(d, rentGrowth, expInflation, apprRate, years) {
  const rows = cashFlowYears(d, rentGrowth, expInflation, years);
  const cumCashFlow = rows.length ? rows[rows.length - 1].cumulative : 0;
  const apprGain = d.sp * Math.pow(1 + apprRate, years) - d.sp;
  const paydown = d.loanAmt - d.balanceAfter(years * 12);
  const totalGain = cumCashFlow + apprGain + paydown;
  const total = d.cashNeeded > 0 ? totalGain / d.cashNeeded : null;
  /* CAGR is only defined while the position is still worth something. */
  const multiple = total == null ? null : 1 + total;
  const annualized = multiple != null && multiple > 0 ? Math.pow(multiple, 1 / years) - 1 : null;
  return { rows, cumCashFlow, apprGain, paydown, totalGain, total, annualized };
}

const pctLabel = (v, dp = 2) => v == null ? "—" : `${(v * 100).toFixed(dp)}%`;
const gradeCoc = (v) => v == null ? "#8b8477" : v >= 0.08 ? "#93c4a2" : v >= 0.04 ? "#c9a96e" : "#d98a80";
const gradeDscr = (v) => v >= 1.25 ? "#93c4a2" : v >= 1.0 ? "#c9a96e" : "#d98a80";

/* ─── Property charts ───
   Palette: the documented categorical hues, validated for this dark surface
   with --pairs all (order-independent, so a zero-value slice can drop out
   without creating an unchecked adjacency). Worst CVD ΔE 6.9 sits in the
   6–8 floor band, which is legal only alongside secondary encoding — hence
   the legend, the value labels and the 2px surface gap between slices. */
const C_PI = "#7f9cc4", C_TAX = "#c9a96e", C_OPS = "#c48a9b", C_PROFIT = "#93c4a2";
const C_CF = "#7f9cc4", C_APPR = "#c9a96e", C_PD = "#7fb39a";
const SURFACE = "#141311";

function monthlyBuckets(d) {
  const taxIns = d.monthlyPropTax + d.insV + d.hoaV + d.utilV + d.lawV;
  return [
    { label: "Mortgage", color: C_PI, value: d.pAndI,
      items: [["Principal + interest", d.pAndI]] },
    { label: "Taxes & insurance", color: C_TAX, value: taxIns,
      items: [["Property tax", d.monthlyPropTax], ["Insurance", d.insV],
              ["HOA", d.hoaV], ["Utilities", d.utilV], ["Lawyer", d.lawV]] },
    { label: "Management & reserves", color: C_OPS, value: d.rentBasedExp,
      items: [["Management", d.mgmtFee], ["Repairs & maintenance", d.repairAmt],
              ["Capital expenditures", d.capexAmt], ["Vacancy", d.vacancyLoss]] },
    { label: "Profit", color: C_PROFIT, value: Math.max(0, d.monthlyProfit), items: [] },
  ].filter((b) => b.value > 0.005);
}

function cashBuckets(d) {
  return [
    { label: "Down payment", color: C_PI, value: d.downAmt, items: [] },
    { label: "Closing costs", color: C_TAX, value: d.closingCost, items: [] },
    { label: "Rehab", color: C_OPS, value: d.rehabV, items: [] },
    { label: "Misc", color: C_PROFIT, value: d.miscV, items: [] },
  ].filter((b) => b.value > 0.005);
}

function Donut({ buckets, centerLabel, centerValue, note }) {
  const [hot, setHot] = useState(null);
  const total = buckets.reduce((s, b) => s + b.value, 0);
  const size = 200, cx = size / 2, cy = size / 2, r = size / 2 - 3, ir = r * 0.62;

  if (total <= 0) {
    return <div style={{ color: "#716a5f", fontSize: 12.5, padding: "28px 0", textAlign: "center" }}>Nothing to show yet</div>;
  }

  let cum = -Math.PI / 2;
  const slices = buckets.map((b, i) => {
    const ang = (b.value / total) * Math.PI * 2;
    const a1 = cum, a2 = cum + ang; cum = a2;
    const big = ang > Math.PI ? 1 : 0;
    const P = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
    const [x1, y1] = P(r, a1), [x2, y2] = P(r, a2);
    const [xi2, yi2] = P(ir, a2), [xi1, yi1] = P(ir, a1);
    return { ...b, i, pct: (b.value / total) * 100,
      d: `M ${x1} ${y1} A ${r} ${r} 0 ${big} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${ir} ${ir} 0 ${big} 0 ${xi1} ${yi1} Z` };
  });

  const shown = hot != null ? slices[hot] : null;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "center" }}>
        <svg width={size} height={size} role="img" aria-label={centerLabel}>
          {slices.map((s) => (
            <path key={s.i} d={s.d} fill={s.color}
              /* 2px surface-coloured gap keeps adjacent fills separable */
              stroke={SURFACE} strokeWidth="2"
              opacity={hot == null || hot === s.i ? 1 : 0.35}
              onMouseEnter={() => setHot(s.i)} onMouseLeave={() => setHot(null)}
              style={{ cursor: "default", transition: "opacity .12s" }} />
          ))}
          <text x={cx} y={cy - 6} textAnchor="middle" style={{ fill: "#8b8477", fontSize: 10.5, fontFamily: FONT, letterSpacing: "0.06em" }}>
            {shown ? shown.label.toUpperCase() : centerLabel}
          </text>
          <text x={cx} y={cy + 17} textAnchor="middle" style={{ fill: "#f6f1e7", fontSize: 18, fontFamily: FONT, fontWeight: 600 }}>
            {shown ? fmt0(shown.value) : centerValue}
          </text>
          {shown && (
            <text x={cx} y={cy + 34} textAnchor="middle" style={{ fill: "#8b8477", fontSize: 11, fontFamily: FONT }}>
              {shown.pct.toFixed(1)}%
            </text>
          )}
        </svg>
      </div>
      <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 2 }}>
        {slices.map((s) => {
          const subs = s.items.filter(([, v]) => v > 0.005);
          return (
            <div key={s.i} onMouseEnter={() => setHot(s.i)} onMouseLeave={() => setHot(null)}
              style={{ padding: "5px 6px", borderRadius: 6, background: hot === s.i ? "rgba(240,228,208,0.05)" : "transparent" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 9, minWidth: 0 }}>
                  <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, flexShrink: 0 }} />
                  <span style={{ fontSize: 12.5, color: "#ddd4c5" }}>{s.label}</span>
                </div>
                <div style={{ display: "flex", gap: 10, alignItems: "baseline", flexShrink: 0 }}>
                  <span style={{ fontFamily: FONT, fontSize: 13, color: "#ece5d8" }}>{fmt0(s.value)}</span>
                  <span style={{ fontFamily: FONT, fontSize: 12, color: "#8b8477", minWidth: 40, textAlign: "right" }}>{s.pct.toFixed(1)}%</span>
                </div>
              </div>
              {subs.length > 1 && hot === s.i && (
                <div style={{ paddingLeft: 19, marginTop: 4, display: "flex", flexDirection: "column", gap: 2 }}>
                  {subs.map(([lbl, val]) => (
                    <div key={lbl} style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: "#8b8477" }}>
                      <span>{lbl}</span><span style={{ fontFamily: FONT }}>{fmt(val)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
      {note && <div style={{ fontSize: 11.5, color: "#5a554c", marginTop: 10, lineHeight: 1.5 }}>{note}</div>}
    </div>
  );
}

/* Per-year cumulative gain, split by where it came from, plus the annualized
   return you'd have realised selling at the end of that year. */
function returnSeries(d, rentGrowth, expInflation, apprRate, years) {
  return cashFlowYears(d, rentGrowth, expInflation, years).map((r, i) => {
    const t = i + 1;
    const cf = r.cumulative;
    const ap = d.sp * Math.pow(1 + apprRate, t) - d.sp;
    const pd = d.loanAmt - d.balanceAfter(t * 12);
    const gain = cf + ap + pd;
    const ret = d.cashNeeded > 0 ? gain / d.cashNeeded : null;
    const mult = ret == null ? null : 1 + ret;
    return { year: t, cf, ap, pd, gain, ret,
      cagr: mult != null && mult > 0 ? Math.pow(mult, 1 / t) - 1 : null };
  });
}

/* Rect with only its data-end corners rounded, so the stack still sits flat
   on the baseline. */
function capRect(x, y, w, h, r, up) {
  const rr = Math.min(r, h, w / 2);
  return up
    ? `M ${x} ${y + h} L ${x} ${y + rr} Q ${x} ${y} ${x + rr} ${y} L ${x + w - rr} ${y} Q ${x + w} ${y} ${x + w} ${y + rr} L ${x + w} ${y + h} Z`
    : `M ${x} ${y} L ${x} ${y + h - rr} Q ${x} ${y + h} ${x + rr} ${y + h} L ${x + w - rr} ${y + h} Q ${x + w} ${y + h} ${x + w} ${y + h - rr} L ${x + w} ${y} Z`;
}

/* Round axis bounds and ticks to human numbers (1/2/5 x 10^n) so the labels
   read $15k/$30k/$45k rather than whatever the data max happened to be. */
function niceScale(lo, hi, count) {
  if (hi === lo) hi = lo + 1;
  const raw = (hi - lo) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1)));
  const nrm = raw / mag;
  const step = (nrm <= 1 ? 1 : nrm <= 2 ? 2 : nrm <= 5 ? 5 : 10) * mag;
  const nlo = Math.floor(lo / step) * step;
  const nhi = Math.ceil(hi / step) * step;
  const ticks = [];
  for (let v = nlo; v <= nhi + step * 1e-6; v += step) ticks.push(Math.abs(v) < step * 1e-6 ? 0 : v);
  return { lo: nlo, hi: nhi, ticks };
}

function ReturnChart({ series }) {
  const [hot, setHot] = useState(null);
  const W = 580, PADL = 54, PADR = 14, TOP = 16;
  const HA = 150, GAP = 40, HB = 74;
  const yA0 = TOP, yA1 = TOP + HA;
  const yB0 = yA1 + GAP, yB1 = yB0 + HB;
  const H = yB1 + 30;
  const plotW = W - PADL - PADR;
  const n = series.length;
  const band = plotW / n;
  const bw = Math.min(46, band * 0.6);

  const SERIES = [
    { key: "cf", label: "Rent profit", color: C_CF },
    { key: "ap", label: "Appreciation", color: C_APPR },
    { key: "pd", label: "Principal paydown", color: C_PD },
  ];

  /* One shared dollar scale across the stack, with a real zero line so a
     losing year reads as below-zero rather than as a short bar. */
  let hi = 0, lo = 0;
  for (const r of series) {
    let up = 0, dn = 0;
    for (const s of SERIES) { const v = r[s.key]; if (v >= 0) up += v; else dn += v; }
    hi = Math.max(hi, up); lo = Math.min(lo, dn);
  }
  const dS = niceScale(lo, hi, 4);
  const yD = (v) => yA1 - ((v - dS.lo) / (dS.hi - dS.lo)) * HA;
  const zeroY = yD(0);

  const cagrs = series.map((r) => r.cagr).filter((v) => v != null);
  const cS = niceScale(cagrs.length ? Math.min(...cagrs, 0) : 0,
                       cagrs.length ? Math.max(...cagrs, 0) : 1, 3);
  const yC = (v) => yB1 - ((v - cS.lo) / (cS.hi - cS.lo)) * HB;
  const xC = (i) => PADL + band * i + band / 2;

  const pts = series.filter((r) => r.cagr != null).map((r, i) => [xC(series.indexOf(r)), yC(r.cagr)]);
  const linePath = pts.map(([x, y], i) => `${i ? "L" : "M"} ${x} ${y}`).join(" ");
  const money = (v) => {
    const sign = v < 0 ? "\u2212" : "";
    const a = Math.abs(v);
    return a >= 1000 ? `${sign}$${Math.round(a / 1000)}k` : `${sign}$${Math.round(a)}`;
  };
  const tick = { fill: "#716a5f", fontSize: 10, fontFamily: FONT };
  const r = hot != null ? series[hot] : null;

  return (
    <div style={{ position: "relative" }}>
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 8 }}>
        {SERIES.map((s) => (
          <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 7 }}>
            <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color }} />
            <span style={{ fontSize: 11.5, color: "#9b9386" }}>{s.label}</span>
          </div>
        ))}
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}
        onMouseLeave={() => setHot(null)}>
        <text x={PADL} y={yA0 - 4} style={{ ...tick, fill: "#8b8477" }}>Cumulative gain</text>
        {dS.ticks.map((v) => {
          return (
            <g key={v}>
              <line x1={PADL} x2={W - PADR} y1={yD(v)} y2={yD(v)} stroke="rgba(240,228,208,0.05)" strokeWidth="1" />
              <text x={PADL - 8} y={yD(v) + 3} textAnchor="end" style={tick}>{money(v)}</text>
            </g>
          );
        })}
        <line x1={PADL} x2={W - PADR} y1={zeroY} y2={zeroY} stroke="rgba(240,228,208,0.22)" strokeWidth="1" />

        {series.map((row, i) => {
          let up = 0, dn = 0;
          const segs = [];
          for (const s of SERIES) {
            const v = row[s.key];
            if (!v) continue;
            if (v >= 0) { segs.push({ ...s, v, from: up, sign: 1 }); up += v; }
            else { segs.push({ ...s, v, from: dn, sign: -1 }); dn += v; }
          }
          const topPos = Math.max(...segs.filter((s) => s.sign > 0).map((s) => s.from + s.v), -Infinity);
          const botNeg = Math.min(...segs.filter((s) => s.sign < 0).map((s) => s.from + s.v), Infinity);
          return (
            <g key={i} opacity={hot == null || hot === i ? 1 : 0.45} style={{ transition: "opacity .12s" }}>
              {segs.map((s) => {
                const y0 = yD(s.from), y1 = yD(s.from + s.v);
                const top = Math.min(y0, y1), h = Math.abs(y1 - y0);
                /* 2px surface gap so neighbouring fills stay separable */
                const hh = Math.max(0, h - 2);
                const isEnd = s.sign > 0 ? s.from + s.v === topPos : s.from + s.v === botNeg;
                const x = xC(i) - bw / 2;
                return isEnd
                  ? <path key={s.key} d={capRect(x, s.sign > 0 ? top : top + 2, bw, hh, 4, s.sign > 0)} fill={s.color} />
                  : <rect key={s.key} x={x} y={s.sign > 0 ? top : top + 2} width={bw} height={hh} fill={s.color} />;
              })}
            </g>
          );
        })}

        <text x={PADL} y={yB0 - 6} style={{ ...tick, fill: "#8b8477" }}>Annualized return if sold that year</text>
        {cS.ticks.map((v, i) => (
          <g key={i}>
            <line x1={PADL} x2={W - PADR} y1={yC(v)} y2={yC(v)} stroke="rgba(240,228,208,0.05)" strokeWidth="1" />
            <text x={PADL - 8} y={yC(v) + 3} textAnchor="end" style={tick}>{(v * 100).toFixed(0).replace("-", "\u2212")}%</text>
          </g>
        ))}
        {cS.lo < 0 && cS.hi > 0 && <line x1={PADL} x2={W - PADR} y1={yC(0)} y2={yC(0)} stroke="rgba(240,228,208,0.22)" strokeWidth="1" />}
        <path d={linePath} fill="none" stroke="#9b9386" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {series.map((row, i) => row.cagr == null ? null : (
          <circle key={i} cx={xC(i)} cy={yC(row.cagr)} r={hot === i ? 5.5 : 4}
            fill={hot === i ? "#f6f1e7" : "#ddd4c5"} stroke={SURFACE} strokeWidth="2" />
        ))}

        {hot != null && (
          <line x1={xC(hot)} x2={xC(hot)} y1={yA0} y2={yB1}
            stroke="rgba(240,228,208,0.25)" strokeWidth="1" strokeDasharray="3 3" pointerEvents="none" />
        )}
        {series.map((_, i) => (
          <rect key={i} x={PADL + band * i} y={yA0} width={band} height={yB1 - yA0}
            fill="transparent" onMouseEnter={() => setHot(i)} />
        ))}
        {series.map((row, i) => (
          <text key={i} x={xC(i)} y={H - 10} textAnchor="middle"
            style={{ ...tick, fill: hot === i ? "#ddd4c5" : "#716a5f" }}>{row.year}</text>
        ))}
        <text x={W / 2} y={H - 26} textAnchor="middle" style={{ ...tick, fill: "#4a453e" }}> </text>
      </svg>

      {r && (
        <div style={{
          position: "absolute", top: 0, right: 0, background: "#1c1a17",
          border: "1px solid rgba(240,228,208,0.12)", borderRadius: 9, padding: "9px 12px",
          pointerEvents: "none", minWidth: 178, boxShadow: "0 6px 22px rgba(0,0,0,0.5)",
        }}>
          <div style={{ fontSize: 11, color: "#8b8477", marginBottom: 6 }}>After year {r.year}</div>
          {SERIES.map((s) => (
            <div key={s.key} style={{ display: "flex", justifyContent: "space-between", gap: 14, fontSize: 12, padding: "1px 0" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 7, color: "#9b9386" }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: s.color }} />{s.label}
              </span>
              <span style={{ fontFamily: FONT, color: r[s.key] >= 0 ? "#ece5d8" : "#d98a80" }}>{fmt0(r[s.key])}</span>
            </div>
          ))}
          <div style={{ display: "flex", justifyContent: "space-between", gap: 14, fontSize: 12.5,
            marginTop: 6, paddingTop: 6, borderTop: "1px solid rgba(240,228,208,0.1)" }}>
            <span style={{ color: "#ddd4c5", fontWeight: 550 }}>Total gain</span>
            <span style={{ fontFamily: FONT, fontWeight: 600, color: r.gain >= 0 ? "#93c4a2" : "#d98a80" }}>{fmt0(r.gain)}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 14, fontSize: 12, marginTop: 3 }}>
            <span style={{ color: "#9b9386" }}>Annualized</span>
            <span style={{ fontFamily: FONT, color: "#ece5d8" }}>{r.cagr == null ? "—" : (r.cagr * 100).toFixed(1) + "%"}</span>
          </div>
        </div>
      )}
    </div>
  );
}

/* The slider's range is anchored to the last typed price, so dragging never
   moves the goalposts under you. */
function PriceSlider({ value, onChange }) {
  const base = useRef(n(value) || 150000);
  const fromSlider = useRef(false);
  useEffect(() => {
    if (fromSlider.current) { fromSlider.current = false; return; }
    if (n(value) > 0) base.current = n(value);
  }, [value]);

  const cur = n(value);
  const lo = Math.max(1000, Math.round(base.current * 0.7 / 1000) * 1000);
  const hi = Math.max(lo + 1000, Math.round(base.current * 1.3 / 1000) * 1000);
  const delta = cur - base.current;
  const pct = base.current ? (delta / base.current) * 100 : 0;

  return (
    <PropCard title="Listing price">
      <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap", marginTop: 6, marginBottom: 10 }}>
        <span style={{ fontFamily: FONT, fontSize: 26, fontWeight: 600, color: "#f6f1e7" }}>{fmt0(cur)}</span>
        {Math.abs(delta) >= 1 && (
          <span style={{ fontFamily: FONT, fontSize: 13, color: delta > 0 ? "#d98a80" : "#93c4a2" }}>
            {delta > 0 ? "+" : "−"}{fmt0(Math.abs(delta))} ({pct > 0 ? "+" : "−"}{Math.abs(pct).toFixed(1)}%)
          </span>
        )}
        {Math.abs(delta) >= 1 && (
          <button onClick={() => { fromSlider.current = true; onChange(base.current); }}
            style={{ background: "transparent", border: "1px solid rgba(240,228,208,0.12)", borderRadius: 6,
              padding: "3px 9px", color: "#9b9386", fontFamily: FONT, fontSize: 11, cursor: "pointer", marginLeft: "auto" }}>
            Reset
          </button>
        )}
      </div>
      <input type="range" min={lo} max={hi} step={500} value={Math.min(hi, Math.max(lo, cur))}
        onChange={(e) => { fromSlider.current = true; onChange(parseFloat(e.target.value)); }}
        className="prop-range" style={{ width: "100%" }} />
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
        <span style={{ fontSize: 11, color: "#5a554c", fontFamily: FONT }}>{fmt0(lo)}</span>
        <span style={{ fontSize: 11, color: "#5a554c", fontFamily: FONT }}>{fmt0(hi)}</span>
      </div>
      <div style={{ fontSize: 11.5, color: "#5a554c", marginTop: 8, lineHeight: 1.5 }}>
        Drag to see where the deal stops working. Everything below moves with it.
      </div>
    </PropCard>
  );
}

function StatTile({ label, value, sub, accent }) {
  return (
    <div style={{
      background: "#141311",
      border: "1px solid rgba(240,228,208,0.08)", borderRadius: 12, padding: "13px 15px",
    }}>
      <div style={{ fontSize: 10.5, letterSpacing: "0.09em", textTransform: "uppercase", color: "#8b8477", fontWeight: 550 }}>{label}</div>
      <div style={{ fontFamily: FONT, fontSize: 21, fontWeight: 600, color: accent || "#f6f1e7", marginTop: 5 }}>{value}</div>
      {sub && <div style={{ fontSize: 11, color: "#5a554c", marginTop: 3 }}>{sub}</div>}
    </div>
  );
}

const HORIZONS = [["3", "3 yr"], ["5", "5 yr"], ["10", "10 yr"]];
const SCENARIOS = [["Poor", 1], ["Average", 2], ["Great", 4]];

function DealTab({ v, set }) {
  const d = analyzeDeal(v);

  return (
    <>
      <PriceSlider value={v.salePrice} onChange={set("salePrice")} />

      {d.hasData && (
        <div className="prop-kpis">
          <StatTile label="Monthly profit" value={fmt(d.monthlyProfit)} sub="after every expense"
            accent={d.monthlyProfit >= 0 ? "#93c4a2" : "#d98a80"} />
          <StatTile label="Cash-on-cash" value={pctLabel(d.cashOnCash)} sub="cash flow ÷ cash in"
            accent={gradeCoc(d.cashOnCash)} />
          <StatTile label="DSCR" value={d.dscr == null ? "—" : d.dscr.toFixed(2)}
            sub={d.dscr == null ? "no loan" : "NOI ÷ P&I"} accent={d.dscr == null ? "#8b8477" : gradeDscr(d.dscr)} />
          <StatTile label="Cash needed" value={fmt0(d.cashNeeded)} sub="to close" />
        </div>
      )}

      <div className="prop-cols">
        <div>
          <PropCard title="Income">
            <MoneyInput label="Monthly Rent" value={v.rent} onChange={set("rent")} />
          </PropCard>

          <PropCard title="Acquisition">

/* Deals live in the cloud; the in-progress draft is cached per browser so
   switching tabs mid-deal doesn't discard it. */
function useDeals(v, setAll) {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(!syncConfigured());
  const [deals, setDeals] = useState([]);
  const [currentId, setCurrentId] = useState(null);
  const [name, setName] = useState("");
  const [status, setStatus] = useState("");

  useEffect(() => {
    const sb = getSb();
    if (!sb) { setReady(true); return; }
    let alive = true;
    sb.auth.getSession().then(({ data }) => {
      if (!alive) return;
      setSession(data.session || null);
      setReady(true);
    }).catch(() => alive && setReady(true));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => {
      if (alive) setSession(s || null);
    });
    return () => { alive = false; sub?.subscription?.unsubscribe(); };
  }, []);

  const refresh = useCallback(async () => {
    const sb = getSb();
    if (!sb || !session) return;
    const { data, error } = await sb.from("deals")
      .select("id,name,data,updated_at").order("updated_at", { ascending: false });
    if (!error) setDeals(data || []);
  }, [session]);

  useEffect(() => { if (session) refresh(); else setDeals([]); }, [session, refresh]);

  const flash = (msg) => { setStatus(msg); setTimeout(() => setStatus((s) => s === msg ? "" : s), 2500); };

  const save = async (asNew) => {
    const sb = getSb();
    if (!sb || !session) return;
    const label = (name || "").trim() || "Untitled deal";
    setStatus("Saving…");
    const payload = { name: label, data: v, user_id: session.user.id, updated_at: new Date().toISOString() };
    const q = (!asNew && currentId)
      ? sb.from("deals").update(payload).eq("id", currentId).select("id").single()
      : sb.from("deals").insert(payload).select("id").single();
    const { data, error } = await q;
    if (error) { flash("Couldn't save — " + error.message); return; }
    setCurrentId(data.id); setName(label); flash("Saved");
    refresh();
  };

  const load = (id) => {
    const d = deals.find((x) => x.id === id);
    if (!d) return;
    setAll({ ...PROP_DEFAULTS, ...(d.data || {}) });
    setCurrentId(d.id); setName(d.name || ""); flash("Loaded");
  };

  const remove = async () => {
    const sb = getSb();
    if (!sb || !currentId) return;
    const { error } = await sb.from("deals").delete().eq("id", currentId);
    if (error) { flash("Couldn't delete — " + error.message); return; }
    setCurrentId(null); setName(""); flash("Deleted"); refresh();
  };

  const startNew = () => { setAll({ ...PROP_DEFAULTS }); setCurrentId(null); setName(""); };

  return { session, ready, deals, currentId, name, setName, status, save, load, remove, startNew, refresh };
}

function SignIn() {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [mode, setMode] = useState("in");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const go = async () => {
    const sb = getSb();
    if (!sb) return;
    setBusy(true); setMsg("");
    /* Point confirmation links back at this page. Without it Supabase falls
       back to the project's Site URL, which defaults to localhost. */
    const creds = { email: email.trim(), password: pw };
    if (mode === "up") creds.options = { emailRedirectTo: window.location.origin + window.location.pathname };
    const fn = mode === "in" ? "signInWithPassword" : "signUp";
    const { data, error } = await sb.auth[fn](creds);
    setBusy(false);
    if (error) {
      setMsg(/failed to fetch|networkerror/i.test(error.message)
        ? "Couldn't reach the database — check your internet connection."
        : error.message);
      return;
    }
    if (mode === "up" && !data.session) setMsg("Check your email to confirm, then sign in.");
  };

  const field = {
    background: "transparent", border: "none", outline: "none", color: "#f6f1e7",
    fontFamily: FONT, fontSize: 14, width: "100%",
  };
  const wrap = { borderBottom: "1px solid #5a554c", paddingBottom: 6, marginTop: 12 };

  return (
    <PropCard title={mode === "in" ? "Sign in to sync deals" : "Create your account"}>
      <div style={{ fontSize: 12.5, color: "#8b8477", marginTop: 4, lineHeight: 1.5 }}>
        Signing in saves your deals to the cloud so they follow you between your PC, Mac and phone.
      </div>
      <div style={wrap}>
        <input type="email" placeholder="you@example.com" value={email} autoComplete="username"
          onChange={(e) => setEmail(e.target.value)} style={field} />
      </div>
      <div style={wrap}>
        <input type="password" placeholder="password" value={pw}
          autoComplete={mode === "in" ? "current-password" : "new-password"}
          onChange={(e) => setPw(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") go(); }} style={field} />
      </div>
      {msg && <div style={{ fontSize: 12.5, color: "#c9a96e", marginTop: 12 }}>{msg}</div>}
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 16 }}>
        <button onClick={go} disabled={busy || !email || !pw} style={{
          background: busy || !email || !pw ? "rgba(240,228,208,0.06)" : "#93c4a2",
          color: busy || !email || !pw ? "#716a5f" : "#0c0b0a",
          border: "none", borderRadius: 8, padding: "0 20px", minHeight: 44,
          display: "inline-flex", alignItems: "center", justifyContent: "center", fontFamily: FONT,
          fontSize: 13, fontWeight: 600, cursor: busy || !email || !pw ? "not-allowed" : "pointer",
        }}>{busy ? "…" : mode === "in" ? "Sign in" : "Create account"}</button>
        <button onClick={() => { setMode(mode === "in" ? "up" : "in"); setMsg(""); }} style={{
          background: "transparent", border: "none", color: "#8b8477", minHeight: 44,
          display: "inline-flex", alignItems: "center", padding: "0 2px",
          fontFamily: FONT, fontSize: 12.5, cursor: "pointer", textDecoration: "underline",
        }}>{mode === "in" ? "Create an account" : "I already have one"}</button>
      </div>
    </PropCard>
  );
}
