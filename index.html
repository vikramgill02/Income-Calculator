<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gill &amp; Co.</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Gill &amp; Co." />
<meta name="theme-color" content="#f6f1e7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<style>
:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --bg: #f6f1e7;
  --surface: #fffdf8;
  --line: rgba(31,58,46,0.1);
  --text: #1f3a2e;
  --muted: #66706a;
  --gold: #9a7128;
  --accent: #1f3a2e;
  --nav-h: 64px;
}
html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(1100px 520px at 50% -220px, rgba(31,58,46,0.05), transparent 70%),
    #f6f1e7;
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.006em;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Headings are set in the serif; numbers and UI stay in Inter. */
h1 {
  font-family: var(--serif) !important;
  font-weight: 500 !important;
  font-size: clamp(32px, 4.2vw, 42px) !important;
  letter-spacing: -0.01em;
  color: var(--text) !important;
}
::selection { background: rgba(31,58,46,0.18); }
button { font-family: var(--font); transition: background 0.13s ease, border-color 0.13s ease, color 0.13s ease; }
input { font-family: var(--font); }
::-webkit-scrollbar { height: 8px; width: 8px; }
::-webkit-scrollbar-track { background: #fffdf8; }
::-webkit-scrollbar-thumb { background: #d8d0bf; border-radius: 4px; }

.dash-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.dash-pie-grid {
  display: grid;
  grid-template-columns: minmax(280px, 380px) 1fr;
  gap: 24px;
  margin-bottom: 32px;
}
.dash-employers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}
.bene-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  flex-wrap: wrap;
}
@media (max-width: 640px) {
  .bene-row { gap: 6px; }
}
/* Twelve month chips are wider than a phone. Let them scroll within their own
   row rather than dragging the whole page sideways. */
.chip-strip {
  display: flex;
  gap: 3px;
  flex-wrap: nowrap;
  overflow-x: auto;
  min-width: 0;
  flex: 1 1 auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}
.chip-strip::-webkit-scrollbar { display: none; }
/* Tappable chips and the Claim-now "Used" button: a tall invisible hit area
   around a small visible pill. */
.chip-btn {
  background: transparent; border: none; padding: 9px 0; margin: 0; cursor: pointer; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent; font: inherit;
}
.chip-btn:hover > div { filter: brightness(0.94); }
.chip-btn:focus-visible > div { outline: 1.5px solid var(--accent); outline-offset: 1px; }
.mark-btn {
  background: transparent; border: none; padding: 0; margin: 0; cursor: pointer; flex-shrink: 0;
  min-height: 36px; display: inline-flex; align-items: center; font: inherit;
  -webkit-tap-highlight-color: transparent;
}
.mark-btn > span {
  border: 1px solid rgba(47,122,78,0.35); color: #2f7a4e; border-radius: 6px;
  padding: 2px 9px; font-size: 12px;
}
.mark-btn:hover > span { background: rgba(47,122,78,0.12); }
.refresh-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px;
  background: transparent; border: 1px solid rgba(31,58,46,0.15); border-radius: 999px;
  color: #4f5d55; font: inherit; font-size: 12.5px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.refresh-btn:hover { border-color: rgba(31,58,46,0.4); color: var(--accent); }
.refresh-btn:disabled { cursor: default; opacity: 0.6; }
.spin { animation: spin 0.9s linear infinite; }
.edit-btn { color: var(--accent); border-color: rgba(31,58,46,0.35); }
/* Save / Cancel bar while editing card claims: pinned to the bottom of the
   screen, above the phone tab bar. */
.edit-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: rgba(255,253,248,0.95); border-top: 1px solid rgba(154,113,40,0.35);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}
.edit-bar-inner { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.bar-btn {
  min-height: 44px; padding: 0 18px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13.5px;
  background: transparent; color: #4f5d55; border: 1px solid rgba(31,58,46,0.175);
}
.bar-btn-save { background: #2f7a4e; color: #f6f1e7; border-color: #2f7a4e; font-weight: 600; }
.bar-btn:disabled { opacity: 0.45; cursor: default; }
@media (max-width: 720px) {
  .edit-bar { bottom: calc(64px + env(safe-area-inset-bottom)); padding-bottom: 10px; }
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Anything tappable clears Apple's 44px minimum without the padding showing. */
.tap {
  position: relative;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
}
.tap-sm { min-height: 44px; display: inline-flex; align-items: center; }
/* Six columns of paystub don't fit a phone. Stack each row into a labelled
   block instead of making a 640px table scroll sideways. */
@media (max-width: 640px) {
  .stub-table, .stub-table tbody, .stub-table tr, .stub-table td { display: block; width: auto; }
  .stub-table { min-width: 0 !important; }
  .stub-table thead { display: none; }
  .stub-table tr { padding: 14px 16px; }
  .stub-table td { padding: 0 !important; text-align: left !important; }
  .stub-table td.stub-n { display: none; }
  .stub-table td.stub-emp { margin: 6px 0 8px; }
  .stub-table td[data-l] {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 4px 0 !important;
  }
  .stub-table td[data-l]::before {
    content: attr(data-l);
    color: #66706a; font-size: 11.5px; font-weight: 500;
  }
}
.prop-wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 56px; }
.prop-kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.prop-cols {
  display: grid;
  grid-template-columns: minmax(300px, 350px) 1fr;
  gap: 20px;
  align-items: start;
}
.prop-charts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 20px;
}
@media (max-width: 900px) {
  .prop-cols { grid-template-columns: 1fr; }
}
.prop-range {
  -webkit-appearance: none; appearance: none;
  height: 4px; border-radius: 3px; background: #d8d0bf; outline: none;
}
.prop-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: #1f3a2e; border: none; cursor: pointer;
}
.prop-range::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: #1f3a2e; border: none; cursor: pointer;
}
@media (max-width: 820px) {
  .dash-pie-grid { grid-template-columns: 1fr; }
}
/* ─── section tabs ─── */
.subtabs {
  display: flex; gap: 4px; margin: 0 0 24px; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--line);
}
.subtabs::-webkit-scrollbar { display: none; }
.subtabs a {
  position: relative; flex-shrink: 0; display: flex; align-items: center; text-decoration: none; cursor: pointer;
  min-height: 44px; padding: 0 14px; font-size: 13.5px; font-weight: 450; color: var(--muted);
}
.subtabs a:first-child { padding-left: 2px; }
.subtabs a:hover { color: var(--text); }
.subtabs a.active { color: var(--text); }
.subtabs a.active::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 1.5px; background: var(--accent);
}
.subtabs a:first-child.active::after { left: 2px; }
.page-head {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
}
.eyebrow {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; font-weight: 500;
}
@media (max-width: 560px) {
  .dash-stats { grid-template-columns: 1fr 1fr !important; gap: 10px !important; margin-bottom: 20px !important; }
  .stat-card { padding: 16px !important; }
  .stat-value { font-size: 19px !important; }
  .claim-row { flex-wrap: wrap; row-gap: 2px !important; padding: 8px 0 !important; }
  .claim-row > div:first-child { flex: 1 1 100% !important; white-space: normal !important; }
  .claim-row > span:nth-of-type(1) { text-align: left !important; min-width: 0 !important; margin-right: auto; }
}
details.fine summary { cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none; }
details.fine summary::-webkit-details-marker { display: none; }
details.fine summary::before { content: "+ "; color: var(--accent); }
details.fine[open] summary::before { content: "− "; }

/* ─── navigation ─── */
.topnav {
  position: sticky; top: 0; z-index: 20;
  padding-top: env(safe-area-inset-top);
  background: rgba(246,241,231,0.86);
  -webkit-backdrop-filter: saturate(140%) blur(14px);
  backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.topnav-inner {
  max-width: 1280px; margin: 0 auto; height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 0 24px;
}
.wordmark {
  font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--text);
  letter-spacing: 0.01em;
}
.wordmark { display: flex; align-items: center; gap: 12px; }
/* The logo is the home link (Net Worth). */
a.wordmark { text-decoration: none; -webkit-tap-highlight-color: transparent; transition: opacity 0.13s ease; }
a.wordmark:hover { opacity: 0.78; }
a.wordmark:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.wordmark .logo { height: 28px; width: auto; display: block; }
.wordmark em { color: var(--accent); font-style: italic; }
.topnav-tabs { display: flex; gap: 6px; }
.topnav-tabs a {
  position: relative; display: inline-block; text-decoration: none; cursor: pointer;
  padding: 10px 14px; font-size: 13.5px; font-weight: 450; letter-spacing: 0.01em;
  color: var(--muted);
}
.topnav-tabs a:hover { color: var(--text); }
.topnav-tabs a.active { color: var(--text); }
.topnav-tabs a.active::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: 2px;
  height: 1.5px; border-radius: 1px; background: var(--accent);
}
.bottomnav { display: none; }
.tool-card {
  display: block; text-decoration: none; background: #fffdf8; border: 1px solid rgba(31,58,46,0.1);
  border-radius: 12px; padding: 16px 18px;
}
.tool-card:hover { border-color: rgba(31,58,46,0.3); }
@media (max-width: 720px) {
  .topnav-inner { justify-content: center; height: 52px; }
  .wordmark { font-size: 23px; gap: 10px; }
  .wordmark .logo { height: 24px; }
  .topnav-tabs { display: none; }
  .bottomnav {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    background: rgba(246,241,231,0.92);
    -webkit-backdrop-filter: saturate(140%) blur(16px);
    backdrop-filter: saturate(140%) blur(16px);
    border-top: 1px solid var(--line);
  }
  .bottomnav a {
    text-decoration: none; -webkit-tap-highlight-color: transparent; cursor: pointer; min-height: 52px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: #858b83; font-size: 10.5px; font-weight: 500; letter-spacing: 0.01em;
  }
  .bottomnav a.active { color: var(--accent); }
  .app-main { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
}
.nw-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.nw-overview {
  display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 48px; align-items: start;
}
.nw-detail { border-left: 1px solid var(--line); padding-left: 40px; min-height: 100%; }
@media (max-width: 820px) {
  .nw-overview { grid-template-columns: 1fr; gap: 28px; }
  .nw-detail { border-left: none; padding-left: 0; border-top: 1px solid var(--line); padding-top: 24px; }
}
.nw-split {
  display: grid;
  grid-template-columns: minmax(280px, 380px) 1fr;
  gap: 24px;
  margin-bottom: 32px;
}
@media (max-width: 820px) {
  .nw-split { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .nw-page { padding: 22px 16px 48px !important; }
  .nw-subtabs > div { width: 100%; }
  .nw-subtabs button { flex: 1; padding: 0 6px !important; }
}
/* ─── PTO ─── */
.pto-split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .pto-split { grid-template-columns: 1fr; } }
.pto-verdict { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; line-height: 1.5; }
.pto-badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
.pto-badge.ok { background: rgba(47,122,78,0.12); color: #2f7a4e; }
.pto-badge.bad { background: rgba(181,72,59,0.12); color: #b5483b; }
.pto-link {
  background: transparent; border: none; padding: 0 4px; min-height: 30px; cursor: pointer; font: inherit;
  font-size: 12.5px; color: #66706a; text-decoration: underline; text-underline-offset: 2px;
}
.pto-link:hover { color: #1f3a2e; }
.pto-x {
  background: transparent; border: none; cursor: pointer; color: #66706a; font-size: 16px; width: 30px; height: 30px;
  border-radius: 999px; font-family: inherit;
}
.pto-x:hover { color: #b5483b; }
.pto-row-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.pto-row-form input {
  font: inherit; font-size: 14px; color: #1f3a2e; background: #fffdf8; border: 1px solid rgba(31,58,46,0.18);
  border-radius: 8px; min-height: 38px; padding: 0 10px; outline: none;
}
.pto-row-form input:focus { border-color: rgba(31,58,46,0.5); }
/* Every-check table */
.pto-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.pto-table th {
  text-align: left; font-weight: 500; color: #66706a; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 10px 6px 8px;
}
.pto-table td { padding: 9px 6px; border-top: 1px solid rgba(31,58,46,0.062); color: #1f3a2e; vertical-align: top; }
.pto-table th:nth-child(n+2), .pto-table td:nth-child(n+2) { text-align: right; white-space: nowrap; }
.pto-table tr.past td { color: #8a918a; }
.pto-table tr.past td:last-child { color: #8a918a !important; }
.pto-table tr.next td { background: rgba(47,122,78,0.06); }
.pto-table tr.pto-year td {
  font-size: 11px; letter-spacing: 0.14em; color: #9a7128; font-weight: 600; padding-top: 16px; border-top: none;
}
.pto-sub { display: block; font-size: 11.5px; color: #8a918a; margin-top: 2px; white-space: normal; }
.pto-next {
  display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 600; color: #2f7a4e; background: rgba(47,122,78,0.12);
  border-radius: 999px; padding: 1px 7px; vertical-align: 1px;
}
@media (max-width: 480px) {
  .pto-table { font-size: 12.5px; }
  .pto-table td, .pto-table th { padding-left: 3px; padding-right: 3px; }
  .pto-next { display: none; }
}
/* Calendar */
.pto-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.pto-cal-dow { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #66706a; text-align: center; padding: 4px 0 6px; }
.pto-cal-cell {
  min-height: 82px; border-radius: 10px; padding: 6px 3px; display: flex; flex-direction: column; align-items: center;
  justify-content: space-between; gap: 2px; background: rgba(31,58,46,0.025); border: 1px solid transparent;
  font: inherit; color: #1f3a2e; min-width: 0; position: relative;
}
.pto-cal-cell.blank { background: transparent; }
button.pto-cal-cell { cursor: pointer; }
button.pto-cal-cell:hover { border-color: rgba(31,58,46,0.4); }
button.pto-cal-cell:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }
/* Shifts wear Google Calendar's Peacock blue, paydays its Sage green, so the
   page reads like the BSN calendar. Text stays dark enough to read. */
.pto-cal-cell.work { background: rgba(3,155,229,0.1); border-color: rgba(3,155,229,0.45); box-shadow: inset 0 3px 0 #039be5; }
.pto-cal-cell.pto { background: rgba(154,113,40,0.18); border-color: rgba(154,113,40,0.45); box-shadow: inset 0 3px 0 #9a7128; }
.pto-cal-cell.sel { background: #1f3a2e; border-color: #1f3a2e; color: #f6f1e7; }
.pto-cal-cell.sel .pto-cal-d, .pto-cal-cell.sel .pto-cal-tag, .pto-cal-cell.sel .pto-cal-b { color: #f6f1e7 !important; }
.pto-cal-cell.past { opacity: 0.5; }
.pto-cal-cell.today::after {
  content: ""; position: absolute; inset: -3px; border-radius: 12px; border: 1.5px solid #1f3a2e; pointer-events: none;
}
.pto-cal-d { font-size: 13px; color: #66706a; white-space: nowrap; }
.pto-cal-cell.m1 .pto-cal-d { color: #9a7128 !important; font-weight: 700; }
/* Month boundaries in the 8-week view: alternate months are warmer, and a
   gold line sits in the gap between squares where the month changes. */
.pto-cal-cell.alt { background: rgba(154,113,40,0.085); }
.pto-cal-cell.alt.work { background: rgba(3,155,229,0.14); }
.pto-cal-line { position: absolute; background: #9a7128; pointer-events: none; }
.pto-cal-line.top { left: -3px; right: -3px; top: -4px; height: 2px; }
.pto-cal-line.left { top: -4px; bottom: -3px; left: -4px; width: 2px; }
@media (max-width: 560px) {
  .pto-cal-line.top { top: -3.5px; left: -2.5px; right: -2.5px; }
  .pto-cal-line.left { left: -3.5px; top: -3.5px; bottom: -2.5px; }
}
.pto-seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(31,58,46,0.06); }
.pto-seg button {
  border: none; background: transparent; font: inherit; font-size: 12.5px; color: #4f5d55; cursor: pointer;
  min-height: 32px; padding: 0 14px; border-radius: 999px;
}
.pto-seg button.on { background: #fffdf8; color: #1f3a2e; font-weight: 600; box-shadow: 0 1px 3px rgba(31,58,46,0.15); }
.pto-cal-cell.work .pto-cal-d, .pto-cal-cell.pto .pto-cal-d { font-weight: 700; color: #1f3a2e; }
.pto-cal-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #01679a; min-height: 12px; }
.pto-cal-pay {
  font-size: 10.5px; font-weight: 700; color: #1d7a4f; min-height: 15px; line-height: 15px;
}
.pto-cal-cell.pay .pto-cal-pay { background: rgba(51,182,121,0.18); border-radius: 999px; padding: 0 6px; }
.pto-cal-cell.sel .pto-cal-pay { color: #f6f1e7 !important; background: rgba(246,241,231,0.18) !important; }
.pto-cal-cell.pto .pto-cal-tag { color: #9a7128; }
.pto-cal-b { font-size: 12px; font-weight: 500; color: #34483e; white-space: nowrap; }
.pto-cal-nav {
  width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(31,58,46,0.15); background: transparent;
  color: #1f3a2e; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.pto-cal-nav:disabled { opacity: 0.3; cursor: default; }

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef, useContext } = React;

const FONT = "var(--font)";

const fmt = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
const fmt0 = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

const n = (v) => parseFloat(v) || 0;

const EMPLOYERS = ["CCMC", "NorthBay", "Sutter"];

const EMPLOYER_META = {
  CCMC:     { color: "#9a4452", logo: "/logos/ccmc.png",     full: "Community Medical Centers" },
  NorthBay: { color: "#4d8462", logo: "/logos/northbay.jpg", full: "NorthBay Healthcare" },
  Sutter:   { color: "#3f8a83", logo: "/logos/sutter.png",   full: "Sutter Health" },
};

const colorFor = (emp) => EMPLOYER_META[emp]?.color || "#2f7a4e";

const formatPayDate = (iso) => {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  const dt = new Date(Number(y), Number(m) - 1, Number(d));
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
};

/* ─── shared bits ─── */

function Field({ label, value, onChange, suffix = "", placeholder = "—" }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ fontSize: 13.5, letterSpacing: "0", color: "#66706a" }}>{label}</span>
      <div style={{ display: "flex", alignItems: "center", borderBottom: "1px solid #a1a59c", paddingBottom: 8 }}>
        <input type="number" step="0.01" value={value} placeholder={placeholder} onChange={onChange}
          style={{ background: "transparent", border: "none", outline: "none", color: "#1f3a2e", fontFamily: FONT, fontSize: 18, width: "100%" }} />
        {suffix && <span style={{ color: "#66706a", fontSize: 13.5, marginLeft: 4 }}>{suffix}</span>}
      </div>
    </div>
  );
}

function Line({ label, value, highlight = false, muted = false, large = false, note = "" }) {
  return (
    <div style={{
      display: "flex", justifyContent: "space-between", alignItems: "baseline",
      padding: large ? "18px 0 0" : "9px 0",
      borderTop: large ? "1px solid #a1a59c" : "none",
    }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
        <span style={{ fontSize: 12.5, letterSpacing: "0", color: muted ? "#6e776f" : "#34483e" }}>{label}</span>
        {note && <span style={{ fontSize: 13.5, color: "#6e776f", fontFamily: FONT }}>{note}</span>}
      </div>
      <span style={{ fontFamily: FONT, fontSize: large ? 23 : 14, fontWeight: large ? 600 : 450, color: highlight ? "#2f7a4e" : muted ? "#6e776f" : "#22362c" }}>{value}</span>
    </div>
  );
}

/* ─── routing ───
   Every page and sub-tab has its own address, like a normal website, so the
   back button, refresh and bookmarks all work. "/" is Net Worth; a page's
   first sub-tab is the bare page address (/dashboard), the rest add a
   segment (/dashboard/paystubs). worker.js serves index.html for these. */

const PAGES = { worth: "networth", dash: "dashboard", calc: "pay", cards: "cards", tools: "tools", prop: "property", trav: "travel", pto: "pto" };

function parsePath(pathname) {
  const [first = "", second = ""] = pathname.replace(/^\/+|\/+$/g, "").split("/");
  const view = Object.keys(PAGES).find((k) => PAGES[k] === first);
  if (!view) return { view: "worth", sub: "", known: first === "" };
  return { view, sub: second ? decodeURIComponent(second) : "", known: true };
}

const pathFor = (view, sub) =>
  sub ? `/${PAGES[view]}/${encodeURIComponent(sub)}` : view === "worth" ? "/" : `/${PAGES[view]}`;

const RouteContext = React.createContext({ view: "worth", sub: "", navigate: () => {} });

function useRouter() {
  const [route, setRoute] = useState(() => {
    const r = parsePath(window.location.pathname);
    // An address we don't know (e.g. /foo) becomes the home page.
    if (!r.known) window.history.replaceState(null, "", "/");
    return r;
  });
  useEffect(() => {
    const onPop = () => setRoute(parsePath(window.location.pathname));
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);
  const navigate = useCallback((path) => {
    if (path === window.location.pathname) return;
    const next = parsePath(path);
    window.history.pushState(null, "", path);
    setRoute((prev) => {
      // New page starts at the top; switching sub-tabs keeps your place.
      if (prev.view !== next.view) window.scrollTo(0, 0);
      return next;
    });
  }, []);
  return { view: route.view, sub: route.sub, navigate };
}

/* Sub-tab state kept in the address. `first` is the default sub-tab;
   `valid` (when known) sends a stale or mistyped sub-tab back to it. */
function useSubRoute(view, first, valid) {
  const { sub, navigate } = useContext(RouteContext);
  const value = sub && (!valid || valid.includes(sub)) ? sub : first;
  const href = (key) => pathFor(view, key === first ? "" : key);
  return [value, (key) => navigate(href(key)), href];
}

/* An in-app link: a plain click swaps the page without reloading; cmd/ctrl-
   click or long-press still opens it in a new tab like any other link. */
function Link({ to, onNavigate, children, ...rest }) {
  const { navigate } = useContext(RouteContext);
  const onClick = (e) => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    onNavigate ? onNavigate() : navigate(to);
  };
  return <a href={to} onClick={onClick} {...rest}>{children}</a>;
}

/* ─── tab bar ─── */

const NAV = [
  ["worth", "Net Worth", <path d="M3 17l5-5 4 4 8-9M15 7h5v5" />],
  ["dash", "Dashboard", <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />],
  ["cards", "Cards", <g><rect x="2.5" y="5" width="19" height="14" rx="2.5" /><path d="M2.5 10h19M6.5 15h4" /></g>],
  ["tools", "Tools", <path d="M14.5 6.5a4 4 0 0 0-5.3 5.3L3.5 17.5a1.4 1.4 0 0 0 2 2l5.7-5.7a4 4 0 0 0 5.3-5.3l-2.4 2.4-2-.5-.5-2z" />],
];

/* Pages that live under a tab without being one: they sit in Tools. */
const NAV_PARENT = { calc: "tools", prop: "tools", trav: "tools", pto: "tools" };
const PAGE_TITLES = { calc: "Pay Calc", prop: "Property", trav: "Travel", pto: "PTO" };

const NavIcon = ({ children }) => (
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"
    strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{children}</svg>
);

/* Desktop: a slim header with the wordmark and text tabs. Phone: the header
   keeps only the wordmark and the tabs move to a bar along the bottom. */
function TabBar({ view }) {
  const tab = NAV_PARENT[view] || view;
  return (
    <>
      <header className="topnav">
        <div className="topnav-inner">
          <Link to={pathFor("worth", "")} className="wordmark" aria-label="Gill &amp; Co. home: Net Worth"
            onNavigate={window.location.pathname === "/" ? () => window.scrollTo({ top: 0, behavior: "smooth" }) : undefined}>
            <img src="/logos/gill-co-wordmark.png" alt="" className="logo" /></Link>
          <nav className="topnav-tabs">
            {NAV.map(([key, label]) => (
              <Link key={key} to={pathFor(key, "")} className={tab === key ? "active" : ""}
                aria-current={view === key ? "page" : undefined}>{label}</Link>
            ))}
          </nav>
        </div>
      </header>
      <nav className="bottomnav">
        {NAV.map(([key, label, icon]) => (
          <Link key={key} to={pathFor(key, "")} className={tab === key ? "active" : ""} aria-label={label}
            aria-current={view === key ? "page" : undefined}>
            <NavIcon>{icon}</NavIcon>
            <span>{label}</span>
          </Link>
        ))}
      </nav>
    </>
  );
}

/* Section tabs inside a page: text with a gold underline. */
function SubTabs({ options, value, onChange, href }) {
  return (
    <div className="subtabs" role="tablist">
      {options.map(([key, label]) => (
        <Link key={key} to={href(key)} onNavigate={() => onChange(key)} role="tab" aria-selected={value === key}
          className={value === key ? "active" : ""}>{label}</Link>
      ))}
    </div>
  );
}

/* ─── Pay Calc (unchanged) ─── */

function useHistory(initial) {
  const [history, setHistory] = useState([initial]);
  const [cursor, setCursor] = useState(0);
  const state = history[cursor];
  const set = useCallback((updater) => {
    setHistory((prev) => {
      const next = typeof updater === "function" ? updater(prev[cursor]) : updater;
      return [...prev.slice(0, cursor + 1), next];
    });
    setCursor((c) => c + 1);
  }, [cursor]);
  const undo = useCallback(() => setCursor((c) => Math.max(0, c - 1)), []);
  const redo = useCallback(() => setCursor((c) => Math.min(history.length - 1, c + 1)), [history.length]);
  return { state, set, undo, redo, canUndo: cursor > 0, canRedo: cursor < history.length - 1 };
}

const CALC_INIT = { w1: "", w2: "", deductions: 35 };
// Straight day-shift rate only. Evening/night/weekend differentials are
// deliberately excluded so the estimate reflects pay you can count on.
const SUTTER_BASE   = 78.31;
const SUTTER_OT     = SUTTER_BASE * 1.5;  // 117.465
const WEEKLY_OT_THRESHOLD = 40;
const weekPay = (hrs) => {
  const h = parseFloat(hrs) || 0;
  if (h <= 0) return { hrs: 0, st: 0, ot: 0, total: 0 };
  if (h <= WEEKLY_OT_THRESHOLD) return { hrs: h, st: h * SUTTER_BASE, ot: 0, total: h * SUTTER_BASE };
  const st = WEEKLY_OT_THRESHOLD * SUTTER_BASE;
  const otPay = (h - WEEKLY_OT_THRESHOLD) * SUTTER_OT;
  return { hrs: h, st, ot: otPay, total: st + otPay };
};

function Calc() {
  const { state, set, undo, redo, canUndo, canRedo } = useHistory(CALC_INIT);
  const { w1, w2, deductions } = state;
  const update = (key) => (e) => set((s) => ({ ...s, [key]: e.target.value }));

  const w1Pay = weekPay(w1);
  const w2Pay = weekPay(w2);
  const stTotal = w1Pay.st + w2Pay.st;
  const otTotal = w1Pay.ot + w2Pay.ot;
  const totalGross = w1Pay.total + w2Pay.total;
  const dedPct    = n(deductions);
  const dedAmt    = totalGross * (dedPct / 100);
  const totalNet  = totalGross - dedAmt;
  const hasData   = totalGross > 0;
  const iconColor = (active) => active ? "#34483e" : "#858b83";

  return (
    <div style={{ display: "flex", justifyContent: "center", padding: "28px 24px 48px" }}>
      <div style={{ width: "100%", maxWidth: 420 }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 52 }}>
          <div>
            <p className="eyebrow"><Link to="/tools" style={{ color: "inherit", textDecoration: "none" }}>Tools</Link> · Sutter biweekly</p>
            <h1 style={{ margin: 0, lineHeight: 1.05 }}>Pay Calculator</h1>
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
            {[
              { fn: undo, can: canUndo, d: "M3 7v6h6 M3 13C5 7 10 3 16 3a9 9 0 0 1 0 18H3" },
              { fn: redo, can: canRedo, d: "M21 7v6h-6 M21 13C19 7 14 3 8 3a9 9 0 0 0 0 18h13" },
            ].map(({ fn, can, d }, i) => (
              <button key={i} onClick={fn} disabled={!can} style={{
                background: "transparent", border: `1px solid ${can ? "#858b83" : "rgba(31,58,46,0.1)"}`,
                borderRadius: 8, padding: "0 14px", minWidth: 44, minHeight: 44,
                cursor: can ? "pointer" : "not-allowed",
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor(can)} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  {d.split(" M").map((seg, j) => <path key={j} d={(j === 0 ? "" : "M") + seg} />)}
                </svg>
              </button>
            ))}
          </div>
        </div>

        <div style={{ marginBottom: 40 }}>
          <div style={{ marginBottom: 24 }}>
            <div style={{ marginBottom: 12 }}>
              <p style={{ fontSize: 13.5, letterSpacing: "0", color: "#66706a", fontWeight: 500, margin: 0 }}>Sutter · Biweekly Paycheck</p>
            </div>
            <div style={{ fontFamily: FONT, fontSize: 12.5, color: "#6e776f", lineHeight: 1.9 }}>
              <div>
                <span style={{ color: "#22362c" }}>Base</span>
                <span style={{ margin: "0 8px", color: "#b9bbb2" }}>·</span>
                <span style={{ color: "#66706a" }}>{fmt(SUTTER_BASE)}/hr</span>
                <span style={{ margin: "0 8px", color: "#b9bbb2" }}>·</span>
                <span style={{ color: "#66706a" }}>first 40 hrs/week</span>
              </div>
              <div>
                <span style={{ color: "#a8692e" }}>OT</span>
                <span style={{ margin: "0 8px", color: "#b9bbb2" }}>·</span>
                <span style={{ color: "#66706a" }}>{fmt(SUTTER_OT)}/hr</span>
                <span style={{ margin: "0 8px", color: "#b9bbb2" }}>·</span>
                <span style={{ color: "#66706a" }}>hours over 40/week</span>
              </div>
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
            <Field label="Week 1 Hours" value={w1} onChange={update("w1")} />
            <Field label="Week 2 Hours" value={w2} onChange={update("w2")} />
          </div>
        </div>

        <div style={{ borderTop: "1px solid rgba(31,58,46,0.1)", marginBottom: 40 }} />

        <div style={{ marginBottom: 52 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 20 }}>
            <p style={{ fontSize: 13.5, letterSpacing: "0", color: "#66706a", fontWeight: 500, margin: 0 }}>Deductions</p>
            <span style={{ fontFamily: FONT, fontSize: 18, color: "#1f3a2e" }}>{deductions}%</span>
          </div>
          <style>{`
            input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
            input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(31,58,46,0.1); border-radius: 2px; }
            input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #1f3a2e; margin-top: -8px; cursor: pointer; }
            input[type=range]::-moz-range-track { height: 2px; background: rgba(31,58,46,0.1); border-radius: 2px; }
            input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #1f3a2e; border: none; cursor: pointer; }
          `}</style>
          <input type="range" min="25" max="50" step="1" value={deductions}
            onChange={(e) => set((s) => ({ ...s, deductions: Number(e.target.value) }))} />
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8 }}>
            <span style={{ fontSize: 13.5, color: "#858b83", fontFamily: FONT }}>25%</span>
            <span style={{ fontSize: 13.5, color: "#858b83", fontFamily: FONT }}>50%</span>
          </div>
        </div>

        {hasData ? (
          <div>
            {w1Pay.total > 0 && (
              <Line
                label={`Week 1 · ${w1Pay.hrs}h${w1Pay.ot > 0 ? ` (${WEEKLY_OT_THRESHOLD} ST + ${(w1Pay.hrs - WEEKLY_OT_THRESHOLD).toFixed(2)} OT)` : ""}`}
                value={fmt(w1Pay.total)}
                muted
              />
            )}
            {w2Pay.total > 0 && (
              <Line
                label={`Week 2 · ${w2Pay.hrs}h${w2Pay.ot > 0 ? ` (${WEEKLY_OT_THRESHOLD} ST + ${(w2Pay.hrs - WEEKLY_OT_THRESHOLD).toFixed(2)} OT)` : ""}`}
                value={fmt(w2Pay.total)}
                muted
              />
            )}
            {otTotal > 0 && <Line label="Straight Time" value={fmt(stTotal)} muted />}
            {otTotal > 0 && <Line label="Overtime" value={fmt(otTotal)} muted />}
            <Line label="Total Gross" value={fmt(totalGross)} />
            {dedPct > 0 && <Line label="Deductions" value={`− ${fmt(dedAmt)}`} muted />}
            <Line label="Take Home" value={fmt(totalNet)} highlight large />
          </div>
        ) : (
          <p style={{ fontFamily: FONT, color: "#858b83", fontSize: 15, margin: 0 }}>
            Enter your hours above to see totals.
          </p>
        )}
      </div>
    </div>
  );
}

/* ─── Dashboard widgets ─── */

function Logo({ employer, size = 40 }) {
  const meta = EMPLOYER_META[employer];
  const [errored, setErrored] = useState(false);
  if (!meta || !meta.logo || errored) {
    return (
      <div style={{
        width: size, height: size, borderRadius: 10,
        background: colorFor(employer), color: "#fffdf8",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontFamily: FONT, fontSize: size * 0.36, fontWeight: 600, flexShrink: 0,
      }}>{employer.slice(0, 1)}</div>
    );
  }
  return (
    <div style={{
      width: size, height: size, borderRadius: 10, overflow: "hidden",
      background: "#ffffff", flexShrink: 0,
      display: "flex", alignItems: "center", justifyContent: "center",
    }}>
      <img src={meta.logo} alt={meta.full}
        onError={() => setErrored(true)}
        style={{ width: "82%", height: "82%", objectFit: "contain" }} />
    </div>
  );
}

function StatCard({ label, value, sub, accent }) {
  return (
    <div className="stat-card" style={{
      background: "#fffdf8",
      border: "1px solid rgba(31,58,46,0.1)", borderRadius: 16, padding: "22px 24px",
      position: "relative", overflow: "hidden",
    }}>
      <div style={{ fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "#66706a", fontWeight: 500, marginBottom: 14 }}>{label}</div>
      <div className="stat-value" style={{ fontFamily: FONT, fontSize: 27, fontWeight: 600, color: accent, lineHeight: 1.05, letterSpacing: "-0.01em" }}>{value}</div>
      {sub && <div style={{ fontFamily: FONT, fontSize: 12.5, color: "#6e776f", marginTop: 10 }}>{sub}</div>}
    </div>
  );
}

/* Hover a slice or legend row (tap on a phone) to focus it. `active` and
   `onActive` are optional, for pages that show more detail elsewhere. */
function PieChart({ data, size = 240, centerLabel = "YTD GROSS", active: activeProp, onActive }) {
  const [own, setOwn] = useState(null);
  const active = activeProp !== undefined ? activeProp : own;
  const setActive = (i) => { setOwn(i); onActive && onActive(i); };
  // Before the "No data" return: hooks must run the same number of times on
  // every render, and data arrives after the first one.
  const lastPointer = useRef("mouse");
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) {
    return (
      <div style={{ textAlign: "center", color: "#858b83", fontFamily: FONT, padding: "40px 0" }}>
        No data
      </div>
    );
  }
  const pad = 8;
  const cx = size / 2, cy = size / 2, r = size / 2 - pad, innerR = r * 0.6;
  let cum = -Math.PI / 2;
  const slices = data.map((d) => {
    const angle = (d.value / total) * Math.PI * 2;
    const a1 = cum, a2 = cum + angle;
    cum = a2;
    const large = angle > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const xi1 = cx + innerR * Math.cos(a1), yi1 = cy + innerR * Math.sin(a1);
    const xi2 = cx + innerR * Math.cos(a2), yi2 = cy + innerR * Math.sin(a2);
    const path = `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${innerR} ${innerR} 0 ${large} 0 ${xi1} ${yi1} Z`;
    const mid = (a1 + a2) / 2;
    return { path, color: d.color, label: d.label, value: d.value, pct: (d.value / total) * 100, dx: Math.cos(mid) * 6, dy: Math.sin(mid) * 6 };
  });
  const focus = active != null ? slices[active] : null;
  const toggle = (i) => setActive(active === i ? null : i);
  // Hover follows a real mouse only; a tap fires a fake hover before its
  // click, which would otherwise select and then immediately unselect.
  const isMouse = (e) => e.pointerType === "mouse";
  const pick = (i) => (lastPointer.current === "mouse" ? setActive(i) : toggle(i));

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: "100%" }}>
      <svg width={size} height={size} style={{ overflow: "visible" }} onPointerLeave={(e) => isMouse(e) && setActive(null)}
        onPointerDown={(e) => { lastPointer.current = e.pointerType; }}>
        {slices.map((s, i) => (
          <path key={i} d={s.path} fill={s.color} stroke="#fffdf8" strokeWidth="2"
            transform={active === i ? `translate(${s.dx} ${s.dy})` : undefined}
            opacity={active != null && active !== i ? 0.35 : 1}
            style={{ cursor: "pointer", transition: "transform 0.15s ease, opacity 0.15s ease" }}
            onPointerEnter={(e) => isMouse(e) && setActive(i)} onClick={() => pick(i)} />
        ))}
        <text x={cx} y={cy - 6} textAnchor="middle" style={{ fill: focus ? focus.color : "#66706a", fontSize: 11, letterSpacing: "0.12em", fontFamily: FONT, textTransform: "uppercase" }}>
          {focus ? (focus.label.length > 22 ? focus.label.slice(0, 21) + "…" : focus.label) : centerLabel}
        </text>
        <text x={cx} y={cy + 20} textAnchor="middle" style={{ fill: "#1f3a2e", fontSize: 21, fontFamily: FONT, fontWeight: 600 }}>
          {fmt0(focus ? focus.value : total)}
        </text>
        {focus && (
          <text x={cx} y={cy + 40} textAnchor="middle" style={{ fill: "#6e776f", fontSize: 12, fontFamily: FONT }}>{focus.pct.toFixed(1)}% of total</text>
        )}
      </svg>
      <div style={{ marginTop: 20, display: "flex", flexDirection: "column", width: "100%" }}>
        {slices.map((s, i) => (
          <div key={i} onPointerEnter={(e) => isMouse(e) && setActive(i)} onPointerLeave={(e) => isMouse(e) && setActive(null)}
            onPointerDown={(e) => { lastPointer.current = e.pointerType; }}
            onClick={() => pick(i)}
            style={{
              display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, cursor: "pointer",
              padding: "6px 8px", margin: "0 -8px", borderRadius: 8,
              background: active === i ? "rgba(31,58,46,0.062)" : "transparent",
              opacity: active != null && active !== i ? 0.55 : 1, transition: "opacity 0.15s ease",
            }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, flexShrink: 0 }} />
              <span style={{ fontSize: 12.5, color: "#34483e", fontFamily: FONT, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.label}</span>
            </div>
            <div style={{ display: "flex", gap: 12, alignItems: "baseline", flexShrink: 0 }}>
              <span style={{ fontFamily: FONT, fontSize: 13.5, color: "#22362c" }}>{fmt0(s.value)}</span>
              <span style={{ fontFamily: FONT, fontSize: 12.5, color: "#6e776f", minWidth: 44, textAlign: "right" }}>{s.pct.toFixed(1)}%</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ProjectionCard({ ytdGross, projection, paystubs }) {
  if (!projection || !projection.monthly) return null;
  const actualsByMonth = {};
  for (const p of paystubs || []) {
    if (!p.pay_date) continue;
    const ym = p.pay_date.slice(0, 7);
    if (!actualsByMonth[ym]) actualsByMonth[ym] = {};
    actualsByMonth[ym][p.employer] = (actualsByMonth[ym][p.employer] || 0) + n(p.gross);
  }
  let remaining = 0;
  const byEmployer = {};
  for (const ym in projection.monthly) {
    for (const emp in projection.monthly[ym]) {
      const proj = n(projection.monthly[ym][emp]);
      const actual = (actualsByMonth[ym] && actualsByMonth[ym][emp]) || 0;
      const rem = Math.max(0, proj - actual);
      remaining += rem;
      if (rem > 0) byEmployer[emp] = (byEmployer[emp] || 0) + rem;
    }
  }
  const total = ytdGross + remaining;
  const empKeys = [
    ...EMPLOYERS.filter((e) => byEmployer[e]),
    ...Object.keys(byEmployer).filter((e) => !EMPLOYERS.includes(e)),
  ];
  return (
    <div style={{
      background: "#fffdf8",
      border: "1px solid rgba(31,58,46,0.1)", borderRadius: 16, padding: 28,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24, flexWrap: "wrap", gap: 16 }}>
        <div>
          <div style={{ fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "#66706a", marginBottom: 12 }}>2026 Year-End Projection</div>
          <div style={{ fontFamily: FONT, fontSize: 34, color: "#2f7a4e", fontWeight: 600, lineHeight: 1, letterSpacing: "-0.01em" }}>{fmt(total)}</div>
          <div style={{ fontFamily: FONT, fontSize: 12.5, color: "#6e776f", marginTop: 10 }}>
            {fmt(ytdGross)} earned + {fmt(remaining)} projected
          </div>
        </div>
        {projection.notes && (
          <details className="fine" style={{ maxWidth: 360, fontFamily: FONT }}>
            <summary>How this is projected</summary>
            <div style={{ color: "#66706a", fontSize: 12.5, lineHeight: 1.55, marginTop: 8 }}>{projection.notes}</div>
          </details>
        )}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 16 }}>
        <div style={{ borderLeft: "2px solid #a1a59c", paddingLeft: 14 }}>
          <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#6e776f", marginBottom: 6 }}>YTD Earned</div>
          <div style={{ fontFamily: FONT, fontSize: 18, color: "#22362c" }}>{fmt(ytdGross)}</div>
        </div>
        {empKeys.map((emp) => (
          <div key={emp} style={{ borderLeft: `2px solid ${colorFor(emp)}`, paddingLeft: 14 }}>
            <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#6e776f", marginBottom: 6 }}>Projected {emp}</div>
            <div style={{ fontFamily: FONT, fontSize: 18, color: "#22362c" }}>{fmt(byEmployer[emp])}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function ChartTooltip({ ym, data, metric, showProjected = true, x, y, containerW }) {
  const [yearStr, monthStr] = ym.split("-");
  const monthName = MONTH_LABELS[Number(monthStr) - 1] + " " + yearStr;
  const stubs = data.stubs || [];
  const projByEmp = showProjected ? (data.projByEmp || {}) : {};
  const hasActual = stubs.length > 0;
  const hasProj = Object.keys(projByEmp).length > 0;

  let totalGross = 0, totalNet = 0;
  for (const p of stubs) {
    totalGross += n(p.gross);
    totalNet += n(p.net);
  }
  for (const emp in projByEmp) {
    totalGross += n(projByEmp[emp].gross);
    totalNet += n(projByEmp[emp].netProxy);
  }
  const totalShown = metric === "net" ? totalNet : totalGross;
  const totalColor = metric === "net" ? "#2f7a4e" : "#22362c";

  const tipW = 280;
  let left = x + 16;
  if (containerW && left + tipW > containerW - 12) left = Math.max(8, x - tipW - 16);
  const top = Math.max(8, y - 20);

  const label = hasProj && !hasActual ? "Projected" : hasProj && hasActual ? "Partial" : "";

  return (
    <div style={{
      position: "absolute", left, top, width: tipW,
      background: "rgba(255,253,248,0.98)", border: "1px solid #d8d0bf",
      borderRadius: 10, padding: "12px 14px",
      pointerEvents: "none", zIndex: 10,
      boxShadow: "0 8px 24px rgba(31,58,46,0.14)",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10, gap: 8 }}>
        <div style={{ fontSize: 12.5, letterSpacing: "0", color: "#22362c", fontFamily: FONT }}>{monthName}</div>
        {label && <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#9a7128", fontFamily: FONT }}>{label}</div>}
      </div>

      {hasActual && (
        <div style={{ marginBottom: hasProj ? 12 : 0 }}>
          {stubs.map((p, i) => (
            <div key={i} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "6px 0", borderTop: i === 0 ? "none" : "1px solid rgba(31,58,46,0.062)",
              fontSize: 12.5, fontFamily: FONT, gap: 12,
            }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ color: colorFor(p.employer), fontSize: 13.5, letterSpacing: "0.1em" }}>{p.employer}</div>
                <div style={{ color: "#6e776f", fontSize: 13.5, marginTop: 2 }}>{formatPayDate(p.pay_date)}</div>
              </div>
              <div style={{ color: "#22362c", whiteSpace: "nowrap" }}>{fmt(metric === "net" ? n(p.net) : n(p.gross))}</div>
            </div>
          ))}
        </div>
      )}

      {hasProj && (
        <div>
          {hasActual && <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#9a7128", fontFamily: FONT, marginBottom: 6 }}>Still Projected</div>}
          {Object.keys(projByEmp).map((emp) => {
            const v = metric === "net" ? n(projByEmp[emp].netProxy) : n(projByEmp[emp].gross);
            return (
              <div key={emp} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 12.5, fontFamily: FONT }}>
                <span style={{ color: colorFor(emp), fontSize: 13.5, letterSpacing: "0.1em" }}>{emp}</span>
                <span style={{ color: "#22362c", opacity: 0.75 }}>{fmt(v)}</span>
              </div>
            );
          })}
        </div>
      )}

      {!hasActual && !hasProj && (
        <div style={{ fontFamily: FONT, color: "#6e776f", fontSize: 13.5 }}>No paychecks this month.</div>
      )}

      <div style={{ borderTop: "1px solid #d8d0bf", marginTop: 10, paddingTop: 10, display: "flex", justifyContent: "space-between", fontFamily: FONT }}>
        <span style={{ color: "#66706a", letterSpacing: "0", fontSize: 13.5 }}>Total {metric}</span>
        <span style={{ color: totalColor, fontSize: 13.5, fontWeight: 500 }}>{fmt(totalShown)}</span>
      </div>
    </div>
  );
}

function MonthlyChart({ paystubs, projection, year }) {
  const [metric, setMetric] = useState("gross");
  const [showProjected, setShowProjected] = useState(true);
  const [hovered, setHovered] = useState(null);
  const containerRef = useRef(null);

  const ratios = useMemo(() => {
    const r = {};
    for (const p of paystubs) {
      if (!r[p.employer]) r[p.employer] = { g: 0, n: 0 };
      r[p.employer].g += n(p.gross);
      r[p.employer].n += n(p.net);
    }
    const out = {};
    for (const e in r) out[e] = r[e].g > 0 ? r[e].n / r[e].g : 1;
    return out;
  }, [paystubs]);

  const monthly = {};
  for (let m = 1; m <= 12; m++) {
    const ym = `${year}-${String(m).padStart(2, "0")}`;
    monthly[ym] = { stubs: [], actualByEmp: {}, projByEmp: {}, hasProjection: false };
  }
  for (const p of paystubs) {
    if (!p.pay_date) continue;
    const ym = p.pay_date.slice(0, 7);
    if (!monthly[ym]) continue;
    monthly[ym].stubs.push(p);
    if (!monthly[ym].actualByEmp[p.employer]) monthly[ym].actualByEmp[p.employer] = { gross: 0, net: 0 };
    monthly[ym].actualByEmp[p.employer].gross += n(p.gross);
    monthly[ym].actualByEmp[p.employer].net += n(p.net);
  }
  if (projection && projection.monthly) {
    for (const ym in projection.monthly) {
      if (!monthly[ym]) continue;
      const mp = projection.monthly[ym];
      for (const emp in mp) {
        const projected = n(mp[emp]);
        const actualGross = (monthly[ym].actualByEmp[emp] && monthly[ym].actualByEmp[emp].gross) || 0;
        const remaining = Math.max(0, projected - actualGross);
        if (remaining > 0.01) {
          const rat = ratios[emp] != null ? ratios[emp] : 1;
          monthly[ym].projByEmp[emp] = { gross: remaining, netProxy: remaining * rat };
          monthly[ym].hasProjection = true;
        }
      }
    }
  }

  const handleHover = (ym) => (e) => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    setHovered({ ym, x: e.clientX - rect.left, y: e.clientY - rect.top });
  };
  const handleLeave = () => setHovered(null);
  const monthsArr = Object.keys(monthly).sort();
  const grossTotals = monthsArr.map((k) => {
    const m = monthly[k];
    let total = 0;
    for (const emp in m.actualByEmp) total += m.actualByEmp[emp].gross;
    for (const emp in m.projByEmp) total += m.projByEmp[emp].gross;
    return total;
  });
  const max = Math.max(...grossTotals, 1);
  const yMax = Math.ceil(max / 5000) * 5000 || 5000;

  const W = 800, H = 280, ML = 56, MR = 12, MT = 12, MB = 30;
  const innerW = W - ML - MR;
  const innerH = H - MT - MB;
  const slot = innerW / 12;
  const barWidth = slot * 0.62;

  const gridSteps = 4;
  const gridLines = [];
  for (let i = 0; i <= gridSteps; i++) {
    const val = (yMax / gridSteps) * i;
    const y = MT + innerH - (val / yMax) * innerH;
    gridLines.push({ val, y });
  }

  const allEmployers = [
    ...EMPLOYERS,
    ...Array.from(new Set(monthsArr.flatMap((k) => [
      ...Object.keys(monthly[k].actualByEmp),
      ...Object.keys(monthly[k].projByEmp),
    ]))).filter((e) => !EMPLOYERS.includes(e)),
  ];

  return (
    <div ref={containerRef} style={{
      background: "#fffdf8",
      border: "1px solid rgba(31,58,46,0.1)", borderRadius: 16, padding: 24,
      position: "relative",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
          <div style={{ fontSize: 13.5, letterSpacing: "0", color: "#66706a" }}>
            Monthly {metric === "net" ? "Net" : "Gross"} · {year}
          </div>
          <div style={{ display: "flex", gap: 2, background: "#efe9dc", border: "1px solid rgba(31,58,46,0.1)", borderRadius: 8, padding: 2 }}>
            {[["gross", "Gross"], ["net", "Net"]].map(([key, label]) => {
              const active = metric === key;
              return (
                <button key={key} onClick={() => setMetric(key)} style={{
                  background: active ? (key === "net" ? "#2f7a4e" : "#22362c") : "transparent",
                  color: active ? "#f6f1e7" : "#6e776f",
                  border: "none", borderRadius: 6, padding: "0 14px", cursor: "pointer",
                  minHeight: 44, display: "inline-flex", alignItems: "center", justifyContent: "center",
                  fontSize: 13.5, letterSpacing: "0",
                  fontFamily: FONT, fontWeight: 500,
                }}>{label}</button>
              );
            })}
          </div>
          <button onClick={() => setShowProjected((v) => !v)} style={{
            display: "flex", alignItems: "center", gap: 7,
            background: showProjected ? "rgba(154,113,40,0.12)" : "transparent",
            border: `1px solid ${showProjected ? "#9a7128" : "#b9bbb2"}`,
            borderRadius: 8, padding: "0 14px", minHeight: 44, cursor: "pointer",
            fontSize: 13.5, letterSpacing: "0",
            color: showProjected ? "#9a7128" : "#6e776f", fontFamily: FONT,
          }}>
            <span style={{
              width: 9, height: 9, borderRadius: 2,
              background: showProjected ? "rgba(154,113,40,0.35)" : "transparent",
              border: `1px dashed ${showProjected ? "#9a7128" : "#6e776f"}`,
            }} />
            Projected
          </button>
        </div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
          {allEmployers.map((emp) => (
            <div key={emp} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: colorFor(emp) }} />
              <span style={{ fontSize: 13.5, letterSpacing: "0", color: "#34483e", fontFamily: FONT }}>{emp}</span>
            </div>
          ))}
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 10, height: 10, borderRadius: 3, background: "transparent", border: "1px dashed #7c847c" }} />
            <span style={{ fontSize: 13.5, letterSpacing: "0", color: "#6e776f", fontFamily: FONT }}>Projected</span>
          </div>
        </div>
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
        {gridLines.map((g, i) => (
          <g key={i}>
            <line x1={ML} x2={W - MR} y1={g.y} y2={g.y}
              stroke="rgba(31,58,46,0.1)" strokeWidth="1"
              strokeDasharray={i === 0 ? "" : "2,4"} />
            <text x={ML - 8} y={g.y + 3} textAnchor="end"
              style={{ fill: "#858b83", fontSize: 11.5, fontFamily: FONT }}>
              {g.val >= 1000 ? `$${(g.val / 1000).toFixed(0)}k` : `$${g.val.toFixed(0)}`}
            </text>
          </g>
        ))}
        {monthsArr.map((ym, i) => {
          const data = monthly[ym];
          const x = ML + slot * i + (slot - barWidth) / 2;
          let yCursor = MT + innerH;
          const empSet = new Set([...Object.keys(data.actualByEmp), ...Object.keys(data.projByEmp)]);
          const empOrder = [
            ...EMPLOYERS.filter((e) => empSet.has(e)),
            ...Array.from(empSet).filter((e) => !EMPLOYERS.includes(e)),
          ];
          const segments = [];
          for (const emp of empOrder) {
            const act = data.actualByEmp[emp];
            if (act) {
              const val = metric === "net" ? act.net : act.gross;
              if (val > 0) {
                const h = (val / yMax) * innerH;
                yCursor -= h;
                segments.push({ x, y: yCursor, w: barWidth, h, color: colorFor(emp), emp, isProjection: false });
              }
            }
            const proj = data.projByEmp[emp];
            if (proj && showProjected) {
              const val = metric === "net" ? proj.netProxy : proj.gross;
              if (val > 0) {
                const h = (val / yMax) * innerH;
                yCursor -= h;
                segments.push({ x, y: yCursor, w: barWidth, h, color: colorFor(emp), emp, isProjection: true });
              }
            }
          }
          const monthTotal = segments.reduce((s, seg) => s + (seg.h * yMax) / innerH, 0);
          const isHovered = hovered && hovered.ym === ym;
          const isAllProjection = data.stubs.length === 0 && data.hasProjection && showProjected;
          return (
            <g key={ym}>
              {segments.map((s, j) => (
                <rect key={j} x={s.x} y={s.y} width={s.w} height={s.h}
                  fill={s.isProjection ? `${s.color}55` : s.color}
                  stroke={s.isProjection ? s.color : "none"}
                  strokeDasharray={s.isProjection ? "3,3" : ""}
                  strokeWidth="1.5" rx="2"
                  opacity={hovered && !isHovered ? 0.45 : 1} />
              ))}
              {monthTotal > 0 && (
                <text x={x + barWidth / 2} y={MT + innerH - (monthTotal / yMax) * innerH - 6}

const CADENCE_META = {
  monthly:    { label: "Monthly",     order: 1 },
  quarterly:  { label: "Quarterly",   order: 2 },
  semiannual: { label: "Semi-Annual", order: 3 },
  annual:     { label: "Annual",      order: 4 },
  multiyear:  { label: "Multi-Year",  order: 5 },
};

// Every period in `year` for a cadence, tagged past / current / future.
const periodsFor = (cadence, year, today) => {
  const now = today || new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  const rel = (startM, endM) => {
    if (year < curY) return "past";
    if (year > curY) return "future";
    if (curM > endM) return "past";
    if (curM < startM) return "future";
    return "current";
  };
  // Last calendar day of month `m` — day 0 of the next month.
  const endOf = (m) => new Date(year, m + 1, 0);
  const out = [];
  if (cadence === "monthly") {
    for (let i = 0; i < 12; i++) {
      out.push({ key: `${year}-${String(i + 1).padStart(2, "0")}`, label: MONTH_LABELS[i], when: rel(i, i), end: endOf(i) });
    }
  } else if (cadence === "quarterly") {
    for (let i = 0; i < 4; i++) {
      out.push({ key: `${year}-Q${i + 1}`, label: `Q${i + 1}`, when: rel(i * 3, i * 3 + 2), end: endOf(i * 3 + 2) });
    }
  } else if (cadence === "semiannual") {
    out.push({ key: `${year}-H1`, label: "Jan–Jun", when: rel(0, 5),  end: endOf(5) });
    out.push({ key: `${year}-H2`, label: "Jul–Dec", when: rel(6, 11), end: endOf(11) });
  } else if (cadence === "annual") {
    out.push({ key: `${year}`, label: String(year), when: rel(0, 11), end: endOf(11) });
  } else {
    out.push({ key: "once", label: "One-time", when: "current", end: new Date(year + 50, 0, 1) });
  }
  return out;
};

const DAY_MS = 86400000;
const daysUntil = (d, today) => {
  const now = today || new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((b - a) / DAY_MS);
};

const NO_CLAIMS = { on: new Set(), off: new Set() };

// `claims` is { on, off }: period keys marked used / explicitly un-marked.
const benefitStatus = (benefit, year, claims = NO_CLAIMS) => {
  const periods = periodsFor(benefit.cadence, year);
  const per = n(benefit.per);
  // An `auto` credit reimburses a charge the card already pays on its own
  // (Disney+, Walmart+), so every period that has come round is captured
  // whether or not anyone ticked it off — unless it was un-marked by hand.
  const cs = new Set(claims.on);
  if (benefit.auto) {
    for (const p of periods) if (p.when !== "future" && !claims.off.has(p.key)) cs.add(p.key);
  }
  const hits = periods.filter((p) => cs.has(p.key));
  const open = periods.filter((p) => !cs.has(p.key) && p.when === "current");
  // Done for the year: every period claimed, or — for auto-recurring credits —
  // everything up to now, since the rest posts on its own.
  const allClaimed = periods.every((p) => cs.has(p.key));
  const autoDone = !!benefit.auto && periods.filter((p) => p.when !== "future").every((p) => cs.has(p.key));
  // A benefit can override its deadline (e.g. credits that reset on the card
  // anniversary rather than the calendar year).
  const override = benefit.expires ? new Date(benefit.expires + "T00:00:00") : null;
  const expiresAt = open.length ? (override || open[0].end) : null;
  return {
    periods, claimedSet: cs, hits, open, per,
    complete: allClaimed || autoDone,
    captured: hits.length * per,
    total: periods.length * per,
    atStake: open.length * per,
    expiresAt,
    daysLeft: expiresAt ? daysUntil(expiresAt) : null,
  };
};

/* ─── Card claims ───
   Which credits are used is stored in Supabase, through /api/claims in
   worker.js (the site password is the only login). Each row is one benefit
   for one period ("2026-Q4") with claimed true/false. The worker also marks
   YNAB statement credits used before answering, so the list arrives current. */

const claimKey = (cardId, benefitId, period) => `${cardId}|${benefitId}|${period}`;

function useCardClaims() {
  const [rows, setRows] = useState(() => new Map());
  const [status, setStatus] = useState({ loading: true, saving: false, error: "", ynab: { ok: null, error: "" } });
  const [msg, setMsg] = useState("");

  const flash = useCallback((text) => {
    setMsg(text);
    setTimeout(() => setMsg((m) => m === text ? "" : m), 4000);
  }, []);

  // Each load also has the worker pull fresh credits from YNAB, so this is
  // what the Refresh button calls too.
  const [refreshing, setRefreshing] = useState(false);
  const reload = useCallback(() => {
    setRefreshing(true);
    return fetch("/api/claims", { cache: "no-store" })
      .then((r) => r.json())
      .then((d) => {
        setRows(new Map((d.rows || []).map((r) => [claimKey(r.card_id, r.benefit_id, r.period), r])));
        setStatus({ loading: false, saving: !!d.saving, error: d.error || "", ynab: d.ynab || { ok: false, error: "" } });
      })
      .catch(() => setStatus({ loading: false, saving: false, error: "Couldn't reach the server", ynab: { ok: false, error: "" } }))
      .finally(() => setRefreshing(false));
  }, []);

  useEffect(() => { reload(); }, [reload]);

  // { "card|benefit": { on: Set(periods), off: Set(periods) } }
  const index = useMemo(() => {
    const idx = new Map();
    for (const r of rows.values()) {
      const k = `${r.card_id}|${r.benefit_id}`;
      if (!idx.has(k)) idx.set(k, { on: new Set(), off: new Set() });
      idx.get(k)[r.claimed ? "on" : "off"].add(r.period);
    }
    return idx;
  }, [rows]);

  const claimsFor = useCallback((cardId, benefitId) => index.get(`${cardId}|${benefitId}`) || NO_CLAIMS, [index]);

  // Mark periods used (or not). Shows straight away; rolls back if the save
  // fails. Resolves true when it saved.
  const setClaimed = useCallback(async (cardId, benefitId, periods, claimed) => {
    if (!periods.length) return true;
    let before;
    setRows((m) => {
      before = m;
      const out = new Map(m);
      for (const period of periods) {
        const k = claimKey(cardId, benefitId, period);
        out.set(k, { ...out.get(k), card_id: cardId, benefit_id: benefitId, period, claimed, source: "manual" });
      }
      return out;
    });
    try {
      const res = await fetch("/api/claims", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ card_id: cardId, benefit_id: benefitId, periods, claimed }),
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `error ${res.status}`);
      return true;
    } catch (e) {
      setRows(before);
      flash("Couldn't save — " + (e.message || "check your connection"));
      return false;
    }
  }, [flash]);

  const years = useMemo(() => {
    const ys = new Set();
    for (const r of rows.values()) { const y = parseInt(r.period, 10); if (!isNaN(y)) ys.add(y); }
    return ys;
  }, [rows]);

  return { claimsFor, setClaimed, status, msg, years, reload, refreshing };
}

function PeriodChip({ period, hit, wide, pendingAuto, onToggle, changed }) {
  // Captured is captured: every claimed period reads green, whether or not the
  // rest of the year is done. What still needs doing stays amber.
  let bg = "transparent", border = "rgba(31,58,46,0.069)", color = "#b9bbb2", weight = 450;
  if (hit)                            { bg = "rgba(47,122,78,0.13)";  border = "transparent"; color = "#2f7a4e"; }
  else if (pendingAuto)               { bg = "transparent"; border = "rgba(47,122,78,0.28)"; color = "#4d8462"; }
  else if (period.when === "current") { bg = "rgba(154,113,40,0.14)"; border = "#9a7128"; color = "#9a7128"; weight = 550; }
  const chip = (
    <div style={{
      minWidth: wide ? 58 : 27, height: 19, padding: "0 4px", flexShrink: 0,
      borderRadius: 4, background: bg, border: `1px solid ${border}`, color,
      fontFamily: FONT, fontSize: 12.5, fontWeight: weight,
      display: "flex", alignItems: "center", justifyContent: "center",
      // Unsaved change: dashed gold ring until Save.
      outline: changed ? "1.5px dashed #9a7128" : "none", outlineOffset: 1,
    }}>{period.label}</div>
  );
  // Signed in, every period that has come round is a tap target. The padding
  // makes the target taller than the chip without changing how it looks.
  if (!onToggle) return chip;
  // Not yet tappable, but padded the same so it lines up with its neighbours.
  if (period.when === "future") return <div style={{ padding: "9px 0", flexShrink: 0 }}>{chip}</div>;
  return (
    <button type="button" onClick={onToggle} className="chip-btn"
      aria-pressed={hit} aria-label={`${period.label}: ${hit ? "used" : "not used"}`}>
      {chip}
    </button>
  );
}

        )}

      </span>

function CardBlock({ card, year, claimsFor, onToggle, changedFor }) {
  const accent = card.color || "#2f7a4e";
  const [showPerks, setShowPerks] = useState(false);
  let captured = 0, total = 0, openN = 0;

    captured += st.captured;
    total    += st.total;
    openN    += st.open.length;
  }
  const pct = total ? (captured / total) * 100 : 0;

  const groups = {};
  for (const b of card.benefits || []) {
    if (!groups[b.cadence]) groups[b.cadence] = [];
    groups[b.cadence].push(b);
  }
  const cadences = Object.keys(groups).sort(

  );

  return (
    <div style={{
      background: "#fffdf8",
      border: "1px solid rgba(31,58,46,0.1)", borderLeft: `3px solid ${accent}`,
      borderRadius: 12, padding: "16px 18px", marginBottom: 12,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>

          <div style={{
            width: 30, height: 20, borderRadius: 4, flexShrink: 0,

          <span style={{ fontFamily: FONT, fontSize: 15.5, fontWeight: 600, color: "#1f3a2e", lineHeight: 1.2 }}>{card.name}</span>

        </div>

      <div style={{ height: 3, borderRadius: 3, background: "rgba(31,58,46,0.075)", marginBottom: 14, overflow: "hidden" }}>

      {cadences.map((cad) => (
        <div key={cad} style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 10.5, letterSpacing: "0", color: "#858b83", marginBottom: 2 }}>
            {CADENCE_META[cad]?.label || cad}
          </div>
          {groups[cad].map((b, i) => (
            <BenefitRow key={b.id} benefit={b} year={year} accent={accent} first={i === 0}
              claims={claimsFor(card.id, b.id)}
              changed={changedFor && changedFor(card.id, b.id)}
              onToggle={onToggle && ((benefitId, periods, claimed) => onToggle(card.id, benefitId, periods, claimed))} />
          ))}
        </div>
      ))}

      {card.perks && card.perks.length > 0 && (
        <div style={{ borderTop: "1px solid rgba(31,58,46,0.062)", paddingTop: 8, marginTop: 2 }}>
          <button onClick={() => setShowPerks((v) => !v)} style={{

            fontFamily: FONT, fontSize: 12.5, letterSpacing: "0",

            <ul style={{ margin: "8px 0 0", paddingLeft: 16, color: "#6e776f", fontSize: 13.5, lineHeight: 1.7 }}>
              {card.perks.map((p, i) => <li key={i}>{p}</li>)}
            </ul>
          )}
        </div>
      )}
    </div>
  );
}

    <div style={{

      borderLeft: `3px solid ${rows.length ? "#9a7128" : "#2f7a4e"}`,

        </div>

        const deadline = openEnded

              <span style={{ marginLeft: 8, color: "#858b83", fontSize: 13.5 }}>{r.open.map((p) => p.label).join(", ")}</span>
            </div>
            <span style={{ color: urgent, fontSize: 13.5, flexShrink: 0, minWidth: 118, textAlign: "right" }}>
              {deadline}
            </span>
            <span style={{ color: "#22362c", flexShrink: 0, minWidth: 46, textAlign: "right" }}>{fmt0(r.atStake)}</span>
            {onMark && (
              <button type="button" onClick={() => onMark(r.card.id, r.benefit.id, r.open.map((p) => p.key), true)}
                className="mark-btn" aria-label={`Mark ${r.card.name} ${r.benefit.name} used`}>

/* Top-right of the Cards page: is YNAB answering, and are taps being saved. */
function CardsSyncStatus({ status, onRefresh, refreshing, onEdit }) {
  const dot = (ok) => (
    <span style={{ width: 6, height: 6, borderRadius: 3, display: "inline-block", marginRight: 6,
      background: ok == null ? "#b9bbb2" : ok ? "#2f7a4e" : "#b5483b" }} />
  );
  const small = { fontFamily: FONT, fontSize: 12.5, color: "#6e776f", display: "inline-flex", alignItems: "center" };
  const loading = status.loading;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
      <span style={small} title={status.ynab.error || "Statement credits found in YNAB are marked used automatically"}>
        {dot(loading ? null : status.ynab.ok)}{!loading && status.ynab.ok === false ? "YNAB offline" : "YNAB"}
      </span>
      <span style={small} title={status.error || "Taps are saved and show on every device"}>
        {dot(loading ? null : status.saving)}{loading ? "Loading" : status.saving ? "Saving on" : "Read-only"}
      </span>
      <button type="button" onClick={onRefresh} disabled={refreshing} className="refresh-btn"
        title="Pull the latest credits from YNAB and reload" aria-label="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
          strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className={refreshing ? "spin" : ""}>
          <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" />
        </svg>
        <span>{refreshing ? "Refreshing" : "Refresh"}</span>
      </button>
      {onEdit && (
        <button type="button" onClick={onEdit} className="refresh-btn edit-btn" title="Change which credits are marked used">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
            strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4" />
          </svg>
