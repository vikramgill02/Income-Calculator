      const saved = window.localStorage.getItem(DRAFT_KEY);
      if (saved) return { ...PROP_DEFAULTS, ...JSON.parse(saved) };
    } catch (e) {}
    return { ...PROP_DEFAULTS };
  });
  const set = useCallback((key) => (val) => setV((prev) => ({ ...prev, [key]: val })), []);
  const [sub, setSub, subHref] = useSubRoute("prop", "deal", ["deal", "projections"]);
  const [showSync, setShowSync] = useState(false);
  const deals = useDeals(v, setV);

  /* Keep the in-progress deal across tab switches and reloads. */
  useEffect(() => {
    try { window.localStorage.setItem(DRAFT_KEY, JSON.stringify(v)); } catch (e) {}
  }, [v]);

  return (
    <div className="prop-wrap">
      <div>
        <div className="page-head">
          <div>
            <p className="eyebrow">Rental deal analyzer</p>
            <h1 style={{ margin: 0, lineHeight: 1.05 }}>Property</h1>
          </div>
          {syncConfigured() && deals.ready && (
            <button onClick={() => setShowSync((x) => !x)} style={{
              background: showSync ? "rgba(201,169,110,0.14)" : "transparent", color: "#c9a96e",
              border: "1px solid rgba(201,169,110,0.4)", borderRadius: 999, padding: "0 16px", minHeight: 36,
              fontFamily: FONT, fontSize: 12.5, cursor: "pointer",
            }}>{deals.session ? "Saved deals" : "Sign in to sync"}</button>
          )}
        </div>

        {showSync && syncConfigured() && deals.ready && (deals.session ? <DealsBar d={deals} /> : <SignIn />)}

        <SubTabs options={[["deal", "Deal"], ["projections", "Projections"]]} value={sub} onChange={setSub} href={subHref} />
        {sub === "deal" ? <DealTab v={v} set={set} /> : <ProjectionsTab v={v} set={set} />}
      </div>
    </div>
  );
}

/* ─── App shell ─── */

/* ─── Net Worth ───
   Data comes from worker.js: /api/networth (Fidelity holdings from
   networth.json priced live, cash and credit cards from YNAB, and loans). */

const NW_COLORS = {
  liquid: "#93c4a2",
  netWorth: "#ece5d8",
  debt: "#d98a80",
  milestone: "#c9a96e",
};
// Cash and the Fidelity CMA share greens to read as liquid.
const ACCOUNT_COLORS = ["#93c4a2", "#4f8a63", "#c9a96e", "#b39cd0", "#7fb8b0", "#d98a80"];
const accountColor = (i) => ACCOUNT_COLORS[(i + 1) % ACCOUNT_COLORS.length];

const parseDay = (iso) => {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const shortDate = (iso) =>
  parseDay(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const signed = (v, f = fmt) => (v >= 0 ? "+" : "−") + f(Math.abs(v));

const panel = {
  background: "#141311",
  border: "1px solid rgba(240,228,208,0.08)", borderRadius: 16, padding: 24,
};
const panelTitle = { fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: "#9b9386", marginBottom: 18, fontFamily: FONT };
const rowLine = { display: "flex", justifyContent: "space-between", gap: 12, padding: "8px 0", borderTop: "1px solid rgba(240,228,208,0.05)", fontSize: 13.5, fontFamily: FONT };

function SliceDetail({ slice, totals }) {
  if (!slice) {
    return (
      <div style={{ fontFamily: FONT }}>
        <div style={panelTitle}>At a glance</div>
        {[["Liquid", totals.liquid, NW_COLORS.liquid], ["Net worth", totals.netWorth, NW_COLORS.netWorth], ["Debt", totals.loans + totals.cards, NW_COLORS.debt]].map(([l, v, c]) => (
          <div key={l} style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "12px 0", borderTop: "1px solid rgba(240,228,208,0.06)" }}>
            <span style={{ fontSize: 13.5, color: "#9b9386" }}>{l}</span>
            <span style={{ fontSize: 22, fontWeight: 600, color: c }}>{fmt0(v)}</span>
          </div>
        ))}
        <div style={{ fontSize: 12.5, color: "#716a5f", marginTop: 14 }}>Hover over a slice (or tap it on your phone) to see what's in it.</div>
      </div>
    );
  }
  const a = slice.account;
  return (
    <div style={{ fontFamily: FONT }}>
      <div style={{ ...panelTitle, color: slice.color, marginBottom: 8 }}>{slice.label}</div>
      <div style={{ fontSize: 30, fontWeight: 600, color: "#f6f1e7" }}>{fmt(slice.value)}</div>
      <div style={{ fontSize: 13, color: "#8b8477", marginTop: 4, marginBottom: 16 }}>
        {slice.pct.toFixed(1)}% of assets · {slice.liquid ? "Liquid" : "Retirement"}
        {a && <span style={{ color: a.gain >= 0 ? NW_COLORS.liquid : NW_COLORS.debt }}> · {signed(a.gain)} gain</span>}
      </div>
      {a ? (
        <>
          {a.holdings.map((h) => (
            <div key={h.symbol} style={rowLine}>
              <span style={{ color: "#ddd4c5" }}>{h.symbol} <span style={{ color: "#716a5f" }}>· {h.shares.toLocaleString("en-US", { maximumFractionDigits: 3 })} sh × {fmt(h.price)}</span></span>
              <span style={{ color: "#ece5d8", whiteSpace: "nowrap" }}>{fmt(h.value)}</span>
            </div>
          ))}
          {a.cash > 0.005 && <div style={rowLine}><span style={{ color: "#9b9386" }}>Cash</span><span style={{ color: "#ece5d8" }}>{fmt(a.cash)}</span></div>}
          {a.pending && <div style={rowLine}><span style={{ color: NW_COLORS.milestone }}>Pending · {a.pending.note}</span><span style={{ color: "#ece5d8", whiteSpace: "nowrap" }}>{fmt(a.pending.amount)}</span></div>}
          {a.note && <div style={{ fontSize: 12, color: "#716a5f", marginTop: 10 }}>{a.note}</div>}
        </>
      ) : (
        <div style={{ fontSize: 13, color: "#9b9386", lineHeight: 1.55 }}>
          Checking, savings and cash accounts from YNAB. The Fidelity CMA is counted separately so it isn't doubled.
        </div>
      )}
    </div>
  );
}

function HoldingRow({ h, asOf }) {
  return (
    <div style={rowLine}>
      <div style={{ minWidth: 0 }}>
        <div style={{ color: "#ece5d8", fontWeight: 550 }}>{h.symbol}</div>
        <div style={{ fontSize: 11.5, color: "#8b8477", marginTop: 2 }}>
          {h.shares.toLocaleString("en-US", { maximumFractionDigits: 3 })} × {fmt(h.price)}
          <span style={{ marginLeft: 6, color: h.live ? NW_COLORS.liquid : "#716a5f" }}>
            {h.live ? "● live" : `price from ${shortDate(asOf)}`}
          </span>
        </div>
      </div>
      <div style={{ color: "#ece5d8", whiteSpace: "nowrap" }}>{fmt(h.value)}</div>
    </div>
  );
}

function AccountCard({ account, color, asOf }) {
  return (
    <div style={{ ...panel, padding: 20, borderLeft: `3px solid ${color}` }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, marginBottom: 6 }}>
        <div style={{ fontSize: 15, fontWeight: 600, color: "#f6f1e7", fontFamily: FONT }}>{account.name}</div>
        <span style={{
          fontSize: 11, padding: "3px 8px", borderRadius: 999, fontFamily: FONT, whiteSpace: "nowrap",
          color: account.kind === "liquid" ? NW_COLORS.liquid : "#ab9fcf",
          background: account.kind === "liquid" ? "rgba(147,196,162,0.1)" : "rgba(171,159,207,0.12)",
        }}>{account.kind === "liquid" ? "Liquid" : "Retirement"}</span>
      </div>
      <div style={{ fontSize: 22, fontWeight: 600, color: "#f6f1e7", fontFamily: FONT }}>{fmt(account.value)}</div>
      <div style={{ fontSize: 12.5, fontFamily: FONT, marginTop: 4, marginBottom: 10, color: account.gain >= 0 ? NW_COLORS.liquid : NW_COLORS.debt }}>
        {signed(account.gain)} total gain
      </div>
      {account.holdings.map((h) => <HoldingRow key={h.symbol} h={h} asOf={asOf} />)}
      {account.cash > 0.005 && (
        <div style={rowLine}><span style={{ color: "#9b9386" }}>Cash</span><span style={{ color: "#ece5d8" }}>{fmt(account.cash)}</span></div>
      )}
      {account.pending && (
        <div style={rowLine}>
          <span style={{ color: NW_COLORS.milestone }}>Pending · {account.pending.note}</span>
          <span style={{ color: "#ece5d8", whiteSpace: "nowrap" }}>{fmt(account.pending.amount)}</span>
        </div>
      )}
      {account.note && <div style={{ fontSize: 12, color: "#716a5f", fontFamily: FONT, marginTop: 8 }}>{account.note}</div>}
    </div>
  );
}

function CashCardsStrip({ ynab, totals }) {
  if (!ynab.ok) {
    return (
      <div style={{ ...panel, padding: "16px 20px", fontSize: 13.5, color: "#ddd4c5", fontFamily: FONT }}>
        YNAB not connected ({ynab.error}). Add your YNAB token as <code>YNABKEY</code> in the Worker's Settings → Variables and Secrets.
      </div>
    );
  }
  return (
    <div className="nw-grid" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 12 }}>
      {[["Cash · YNAB", totals.cash, NW_COLORS.liquid], ["Credit cards owed · YNAB", totals.cards, NW_COLORS.debt]].map(([l, v, c]) => (
        <div key={l} style={{ ...panel, padding: "16px 20px" }}>
          <div style={{ fontSize: 12.5, color: "#9b9386", fontFamily: FONT, marginBottom: 6 }}>{l}</div>
          <div style={{ fontSize: 22, fontWeight: 600, color: c, fontFamily: FONT }}>{fmt(v)}</div>
        </div>
      ))}
    </div>
  );
}

function LoansCard({ loans, asOf }) {
  const open = loans.filter((l) => l.balance > 0).sort((a, b) => b.rate - a.rate);
  const total = open.reduce((s, l) => s + l.balance, 0);
  const avgRate = total ? open.reduce((s, l) => s + l.balance * l.rate, 0) / total : 0;
  const monthlyInterest = open.reduce((s, l) => s + (l.balance * l.rate) / 100 / 12, 0);
  const maxBal = Math.max(1, ...open.map((l) => l.balance));
  return (
    <div style={panel}>
      <div style={{ ...panelTitle, marginBottom: 14 }}>Student loans · as of {shortDate(asOf)}</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 14, marginBottom: 18 }}>
        {[["Balance", fmt0(total), NW_COLORS.debt], ["Avg. rate", `${avgRate.toFixed(2)}%`, "#ece5d8"], ["Interest / month", `≈ ${fmt0(monthlyInterest)}`, "#ece5d8"]].map(([l, v, c]) => (
          <div key={l}>
            <div style={{ fontSize: 11.5, color: "#8b8477", fontFamily: FONT, marginBottom: 4 }}>{l}</div>
            <div style={{ fontSize: 18, color: c, fontFamily: FONT, fontWeight: 600 }}>{v}</div>
          </div>
        ))}
      </div>
      {open.map((l) => (
        <div key={l.name} style={{ padding: "8px 0", borderTop: "1px solid rgba(240,228,208,0.05)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 12, fontSize: 13.5, fontFamily: FONT }}>
            <span style={{ color: "#ddd4c5", minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{l.name}</span>
            <span style={{ whiteSpace: "nowrap" }}>
              <span style={{ color: l.rate >= 7 ? NW_COLORS.debt : "#9b9386", marginRight: 10 }}>{l.rate.toFixed(2)}%</span>
              <span style={{ color: "#ece5d8" }}>{fmt(l.balance)}</span>
            </span>
          </div>
          <div style={{ height: 3, borderRadius: 2, background: "rgba(240,228,208,0.05)", marginTop: 6 }}>
            <div style={{ height: 3, borderRadius: 2, width: `${(l.balance / maxBal) * 100}%`, background: l.rate >= 7 ? NW_COLORS.debt : "#5a554c" }} />
          </div>
        </div>
      ))}
      <div style={{ fontSize: 12, color: "#716a5f", fontFamily: FONT, marginTop: 10 }}>Sorted by interest rate. Red = 7% or higher.</div>
    </div>
  );
}

const NW_TABS = [["overview", "Overview"], ["accounts", "Accounts"], ["loans", "Loans"]];

function NetWorth() {
  const [tab, setTab, tabHref] = useSubRoute("worth", "overview", NW_TABS.map(([k]) => k));
  const [data, setData] = useState(null);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const getJson = (url) => fetch(url, { cache: "no-store" })
    .then((r) => r.json().then((j) => (r.ok ? j : Promise.reject(new Error(j.error || r.status)))));

  const load = useCallback(() => {
    setLoading(true);
    getJson("/api/networth")
      .then((j) => { setData(j); setError(""); })
      .catch((e) => setError(String(e.message || e)))
      .finally(() => setLoading(false));
  }, []);
  useEffect(load, [load]);

  const [slice, setSlice] = useState(null);

  const pieData = useMemo(() => {
    if (!data) return [];
    const parts = data.accounts.map((a, i) => ({
      label: a.chart_label || a.name, value: a.value, color: accountColor(i), account: a, liquid: a.kind === "liquid",
    }));
    if (data.ynab.ok && data.totals.cash > 0) parts.unshift({ label: "Cash (Amex accounts)", value: data.totals.cash, color: ACCOUNT_COLORS[0], liquid: true });
    const kept = parts.filter((p) => p.value > 0);
    const total = kept.reduce((s, p) => s + p.value, 0);
    return kept.map((p) => ({ ...p, pct: total ? (p.value / total) * 100 : 0 }));
  }, [data]);

  const msg = (text, retry) => (
    <div style={{ ...panel, color: "#ddd4c5", fontFamily: FONT, fontSize: 13.5 }}>
      {text}
      {retry && <button onClick={retry} style={{ marginLeft: 10, background: "#2a2723", color: "#f6f1e7", border: 0, borderRadius: 8, padding: "6px 12px", cursor: "pointer" }}>Try again</button>}
    </div>
  );

  let body;
  if (!data) {
    body = error ? msg(`Couldn't load balances (${error}).`, load) : msg("Loading balances…");
  } else if (tab === "overview") {
    body = (
      <div style={panel}>
        <div className="nw-overview">
          <div>
            <div style={panelTitle}>Where it sits</div>
            <PieChart data={pieData} size={260} centerLabel="Assets" active={slice} onActive={setSlice} />
          </div>
          <div className="nw-detail">
            <SliceDetail slice={slice != null ? pieData[slice] : null} totals={data.totals} />
          </div>
        </div>
      </div>
    );
  } else if (tab === "accounts") {
    body = (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <CashCardsStrip ynab={data.ynab} totals={data.totals} />
        <div style={{ ...panelTitle, marginBottom: 0 }}>Fidelity · holdings from {shortDate(data.asOf)}</div>
        <div className="nw-grid">
          {data.accounts.map((a, i) => <AccountCard key={a.name} account={a} color={accountColor(i)} asOf={data.asOf} />)}
        </div>
      </div>
    );
  } else {
    body = <LoansCard loans={data.loans} asOf={data.loansAsOf} />;
  }

  return (
    <div className="nw-page" style={{ padding: "28px 24px 56px" }}>
      <div style={{ maxWidth: 1280, margin: "0 auto" }}>
        <div className="page-head">
          <div>
            <h1 style={{ margin: 0, lineHeight: 1.05 }}>Net Worth</h1>
          </div>
          {data && (
            <div style={{ fontFamily: FONT, fontSize: 12.5, color: "#8b8477", display: "flex", alignItems: "center", gap: 10 }}>
              Updated {new Date(data.generatedAt).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}
              <button onClick={load} disabled={loading} style={{
                background: "rgba(240,228,208,0.06)", color: "#ddd4c5", border: "1px solid rgba(240,228,208,0.08)",
                borderRadius: 7, padding: "4px 10px", fontSize: 12.5, cursor: "pointer",
              }}>{loading ? "…" : "Refresh"}</button>
            </div>
          )}
        </div>
        <SubTabs options={NW_TABS} value={tab} onChange={setTab} href={tabHref} />
        {body}
      </div>
    </div>
  );
}

function App() {
  const route = useRouter();
  const { view } = route;
  useEffect(() => {
    const label = NAV.find(([key]) => key === view)[1];
    document.title = `${label} · Gill & Co.`;
  }, [view]);
  return (
    <RouteContext.Provider value={route}>
    <div style={{ minHeight: "100vh", color: "#f6f1e7" }}>
      <style>{`
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
        input[type=number] { -moz-appearance: textfield; }
        input::placeholder { color: #5a554c; }
      `}</style>
      <TabBar view={view} />
      <main className="app-main">
        {view === "dash" ? <Dashboard /> : view === "cards" ? <Cards /> : view === "prop" ? <Property /> : view === "worth" ? <NetWorth /> : <Calc />}
      </main>
    </div>
    </RouteContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
