<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Income Dashboard</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Income" />
<meta name="theme-color" content="#08080a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<style>
:root {
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
html, body {
  margin: 0; padding: 0;
  background: #08080a;
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.006em;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
h1 { letter-spacing: -0.025em; }
button { font-family: var(--font); transition: background 0.13s ease, border-color 0.13s ease, color 0.13s ease; }
input { font-family: var(--font); }
::-webkit-scrollbar { height: 8px; width: 8px; }
::-webkit-scrollbar-track { background: #101014; }
::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

.dash-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.dash-pie-grid {
  display: grid;
  grid-template-columns: minmax(280px, 380px) 1fr;
  gap: 24px;
  margin-bottom: 32px;
}
.dash-employers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}
.bene-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  flex-wrap: wrap;
}
@media (max-width: 640px) {
  .bene-row { gap: 6px; }
}
@media (max-width: 820px) {
  .dash-pie-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const FONT = "var(--font)";

const fmt = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
const fmt0 = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

const n = (v) => parseFloat(v) || 0;

const EMPLOYERS = ["CCMC", "NorthBay", "Sutter"];

const EMPLOYER_META = {
  CCMC:     { color: "#7a2230", logo: "logos/ccmc.png",     full: "Community Medical Centers" },
  NorthBay: { color: "#00873e", logo: "logos/northbay.jpg", full: "NorthBay Healthcare" },
  Sutter:   { color: "#1aa39b", logo: "logos/sutter.png",   full: "Sutter Health" },
};

const colorFor = (emp) => EMPLOYER_META[emp]?.color || "#5ec98a";

const formatPayDate = (iso) => {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  const dt = new Date(Number(y), Number(m) - 1, Number(d));
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
};

/* ─── shared bits ─── */

function Field({ label, value, onChange, suffix = "", placeholder = "—" }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ fontSize: 13.5, letterSpacing: "0", color: "#8b8b96" }}>{label}</span>
      <div style={{ display: "flex", alignItems: "center", borderBottom: "1px solid #52525b", paddingBottom: 8 }}>
        <input type="number" step="0.01" value={value} placeholder={placeholder} onChange={onChange}
          style={{ background: "transparent", border: "none", outline: "none", color: "#ffffff", fontFamily: FONT, fontSize: 18, width: "100%" }} />
        {suffix && <span style={{ color: "#8b8b96", fontSize: 13.5, marginLeft: 4 }}>{suffix}</span>}
      </div>
    </div>
  );
}

function Line({ label, value, highlight = false, muted = false, large = false, note = "" }) {
  return (
    <div style={{
      display: "flex", justifyContent: "space-between", alignItems: "baseline",
      padding: large ? "18px 0 0" : "9px 0",
      borderTop: large ? "1px solid #52525b" : "none",
    }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
        <span style={{ fontSize: 12.5, letterSpacing: "0", color: muted ? "#7d7d88" : "#d8d8de" }}>{label}</span>
        {note && <span style={{ fontSize: 13.5, color: "#7d7d88", fontFamily: FONT }}>{note}</span>}
      </div>
      <span style={{ fontFamily: FONT, fontSize: large ? 23 : 14, fontWeight: large ? 600 : 450, color: highlight ? "#5ec98a" : muted ? "#7d7d88" : "#ededf0" }}>{value}</span>
    </div>
  );
}

/* ─── tab bar ─── */

function TabBar({ view, setView }) {
  return (
    <div style={{ display: "flex", justifyContent: "center", padding: "22px 24px 0" }}>
      <div style={{
        display: "flex", gap: 2, padding: 3,
        background: "rgba(255,255,255,0.035)",
        border: "1px solid rgba(255,255,255,0.06)",
        borderRadius: 10,
      }}>
        {[["calc", "Pay Calc"], ["dash", "Dashboard"], ["cards", "Cards"]].map(([key, label]) => {
          const active = view === key;
          return (
            <button key={key} onClick={() => setView(key)} style={{
              background: active ? "rgba(255,255,255,0.09)" : "transparent",
              border: "none", borderRadius: 7, padding: "7px 16px", cursor: "pointer",
              fontSize: 13, fontWeight: active ? 550 : 450,
              color: active ? "#fafafa" : "#7d7d88", fontFamily: FONT,
            }}>{label}</button>
          );
        })}
      </div>
    </div>
  );
}

/* ─── Pay Calc (unchanged) ─── */

function useHistory(initial) {
  const [history, setHistory] = useState([initial]);
  const [cursor, setCursor] = useState(0);
  const state = history[cursor];
  const set = useCallback((updater) => {
    setHistory((prev) => {
      const next = typeof updater === "function" ? updater(prev[cursor]) : updater;
      return [...prev.slice(0, cursor + 1), next];
    });
    setCursor((c) => c + 1);
  }, [cursor]);
  const undo = useCallback(() => setCursor((c) => Math.max(0, c - 1)), []);
  const redo = useCallback(() => setCursor((c) => Math.min(history.length - 1, c + 1)), [history.length]);
  return { state, set, undo, redo, canUndo: cursor > 0, canRedo: cursor < history.length - 1 };
}

const CALC_INIT = { w1: "", w2: "", blended: false, deductions: 35 };
const SUTTER_BASE   = 76.40;
const SUTTER_OT     = 114.60;  // 1.5 × base
// Blended Night+Weekend rate, derived from paystubs: a standard 12-hr shift
// is 5 hrs evening (+$3.50/hr) + 7 hrs night (+$6.00/hr), plus a flat
// $1.80/hr weekend diff on all 12 hrs (weekend diff isn't OT-multiplied).
const SUTTER_BLENDED_BASE = 83.16;  // (5×79.90 + 7×82.40)/12 + 1.80
const SUTTER_BLENDED_OT   = 123.84; // (5×119.85 + 7×123.60)/12 + 1.80
const WEEKLY_OT_THRESHOLD = 40;
const weekPay = (hrs, blended) => {
  const h = parseFloat(hrs) || 0;
  const base = blended ? SUTTER_BLENDED_BASE : SUTTER_BASE;
  const ot   = blended ? SUTTER_BLENDED_OT   : SUTTER_OT;
  if (h <= 0) return { hrs: 0, st: 0, ot: 0, total: 0 };
  if (h <= WEEKLY_OT_THRESHOLD) return { hrs: h, st: h * base, ot: 0, total: h * base };
  const st = WEEKLY_OT_THRESHOLD * base;
  const otPay = (h - WEEKLY_OT_THRESHOLD) * ot;
  return { hrs: h, st, ot: otPay, total: st + otPay };
};

function Calc() {
  const { state, set, undo, redo, canUndo, canRedo } = useHistory(CALC_INIT);
  const { w1, w2, blended, deductions } = state;
  const update = (key) => (e) => set((s) => ({ ...s, [key]: e.target.value }));
  const toggleBlended = () => set((s) => ({ ...s, blended: !s.blended }));

  const w1Pay = weekPay(w1, blended);
  const w2Pay = weekPay(w2, blended);
  const stTotal = w1Pay.st + w2Pay.st;
  const otTotal = w1Pay.ot + w2Pay.ot;
  const totalGross = w1Pay.total + w2Pay.total;
  const dedPct    = n(deductions);
  const dedAmt    = totalGross * (dedPct / 100);
  const totalNet  = totalGross - dedAmt;
  const hasData   = totalGross > 0;
  const iconColor = (active) => active ? "#d8d8de" : "#63636e";

  return (
    <div style={{ display: "flex", justifyContent: "center", padding: "28px 24px 48px" }}>
      <div style={{ width: "100%", maxWidth: 420 }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 52 }}>
          <div>
            <p style={{ fontFamily: FONT, fontSize: 13.5, color: "#8b8b96", letterSpacing: "0", margin: "0 0 4px" }}>biweekly</p>
            <h1 style={{ fontFamily: FONT, fontSize: 27, fontWeight: 600, margin: 0, color: "#fafafa", lineHeight: 1.1 }}>Pay Calculator</h1>
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
            {[
              { fn: undo, can: canUndo, d: "M3 7v6h6 M3 13C5 7 10 3 16 3a9 9 0 0 1 0 18H3" },
              { fn: redo, can: canRedo, d: "M21 7v6h-6 M21 13C19 7 14 3 8 3a9 9 0 0 0 0 18h13" },
            ].map(({ fn, can, d }, i) => (
              <button key={i} onClick={fn} disabled={!can} style={{
                background: "transparent", border: `1px solid ${can ? "#63636e" : "rgba(255,255,255,0.08)"}`,
                borderRadius: 8, padding: "7px 10px", cursor: can ? "pointer" : "not-allowed",
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={iconColor(can)} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  {d.split(" M").map((seg, j) => <path key={j} d={(j === 0 ? "" : "M") + seg} />)}
                </svg>
              </button>
            ))}
          </div>
        </div>

        <div style={{ marginBottom: 40 }}>
          <div style={{ marginBottom: 24 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
              <p style={{ fontSize: 13.5, letterSpacing: "0", color: "#8b8b96", fontWeight: 500, margin: 0 }}>Sutter · Biweekly Paycheck</p>
              <button onClick={toggleBlended} style={{
                display: "flex", alignItems: "center", gap: 7,
                background: blended ? "rgba(129,140,248,0.12)" : "transparent",
                border: `1px solid ${blended ? "#818cf8" : "#63636e"}`,
                borderRadius: 20, padding: "5px 12px", cursor: "pointer",
              }}>
                <div style={{ width: 6, height: 6, borderRadius: "50%", background: blended ? "#818cf8" : "#7d7d88" }} />
                <span style={{ fontSize: 13.5, letterSpacing: "0", color: blended ? "#818cf8" : "#8b8b96", fontFamily: FONT }}>Night + Weekend</span>
              </button>
            </div>
            <div style={{ fontFamily: FONT, fontSize: 12.5, color: "#7d7d88", lineHeight: 1.9 }}>
              <div>
                <span style={{ color: "#ededf0" }}>Base</span>
                <span style={{ margin: "0 8px", color: "#4a4a54" }}>·</span>
                <span style={{ color: "#8b8b96" }}>{fmt(blended ? SUTTER_BLENDED_BASE : SUTTER_BASE)}/hr</span>
                <span style={{ margin: "0 8px", color: "#4a4a54" }}>·</span>
                <span style={{ color: "#8b8b96" }}>first 40 hrs/week</span>
              </div>
              <div>
                <span style={{ color: "#fb923c" }}>OT</span>
                <span style={{ margin: "0 8px", color: "#4a4a54" }}>·</span>
                <span style={{ color: "#8b8b96" }}>{fmt(blended ? SUTTER_BLENDED_OT : SUTTER_OT)}/hr</span>
                <span style={{ margin: "0 8px", color: "#4a4a54" }}>·</span>
                <span style={{ color: "#8b8b96" }}>hours over 40/week</span>
              </div>
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
            <Field label="Week 1 Hours" value={w1} onChange={update("w1")} />
            <Field label="Week 2 Hours" value={w2} onChange={update("w2")} />
          </div>
        </div>

        <div style={{ borderTop: "1px solid rgba(255,255,255,0.08)", marginBottom: 40 }} />

        <div style={{ marginBottom: 52 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 20 }}>
            <p style={{ fontSize: 13.5, letterSpacing: "0", color: "#8b8b96", fontWeight: 500, margin: 0 }}>Deductions</p>
            <span style={{ fontFamily: FONT, fontSize: 18, color: "#fff" }}>{deductions}%</span>
          </div>
          <style>{`
            input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
            input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; }
            input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; margin-top: -8px; cursor: pointer; }
            input[type=range]::-moz-range-track { height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; }
            input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: none; cursor: pointer; }
          `}</style>
          <input type="range" min="25" max="50" step="1" value={deductions}
            onChange={(e) => set((s) => ({ ...s, deductions: Number(e.target.value) }))} />
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8 }}>
            <span style={{ fontSize: 13.5, color: "#63636e", fontFamily: FONT }}>25%</span>
            <span style={{ fontSize: 13.5, color: "#63636e", fontFamily: FONT }}>50%</span>
          </div>
        </div>

        {hasData ? (
          <div>
            {w1Pay.total > 0 && (
              <Line
                label={`Week 1 · ${w1Pay.hrs}h${w1Pay.ot > 0 ? ` (${WEEKLY_OT_THRESHOLD} ST + ${(w1Pay.hrs - WEEKLY_OT_THRESHOLD).toFixed(2)} OT)` : ""}`}
                value={fmt(w1Pay.total)}
                muted
              />
            )}
            {w2Pay.total > 0 && (
              <Line
                label={`Week 2 · ${w2Pay.hrs}h${w2Pay.ot > 0 ? ` (${WEEKLY_OT_THRESHOLD} ST + ${(w2Pay.hrs - WEEKLY_OT_THRESHOLD).toFixed(2)} OT)` : ""}`}
                value={fmt(w2Pay.total)}
                muted
              />
            )}
            {otTotal > 0 && <Line label="Straight Time" value={fmt(stTotal)} muted />}
            {otTotal > 0 && <Line label="Overtime" value={fmt(otTotal)} muted />}
            <Line label="Total Gross" value={fmt(totalGross)} />
            {dedPct > 0 && <Line label="Deductions" value={`− ${fmt(dedAmt)}`} muted />}
            <Line label="Take Home" value={fmt(totalNet)} highlight large />
          </div>
        ) : (
          <p style={{ fontFamily: FONT, color: "#63636e", fontSize: 15, margin: 0 }}>
            Enter your hours above to see totals.
          </p>
        )}
      </div>
    </div>
  );
}

/* ─── Dashboard widgets ─── */

function Logo({ employer, size = 40 }) {
  const meta = EMPLOYER_META[employer];
  const [errored, setErrored] = useState(false);
  if (!meta || !meta.logo || errored) {
    return (
      <div style={{
        width: size, height: size, borderRadius: 10,
        background: colorFor(employer), color: "#fff",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontFamily: FONT, fontSize: size * 0.36, fontWeight: 600, flexShrink: 0,
      }}>{employer.slice(0, 1)}</div>
    );
  }
  return (
    <div style={{
      width: size, height: size, borderRadius: 10, overflow: "hidden",
      background: "#fff", flexShrink: 0,
      display: "flex", alignItems: "center", justifyContent: "center",
    }}>
      <img src={meta.logo} alt={meta.full}
        onError={() => setErrored(true)}
        style={{ width: "82%", height: "82%", objectFit: "contain" }} />
    </div>
  );
}

function StatCard({ label, value, sub, accent }) {
  return (
    <div style={{
      background: "linear-gradient(180deg, #101014 0%, #09090b 100%)",
      border: "1px solid rgba(255,255,255,0.08)", borderRadius: 16, padding: "22px 24px",
      position: "relative", overflow: "hidden",
    }}>
      <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 2, background: accent }} />
      <div style={{ fontSize: 13.5, letterSpacing: "0", color: "#8b8b96", fontWeight: 500, marginBottom: 12 }}>{label}</div>
      <div style={{ fontFamily: FONT, fontSize: 27, fontWeight: 600, color: accent, lineHeight: 1.05, letterSpacing: "-0.01em" }}>{value}</div>
      {sub && <div style={{ fontFamily: FONT, fontSize: 12.5, color: "#7d7d88", marginTop: 10 }}>{sub}</div>}
    </div>
  );
}

function PieChart({ data, size = 240 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) {
    return (
      <div style={{ textAlign: "center", color: "#63636e", fontFamily: FONT, padding: "40px 0" }}>
        No data
      </div>
    );
  }
  const cx = size / 2, cy = size / 2, r = size / 2 - 4, innerR = r * 0.58;
  let cum = -Math.PI / 2;
  const slices = data.map((d) => {
    const angle = (d.value / total) * Math.PI * 2;
    const a1 = cum, a2 = cum + angle;
    cum = a2;
    const large = angle > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const xi1 = cx + innerR * Math.cos(a1), yi1 = cy + innerR * Math.sin(a1);
    const xi2 = cx + innerR * Math.cos(a2), yi2 = cy + innerR * Math.sin(a2);
    const path = `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${innerR} ${innerR} 0 ${large} 0 ${xi1} ${yi1} Z`;
    return { path, color: d.color, label: d.label, value: d.value, pct: (d.value / total) * 100 };
  });

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
      <svg width={size} height={size}>
        {slices.map((s, i) => (
          <path key={i} d={s.path} fill={s.color} stroke="#08080a" strokeWidth="2" />
        ))}
        <text x={cx} y={cy - 4} textAnchor="middle" style={{ fill: "#8b8b96", fontSize: 11.5, letterSpacing: "0", fontFamily: FONT }}>YTD GROSS</text>
        <text x={cx} y={cy + 22} textAnchor="middle" style={{ fill: "#fff", fontSize: 19, fontFamily: FONT, fontWeight: 600 }}>{fmt0(total)}</text>
      </svg>
      <div style={{ marginTop: 24, display: "flex", flexDirection: "column", gap: 10, width: "100%" }}>
        {slices.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color }} />
              <span style={{ fontSize: 12.5, letterSpacing: "0", color: "#d8d8de", fontFamily: FONT }}>{s.label}</span>
            </div>
            <div style={{ display: "flex", gap: 12, alignItems: "baseline" }}>
              <span style={{ fontFamily: FONT, fontSize: 13.5, color: "#ededf0" }}>{fmt0(s.value)}</span>
              <span style={{ fontFamily: FONT, fontSize: 12.5, color: "#7d7d88", minWidth: 44, textAlign: "right" }}>{s.pct.toFixed(1)}%</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function EmployerCard({ employer, stats }) {
  const meta = EMPLOYER_META[employer] || {};
  const color = meta.color || "#5ec98a";
  return (
    <div style={{
      background: "linear-gradient(180deg, #101014 0%, #09090b 100%)",
      border: "1px solid rgba(255,255,255,0.08)",
      borderLeft: `3px solid ${color}`,
      borderRadius: 16, padding: 22,
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 20 }}>
        <Logo employer={employer} size={44} />
        <div style={{ minWidth: 0 }}>
          <div style={{ fontFamily: FONT, fontSize: 17, fontWeight: 600, color: "#fafafa", lineHeight: 1.2 }}>{employer}</div>
          <div style={{ fontFamily: FONT, fontSize: 13.5, letterSpacing: "0.1em", color: "#7d7d88", marginTop: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{meta.full || employer}</div>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, rowGap: 16 }}>
        <div>
          <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#7d7d88", marginBottom: 4 }}>Gross</div>
          <div style={{ fontFamily: FONT, fontSize: 18, color: "#ededf0" }}>{fmt(stats.gross)}</div>
        </div>
        <div>
          <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#7d7d88", marginBottom: 4 }}>Net</div>
          <div style={{ fontFamily: FONT, fontSize: 18, color: "#ededf0" }}>{fmt(stats.net)}</div>
        </div>
        <div>
          <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#7d7d88", marginBottom: 4 }}>403(b)</div>
          <div style={{ fontFamily: FONT, fontSize: 14, color: "#9b8fd4" }}>{fmt(stats.r403b)}</div>
        </div>
        <div>
          <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#7d7d88", marginBottom: 4 }}>Paystubs</div>
          <div style={{ fontFamily: FONT, fontSize: 14, color: "#ededf0" }}>{stats.count}</div>
        </div>
      </div>
    </div>
  );
}

function ProjectionCard({ ytdGross, projection, paystubs }) {
  if (!projection || !projection.monthly) return null;
  const actualsByMonth = {};
  for (const p of paystubs || []) {
    if (!p.pay_date) continue;
    const ym = p.pay_date.slice(0, 7);
    if (!actualsByMonth[ym]) actualsByMonth[ym] = {};
    actualsByMonth[ym][p.employer] = (actualsByMonth[ym][p.employer] || 0) + n(p.gross);
  }
  let remaining = 0;
  const byEmployer = {};
  for (const ym in projection.monthly) {
    for (const emp in projection.monthly[ym]) {
      const proj = n(projection.monthly[ym][emp]);
      const actual = (actualsByMonth[ym] && actualsByMonth[ym][emp]) || 0;
      const rem = Math.max(0, proj - actual);
      remaining += rem;
      if (rem > 0) byEmployer[emp] = (byEmployer[emp] || 0) + rem;
    }
  }
  const total = ytdGross + remaining;
  const empKeys = [
    ...EMPLOYERS.filter((e) => byEmployer[e]),
    ...Object.keys(byEmployer).filter((e) => !EMPLOYERS.includes(e)),
  ];
  return (
    <div style={{
      background: "linear-gradient(135deg, #101014 0%, #0a0a0c 100%)",
      border: "1px solid rgba(255,255,255,0.08)", borderRadius: 16, padding: 28,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 24, flexWrap: "wrap", gap: 16 }}>
        <div>
          <div style={{ fontSize: 13.5, letterSpacing: "0", color: "#8b8b96", marginBottom: 10 }}>2026 Year-End Projection</div>
          <div style={{ fontFamily: FONT, fontSize: 34, color: "#5ec98a", fontWeight: 600, lineHeight: 1, letterSpacing: "-0.01em" }}>{fmt(total)}</div>
          <div style={{ fontFamily: FONT, fontSize: 12.5, color: "#7d7d88", marginTop: 10 }}>
            {fmt(ytdGross)} earned + {fmt(remaining)} projected
          </div>
        </div>
        {projection.notes && (
          <div style={{ fontFamily: FONT, color: "#8b8b96", fontSize: 13.5, maxWidth: 360, textAlign: "right", lineHeight: 1.5 }}>
            {projection.notes}
          </div>
        )}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 16 }}>
        <div style={{ borderLeft: "2px solid #52525b", paddingLeft: 14 }}>
          <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#7d7d88", marginBottom: 6 }}>YTD Earned</div>
          <div style={{ fontFamily: FONT, fontSize: 18, color: "#ededf0" }}>{fmt(ytdGross)}</div>
        </div>
        {empKeys.map((emp) => (
          <div key={emp} style={{ borderLeft: `2px solid ${colorFor(emp)}`, paddingLeft: 14 }}>
            <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#7d7d88", marginBottom: 6 }}>Projected {emp}</div>
            <div style={{ fontFamily: FONT, fontSize: 18, color: "#ededf0" }}>{fmt(byEmployer[emp])}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function ChartTooltip({ ym, data, metric, showProjected = true, x, y, containerW }) {
  const [yearStr, monthStr] = ym.split("-");
  const monthName = MONTH_LABELS[Number(monthStr) - 1] + " " + yearStr;
  const stubs = data.stubs || [];
  const projByEmp = showProjected ? (data.projByEmp || {}) : {};
  const hasActual = stubs.length > 0;
  const hasProj = Object.keys(projByEmp).length > 0;

  let totalGross = 0, totalNet = 0;
  for (const p of stubs) {
    totalGross += n(p.gross);
    totalNet += n(p.net);
  }
  for (const emp in projByEmp) {
    totalGross += n(projByEmp[emp].gross);
    totalNet += n(projByEmp[emp].netProxy);
  }
  const totalShown = metric === "net" ? totalNet : totalGross;
  const totalColor = metric === "net" ? "#5ec98a" : "#ededf0";

  const tipW = 280;
  let left = x + 16;
  if (containerW && left + tipW > containerW - 12) left = Math.max(8, x - tipW - 16);
  const top = Math.max(8, y - 20);

  const label = hasProj && !hasActual ? "Projected" : hasProj && hasActual ? "Partial" : "";

  return (
    <div style={{
      position: "absolute", left, top, width: tipW,
      background: "rgba(9,9,11,0.97)", border: "1px solid #3f3f46",
      borderRadius: 10, padding: "12px 14px",
      pointerEvents: "none", zIndex: 10,
      boxShadow: "0 8px 24px rgba(0,0,0,0.5)",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10, gap: 8 }}>
        <div style={{ fontSize: 12.5, letterSpacing: "0", color: "#ededf0", fontFamily: FONT }}>{monthName}</div>
        {label && <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#f0b429", fontFamily: FONT }}>{label}</div>}
      </div>

      {hasActual && (
        <div style={{ marginBottom: hasProj ? 12 : 0 }}>
          {stubs.map((p, i) => (
            <div key={i} style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "6px 0", borderTop: i === 0 ? "none" : "1px solid rgba(255,255,255,0.05)",
              fontSize: 12.5, fontFamily: FONT, gap: 12,
            }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ color: colorFor(p.employer), fontSize: 13.5, letterSpacing: "0.1em" }}>{p.employer}</div>
                <div style={{ color: "#7d7d88", fontSize: 13.5, marginTop: 2 }}>{formatPayDate(p.pay_date)}</div>
              </div>
              <div style={{ color: "#ededf0", whiteSpace: "nowrap" }}>{fmt(metric === "net" ? n(p.net) : n(p.gross))}</div>
            </div>
          ))}
        </div>
      )}

      {hasProj && (
        <div>
          {hasActual && <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#f0b429", fontFamily: FONT, marginBottom: 6 }}>Still Projected</div>}
          {Object.keys(projByEmp).map((emp) => {
            const v = metric === "net" ? n(projByEmp[emp].netProxy) : n(projByEmp[emp].gross);
            return (
              <div key={emp} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 12.5, fontFamily: FONT }}>
                <span style={{ color: colorFor(emp), fontSize: 13.5, letterSpacing: "0.1em" }}>{emp}</span>
                <span style={{ color: "#ededf0", opacity: 0.75 }}>{fmt(v)}</span>
              </div>
            );
          })}
        </div>
      )}

      {!hasActual && !hasProj && (
        <div style={{ fontFamily: FONT, color: "#7d7d88", fontSize: 13.5 }}>No paychecks this month.</div>
      )}

      <div style={{ borderTop: "1px solid #3f3f46", marginTop: 10, paddingTop: 10, display: "flex", justifyContent: "space-between", fontFamily: FONT }}>
        <span style={{ color: "#8b8b96", letterSpacing: "0", fontSize: 13.5 }}>Total {metric}</span>
        <span style={{ color: totalColor, fontSize: 13.5, fontWeight: 500 }}>{fmt(totalShown)}</span>
      </div>
    </div>
  );
}

function MonthlyChart({ paystubs, projection, year }) {
  const [metric, setMetric] = useState("gross");
  const [showProjected, setShowProjected] = useState(true);
  const [hovered, setHovered] = useState(null);
  const containerRef = useRef(null);

  const ratios = useMemo(() => {
    const r = {};
    for (const p of paystubs) {
      if (!r[p.employer]) r[p.employer] = { g: 0, n: 0 };
      r[p.employer].g += n(p.gross);
      r[p.employer].n += n(p.net);
    }
    const out = {};
    for (const e in r) out[e] = r[e].g > 0 ? r[e].n / r[e].g : 1;
    return out;
  }, [paystubs]);

  const monthly = {};
  for (let m = 1; m <= 12; m++) {
    const ym = `${year}-${String(m).padStart(2, "0")}`;
    monthly[ym] = { stubs: [], actualByEmp: {}, projByEmp: {}, hasProjection: false };
  }
  for (const p of paystubs) {
    if (!p.pay_date) continue;
    const ym = p.pay_date.slice(0, 7);
    if (!monthly[ym]) continue;
    monthly[ym].stubs.push(p);
    if (!monthly[ym].actualByEmp[p.employer]) monthly[ym].actualByEmp[p.employer] = { gross: 0, net: 0 };
    monthly[ym].actualByEmp[p.employer].gross += n(p.gross);
    monthly[ym].actualByEmp[p.employer].net += n(p.net);
  }
  if (projection && projection.monthly) {
    for (const ym in projection.monthly) {
      if (!monthly[ym]) continue;
      const mp = projection.monthly[ym];
      for (const emp in mp) {
        const projected = n(mp[emp]);
        const actualGross = (monthly[ym].actualByEmp[emp] && monthly[ym].actualByEmp[emp].gross) || 0;
        const remaining = Math.max(0, projected - actualGross);
        if (remaining > 0.01) {
          const rat = ratios[emp] != null ? ratios[emp] : 1;
          monthly[ym].projByEmp[emp] = { gross: remaining, netProxy: remaining * rat };
          monthly[ym].hasProjection = true;
        }
      }
    }
  }

  const handleHover = (ym) => (e) => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    setHovered({ ym, x: e.clientX - rect.left, y: e.clientY - rect.top });
  };
  const handleLeave = () => setHovered(null);
  const monthsArr = Object.keys(monthly).sort();
  const grossTotals = monthsArr.map((k) => {
    const m = monthly[k];
    let total = 0;
    for (const emp in m.actualByEmp) total += m.actualByEmp[emp].gross;
    for (const emp in m.projByEmp) total += m.projByEmp[emp].gross;
    return total;
  });
  const max = Math.max(...grossTotals, 1);
  const yMax = Math.ceil(max / 5000) * 5000 || 5000;

  const W = 800, H = 280, ML = 56, MR = 12, MT = 12, MB = 30;
  const innerW = W - ML - MR;
  const innerH = H - MT - MB;
  const slot = innerW / 12;
  const barWidth = slot * 0.62;

  const gridSteps = 4;
  const gridLines = [];
  for (let i = 0; i <= gridSteps; i++) {
    const val = (yMax / gridSteps) * i;
    const y = MT + innerH - (val / yMax) * innerH;
    gridLines.push({ val, y });
  }

  const allEmployers = [
    ...EMPLOYERS,
    ...Array.from(new Set(monthsArr.flatMap((k) => [
      ...Object.keys(monthly[k].actualByEmp),
      ...Object.keys(monthly[k].projByEmp),
    ]))).filter((e) => !EMPLOYERS.includes(e)),
  ];

  return (
    <div ref={containerRef} style={{
      background: "linear-gradient(180deg, #101014 0%, #09090b 100%)",
      border: "1px solid rgba(255,255,255,0.08)", borderRadius: 16, padding: 24,
      position: "relative",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
          <div style={{ fontSize: 13.5, letterSpacing: "0", color: "#8b8b96" }}>
            Monthly {metric === "net" ? "Net" : "Gross"} · {year}
          </div>
          <div style={{ display: "flex", gap: 2, background: "#0a0a0c", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 8, padding: 2 }}>
            {[["gross", "Gross"], ["net", "Net"]].map(([key, label]) => {
              const active = metric === key;
              return (
                <button key={key} onClick={() => setMetric(key)} style={{
                  background: active ? (key === "net" ? "#5ec98a" : "#ededf0") : "transparent",
                  color: active ? "#08080a" : "#7d7d88",
                  border: "none", borderRadius: 6, padding: "5px 12px", cursor: "pointer",
                  fontSize: 13.5, letterSpacing: "0",
                  fontFamily: FONT, fontWeight: 500,
                }}>{label}</button>
              );
            })}
          </div>
          <button onClick={() => setShowProjected((v) => !v)} style={{
            display: "flex", alignItems: "center", gap: 7,
            background: showProjected ? "rgba(240,180,41,0.12)" : "transparent",
            border: `1px solid ${showProjected ? "#f0b429" : "#4a4a54"}`,
            borderRadius: 8, padding: "6px 12px", cursor: "pointer",
            fontSize: 13.5, letterSpacing: "0",
            color: showProjected ? "#f0b429" : "#7d7d88", fontFamily: FONT,
          }}>
            <span style={{
              width: 9, height: 9, borderRadius: 2,
              background: showProjected ? "rgba(251,191,36,0.35)" : "transparent",
              border: `1px dashed ${showProjected ? "#f0b429" : "#7d7d88"}`,
            }} />
            Projected
          </button>
        </div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
          {allEmployers.map((emp) => (
            <div key={emp} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 10, height: 10, borderRadius: 3, background: colorFor(emp) }} />
              <span style={{ fontSize: 13.5, letterSpacing: "0", color: "#d8d8de", fontFamily: FONT }}>{emp}</span>
            </div>
          ))}
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 10, height: 10, borderRadius: 3, background: "transparent", border: "1px dashed #71717a" }} />
            <span style={{ fontSize: 13.5, letterSpacing: "0", color: "#7d7d88", fontFamily: FONT }}>Projected</span>
          </div>
        </div>
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
        {gridLines.map((g, i) => (
          <g key={i}>
            <line x1={ML} x2={W - MR} y1={g.y} y2={g.y}
              stroke="rgba(255,255,255,0.08)" strokeWidth="1"
              strokeDasharray={i === 0 ? "" : "2,4"} />
            <text x={ML - 8} y={g.y + 3} textAnchor="end"
              style={{ fill: "#63636e", fontSize: 11.5, fontFamily: FONT }}>
              {g.val >= 1000 ? `$${(g.val / 1000).toFixed(0)}k` : `$${g.val.toFixed(0)}`}
            </text>
          </g>
        ))}
        {monthsArr.map((ym, i) => {
          const data = monthly[ym];
          const x = ML + slot * i + (slot - barWidth) / 2;
          let yCursor = MT + innerH;
          const empSet = new Set([...Object.keys(data.actualByEmp), ...Object.keys(data.projByEmp)]);
          const empOrder = [
            ...EMPLOYERS.filter((e) => empSet.has(e)),
            ...Array.from(empSet).filter((e) => !EMPLOYERS.includes(e)),
          ];
          const segments = [];
          for (const emp of empOrder) {
            const act = data.actualByEmp[emp];
            if (act) {
              const val = metric === "net" ? act.net : act.gross;
              if (val > 0) {
                const h = (val / yMax) * innerH;
                yCursor -= h;
                segments.push({ x, y: yCursor, w: barWidth, h, color: colorFor(emp), emp, isProjection: false });
              }
            }
            const proj = data.projByEmp[emp];
            if (proj && showProjected) {
              const val = metric === "net" ? proj.netProxy : proj.gross;
              if (val > 0) {
                const h = (val / yMax) * innerH;
                yCursor -= h;
                segments.push({ x, y: yCursor, w: barWidth, h, color: colorFor(emp), emp, isProjection: true });
              }
            }
          }
          const monthTotal = segments.reduce((s, seg) => s + (seg.h * yMax) / innerH, 0);
          const isHovered = hovered && hovered.ym === ym;
          const isAllProjection = data.stubs.length === 0 && data.hasProjection && showProjected;
          return (
            <g key={ym}>
              {segments.map((s, j) => (
                <rect key={j} x={s.x} y={s.y} width={s.w} height={s.h}
                  fill={s.isProjection ? `${s.color}55` : s.color}
                  stroke={s.isProjection ? s.color : "none"}
                  strokeDasharray={s.isProjection ? "3,3" : ""}
                  strokeWidth="1.5" rx="2"
                  opacity={hovered && !isHovered ? 0.45 : 1} />
              ))}
              {monthTotal > 0 && (
                <text x={x + barWidth / 2} y={MT + innerH - (monthTotal / yMax) * innerH - 6}
                  textAnchor="middle"
                  style={{ fill: isAllProjection ? "#7d7d88" : "#ededf0", fontSize: 12.5, fontFamily: FONT }}>
                  {monthTotal >= 1000 ? `$${(monthTotal / 1000).toFixed(1)}k` : ""}
                </text>
              )}
              <text x={x + barWidth / 2} y={H - MB + 18} textAnchor="middle"
                style={{ fill: isAllProjection ? "#63636e" : "#8b8b96", fontSize: 13.5, fontFamily: FONT }}>
                {MONTH_LABELS[i]}
              </text>
              <rect x={ML + slot * i} y={MT} width={slot} height={innerH}
                fill="transparent" style={{ cursor: "pointer" }}
                onMouseEnter={handleHover(ym)}
                onMouseMove={handleHover(ym)}
                onMouseLeave={handleLeave} />
            </g>
          );
        })}
      </svg>
      {hovered && monthly[hovered.ym] && (
        <ChartTooltip ym={hovered.ym} data={monthly[hovered.ym]}
          metric={metric} showProjected={showProjected}
          x={hovered.x} y={hovered.y}
          containerW={containerRef.current ? containerRef.current.clientWidth : 800} />
      )}
    </div>
  );
}

          {filter === "all" ? `${paystubs.length} total` : `${filtered.length} of ${paystubs.length}`}

function Dashboard() {
  const [year, setYear] = useState(new Date().getFullYear());
  const [paystubs, setPaystubs] = useState([]);
  const [projection, setProjection] = useState(null);
  const [lastUpdated, setLastUpdated] = useState("");
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    fetch("paystubs.json", { cache: "no-store" })
      .then((r) => r.ok ? r.json() : { year: new Date().getFullYear(), paystubs: [] })
      .then((data) => {
        if (data.year) setYear(data.year);
        if (data.last_updated) setLastUpdated(data.last_updated);
        if (data.projection) setProjection(data.projection);
        setPaystubs(Array.isArray(data.paystubs) ? data.paystubs : []);
        setLoaded(true);
      })
      .catch(() => setLoaded(true));
  }, []);

  const totals = useMemo(() => {
    const out = { gross: 0, net: 0, r403b: 0, byEmployer: {} };
    for (const p of paystubs) {
      const g = n(p.gross), net = n(p.net), r = n(p.retirement_403b);
      out.gross += g; out.net += net; out.r403b += r;
      if (!out.byEmployer[p.employer]) out.byEmployer[p.employer] = { gross: 0, net: 0, r403b: 0, count: 0 };
      out.byEmployer[p.employer].gross += g;
      out.byEmployer[p.employer].net   += net;
      out.byEmployer[p.employer].r403b += r;
      out.byEmployer[p.employer].count += 1;
    }
    return out;
  }, [paystubs]);

  const orderedEmployers = useMemo(() => [
    ...EMPLOYERS.filter((e) => totals.byEmployer[e]),
    ...Object.keys(totals.byEmployer).filter((e) => !EMPLOYERS.includes(e)),
  ], [totals]);

  const pieData = useMemo(() => orderedEmployers.map((e) => ({
    label: e, value: totals.byEmployer[e].gross, color: colorFor(e),
  })), [orderedEmployers, totals]);

  const taxesOther = Math.max(0, totals.gross - totals.net - totals.r403b);

  return (
    <div style={{ padding: "28px 24px 56px" }}>
      <div style={{ maxWidth: 1280, margin: "0 auto" }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 24, marginBottom: 32, flexWrap: "wrap" }}>
          <div>
            <p style={{ fontFamily: FONT, fontSize: 14, color: "#8b8b96", margin: "0 0 6px" }}>
              year to date · {year}
            </p>
            <h1 style={{ fontFamily: FONT, fontSize: 30, fontWeight: 600, margin: 0, color: "#fafafa", lineHeight: 1.1 }}>
              Income Dashboard
            </h1>
          </div>
          {lastUpdated && (
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 11.5, letterSpacing: "0", color: "#7d7d88", fontFamily: FONT, marginBottom: 4 }}>Last Updated</div>
              <div style={{ fontFamily: FONT, fontSize: 13.5, color: "#d8d8de" }}>{formatPayDate(lastUpdated)}</div>
            </div>
          )}
        </div>

        <div className="dash-stats">
          <StatCard label="Gross YTD" value={fmt(totals.gross)} sub={`${paystubs.length} paystubs`} accent="#ededf0" />
          <StatCard label="Taxes / Other" value={fmt(taxesOther)} sub={totals.gross ? `${((taxesOther / totals.gross) * 100).toFixed(1)}% of gross` : ""} accent="#f87171" />
          <StatCard label="Net YTD" value={fmt(totals.net)} sub={totals.gross ? `${((totals.net / totals.gross) * 100).toFixed(1)}% take-home` : ""} accent="#5ec98a" />
          <StatCard label="403(b) YTD" value={fmt(totals.r403b)} sub={totals.gross ? `${((totals.r403b / totals.gross) * 100).toFixed(1)}% of gross` : ""} accent="#9b8fd4" />
        </div>

        <div className="dash-pie-grid">
          <div style={{
            background: "linear-gradient(180deg, #101014 0%, #09090b 100%)",
            border: "1px solid rgba(255,255,255,0.08)", borderRadius: 16, padding: 28,
          }}>
            <div style={{ fontSize: 13.5, letterSpacing: "0", color: "#8b8b96", marginBottom: 24 }}>Income Split</div>
            <PieChart data={pieData} size={240} />
          </div>
          <div className="dash-employers">
            {orderedEmployers.map((emp) => (
              <EmployerCard key={emp} employer={emp} stats={totals.byEmployer[emp]} />
            ))}
          </div>
        </div>

        {projection && (
          <div style={{ marginBottom: 32 }}>
            <ProjectionCard ytdGross={totals.gross} projection={projection} paystubs={paystubs} />
          </div>
        )}

        <div style={{ marginBottom: 32 }}>
          <MonthlyChart paystubs={paystubs} projection={projection} year={year} />
        </div>

        <PaystubSection paystubs={paystubs} orderedEmployers={orderedEmployers} loaded={loaded} />


      </div>
    </div>
  );
}

/* ─── Cards ─── */

const CADENCE_META = {
  monthly:    { label: "Monthly",     order: 1 },
  quarterly:  { label: "Quarterly",   order: 2 },
  semiannual: { label: "Semi-Annual", order: 3 },
  annual:     { label: "Annual",      order: 4 },
  multiyear:  { label: "Multi-Year",  order: 5 },
};

// Every period in `year` for a cadence, tagged past / current / future.
const periodsFor = (cadence, year, today) => {
  const now = today || new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  const rel = (startM, endM) => {
    if (year < curY) return "past";
    if (year > curY) return "future";
    if (curM > endM) return "past";
    if (curM < startM) return "future";
    return "current";
  };
  // Last calendar day of month `m` — day 0 of the next month.
  const endOf = (m) => new Date(year, m + 1, 0);
  const out = [];
  if (cadence === "monthly") {
    for (let i = 0; i < 12; i++) {
      out.push({ key: `${year}-${String(i + 1).padStart(2, "0")}`, label: MONTH_LABELS[i], when: rel(i, i), end: endOf(i) });
    }
  } else if (cadence === "quarterly") {
    for (let i = 0; i < 4; i++) {
      out.push({ key: `${year}-Q${i + 1}`, label: `Q${i + 1}`, when: rel(i * 3, i * 3 + 2), end: endOf(i * 3 + 2) });
    }
  } else if (cadence === "semiannual") {
    out.push({ key: `${year}-H1`, label: "Jan–Jun", when: rel(0, 5),  end: endOf(5) });
    out.push({ key: `${year}-H2`, label: "Jul–Dec", when: rel(6, 11), end: endOf(11) });
  } else if (cadence === "annual") {
    out.push({ key: `${year}`, label: String(year), when: rel(0, 11), end: endOf(11) });
  } else {
    out.push({ key: "once", label: "One-time", when: "current", end: new Date(year + 50, 0, 1) });
  }
  return out;
};

const DAY_MS = 86400000;
const daysUntil = (d, today) => {
  const now = today || new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((b - a) / DAY_MS);
};

const benefitStatus = (benefit, year) => {
  const periods = periodsFor(benefit.cadence, year);
  const cs = new Set(benefit.claimed || []);
  const per = n(benefit.per);
  const hits = periods.filter((p) => cs.has(p.key));
  const open = periods.filter((p) => !cs.has(p.key) && p.when === "current");
  // Done for the year: every period claimed, or — for auto-recurring credits —
  // everything up to now claimed, since the rest posts on its own.
  const allClaimed = periods.every((p) => cs.has(p.key));
  const autoDone = !!benefit.auto && periods.filter((p) => p.when !== "future").every((p) => cs.has(p.key));
  // A benefit can override its deadline (e.g. credits that reset on the card
  // anniversary rather than the calendar year).
  const override = benefit.expires ? new Date(benefit.expires + "T00:00:00") : null;
  const expiresAt = open.length ? (override || open[0].end) : null;
  return {
    periods, claimedSet: cs, hits, open, per,
    complete: allClaimed || autoDone,
    captured: hits.length * per,
    total: periods.length * per,
    atStake: open.length * per,
    expiresAt,
    daysLeft: expiresAt ? daysUntil(expiresAt) : null,
  };
};

function PeriodChip({ period, hit, wide, pendingAuto, complete }) {
  // Only the actionable state is loud. Anything already handled stays quiet
  // so a full row of claimed months doesn't shout over what still needs doing.
  let bg = "transparent", border = "rgba(255,255,255,0.055)", color = "#4a4a54", weight = 450;
  if (hit && complete)                { bg = "rgba(34,197,94,0.13)";  border = "transparent"; color = "#5ec98a"; }
  else if (hit)                       { bg = "rgba(255,255,255,0.08)"; border = "transparent"; color = "#b0b0ba"; }
  else if (pendingAuto)               { bg = "transparent"; border = "rgba(34,197,94,0.28)"; color = "#3f8f61"; }
  else if (period.when === "current") { bg = "rgba(240,180,41,0.14)"; border = "#f0b429"; color = "#f0b429"; weight = 550; }
  return (
    <div style={{
      minWidth: wide ? 58 : 27, height: 19, padding: "0 4px",
      borderRadius: 4, background: bg, border: `1px solid ${border}`, color,
      fontFamily: FONT, fontSize: 12.5, fontWeight: weight,
      display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
    }}>{period.label}</div>
  );
}

function BenefitRow({ benefit, year, accent, first }) {
  const st = benefitStatus(benefit, year);
  const wide = benefit.cadence === "semiannual" || benefit.cadence === "annual" || benefit.cadence === "multiyear";
  const DONE = "#5ec98a";
  return (
    <div className="bene-row" title={benefit.detail} style={{
      borderTop: first ? "none" : "1px solid rgba(255,255,255,0.05)",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, flex: "1 1 165px", minWidth: 0 }}>
        <span style={{
          fontSize: 13.5, fontFamily: FONT,
          color: st.complete ? "#6e7d74" : "#d8d8de",
          textDecoration: st.complete ? "line-through" : "none",
          textDecorationColor: "rgba(110,125,116,0.5)",
          textDecorationThickness: "1px",
          whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
        }}>{benefit.name}</span>
        {benefit.auto && (
          <span style={{ fontSize: 10, letterSpacing: "0.1em", color: "#5ec98a", border: "1px solid rgba(94,201,138,0.3)", borderRadius: 3, padding: "0 4px", fontFamily: FONT, flexShrink: 0 }}>Auto</span>
        )}
      </div>
      <span style={{ fontFamily: FONT, fontSize: 13.5, color: "#63636e", flexShrink: 0, minWidth: 34, textAlign: "right" }}>
        {fmt0(st.per)}
      </span>
      <div style={{ display: "flex", gap: 3, flexWrap: "wrap", flexShrink: 0 }}>
        {st.periods.map((p) => (
          <PeriodChip key={p.key} period={p} hit={st.claimedSet.has(p.key)}
            wide={wide} complete={st.complete}
            pendingAuto={st.complete && !st.claimedSet.has(p.key)} />
        ))}
      </div>
      <span style={{ fontFamily: FONT, fontSize: 13.5, color: st.complete ? "#6e7d74" : "#a8a8b2", flexShrink: 0, minWidth: 78, textAlign: "right" }}>
        {fmt0(st.captured)}<span style={{ color: st.complete ? "rgba(34,197,94,0.4)" : "#4a4a54" }}> / {fmt0(st.total)}</span>
      </span>
    </div>
  );
}

function CardBlock({ card, year }) {
  const accent = card.color || "#5ec98a";
  const [showPerks, setShowPerks] = useState(false);
  let captured = 0, total = 0, openN = 0;
  for (const b of card.benefits || []) {
    const st = benefitStatus(b, year);
    captured += st.captured;
    total    += st.total;
    openN    += st.open.length;
  }
  const pct = total ? (captured / total) * 100 : 0;

  const groups = {};
  for (const b of card.benefits || []) {
    if (!groups[b.cadence]) groups[b.cadence] = [];
    groups[b.cadence].push(b);
  }
  const cadences = Object.keys(groups).sort(
    (a, b) => (CADENCE_META[a]?.order || 99) - (CADENCE_META[b]?.order || 99)
  );

  return (
    <div style={{
      background: "linear-gradient(180deg, #101014 0%, #09090b 100%)",
      border: "1px solid rgba(255,255,255,0.08)", borderLeft: `3px solid ${accent}`,
      borderRadius: 12, padding: "16px 18px", marginBottom: 12,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{
            width: 30, height: 20, borderRadius: 4, flexShrink: 0,
            background: `linear-gradient(135deg, ${accent} 0%, ${accent}88 100%)`,
          }} />
          <span style={{ fontFamily: FONT, fontSize: 15.5, fontWeight: 600, color: "#fafafa", lineHeight: 1.2 }}>{card.name}</span>
          <span style={{ fontFamily: FONT, fontSize: 13.5, color: "#63636e" }}>{fmt0(n(card.annual_fee))}/yr</span>
          {openN > 0 && (
            <span style={{ fontSize: 10.5, letterSpacing: "0.1em", color: "#f0b429", border: "1px solid rgba(240,180,41,0.35)", background: "rgba(240,180,41,0.12)", borderRadius: 3, padding: "1px 5px", fontFamily: FONT }}>{openN} open</span>
          )}
        </div>
        <div style={{ fontFamily: FONT, fontSize: 13.5, color: accent }}>
          {fmt0(captured)}<span style={{ fontSize: 13.5, color: "#4a4a54" }}> / {fmt0(total)}</span>
        </div>
      </div>

      <div style={{ height: 3, borderRadius: 3, background: "rgba(255,255,255,0.06)", marginBottom: 14, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: accent, opacity: 0.75, borderRadius: 3 }} />
      </div>

      {cadences.map((cad) => (
        <div key={cad} style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 10.5, letterSpacing: "0", color: "#63636e", marginBottom: 2 }}>
            {CADENCE_META[cad]?.label || cad}
          </div>
          {groups[cad].map((b, i) => (
            <BenefitRow key={b.id} benefit={b} year={year} accent={accent} first={i === 0} />
          ))}
        </div>
      ))}

      {card.perks && card.perks.length > 0 && (
        <div style={{ borderTop: "1px solid rgba(255,255,255,0.05)", paddingTop: 8, marginTop: 2 }}>
          <button onClick={() => setShowPerks((v) => !v)} style={{
            background: "transparent", border: "none", padding: 0, cursor: "pointer",
            fontFamily: FONT, fontSize: 12.5, letterSpacing: "0",
            color: "#63636e",
          }}>
            {showPerks ? "▾" : "▸"} Ongoing Perks ({card.perks.length})
          </button>
          {showPerks && (
            <ul style={{ margin: "8px 0 0", paddingLeft: 16, color: "#7d7d88", fontSize: 13.5, lineHeight: 1.7 }}>
              {card.perks.map((p, i) => <li key={i}>{p}</li>)}
            </ul>
          )}
        </div>
      )}
    </div>
  );
}

function AttentionPanel({ rows }) {
  const total = rows.reduce((s, r) => s + r.atStake, 0);
  return (
    <div style={{
      background: "linear-gradient(180deg, #101014 0%, #09090b 100%)",
      border: "1px solid rgba(255,255,255,0.08)",
      borderLeft: `3px solid ${rows.length ? "#f0b429" : "#5ec98a"}`,
      borderRadius: 12, padding: "14px 18px", marginBottom: 16,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 10, marginBottom: rows.length ? 8 : 0 }}>
        <div style={{ fontSize: 11.5, letterSpacing: "0", color: rows.length ? "#f0b429" : "#5ec98a" }}>
          {rows.length ? "Claim Now" : "All Caught Up"}
        </div>
        <div style={{ fontFamily: FONT, fontSize: 13.5, color: rows.length ? "#f0b429" : "#5ec98a" }}>
          {rows.length ? `${fmt0(total)} on the table` : "Nothing outstanding"}
        </div>
      </div>
      {rows.map((r, i) => {
        const d = r.daysLeft;
        // Multi-year credits carry a placeholder far-future end date — show
        // them as open-ended rather than printing a nonsense deadline.
        const openEnded = d == null || d > 3650;
        const urgent = openEnded ? "#63636e" : d <= 7 ? "#f87171" : d <= 30 ? "#f0b429" : "#7d7d88";
        const deadline = openEnded
          ? "No deadline"
          : `${r.expiresAt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })} · ${d}d`;
        return (
          <div key={`${r.card.id}-${r.benefit.id}`} style={{
            display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10,
            padding: "5px 0", borderTop: i === 0 ? "none" : "1px solid rgba(255,255,255,0.05)",
            fontFamily: FONT, fontSize: 12.5,
          }}>
            <div style={{ minWidth: 0, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              <span style={{ color: r.card.color }}>{r.card.name}</span>
              <span style={{ margin: "0 6px", color: "#4a4a54" }}>·</span>
              <span style={{ color: "#d8d8de" }}>{r.benefit.name}</span>
              <span style={{ marginLeft: 8, color: "#63636e", fontSize: 13.5 }}>{r.open.map((p) => p.label).join(", ")}</span>
            </div>
            <span style={{ color: urgent, fontSize: 13.5, flexShrink: 0, minWidth: 118, textAlign: "right" }}>
              {deadline}
            </span>
            <span style={{ color: "#ededf0", flexShrink: 0, minWidth: 46, textAlign: "right" }}>{fmt0(r.atStake)}</span>
          </div>
        );
      })}
    </div>
  );
}

function Cards() {
  const [cards, setCards] = useState([]);
  const [year, setYear] = useState(new Date().getFullYear());
  const [lastUpdated, setLastUpdated] = useState("");
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    fetch("cards.json", { cache: "no-store" })
      .then((r) => r.ok ? r.json() : { cards: [] })
      .then((data) => {
        setCards(Array.isArray(data.cards) ? data.cards : []);
        if (data.year) setYear(data.year);
        if (data.last_updated) setLastUpdated(data.last_updated);
        setLoaded(true);
      })
      .catch(() => setLoaded(true));
  }, []);

  const attention = useMemo(() => {
    const rows = [];
    for (const c of cards) {
      for (const b of c.benefits || []) {
        const st = benefitStatus(b, year);
        if (st.open.length) {
          rows.push({
            card: c, benefit: b, open: st.open, atStake: st.atStake,
            expiresAt: st.expiresAt, daysLeft: st.daysLeft,
          });
        }
      }
    }
    // Soonest deadline first; larger dollars break ties.
    return rows.sort((a, b) => (a.daysLeft - b.daysLeft) || (b.atStake - a.atStake));
  }, [cards, year]);

  return (
    <div style={{ padding: "20px 20px 40px" }}>
      <div style={{ maxWidth: 940, margin: "0 auto" }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 16, marginBottom: 18, flexWrap: "wrap" }}>
          <h1 style={{ fontFamily: FONT, fontSize: 27, fontWeight: 600, margin: 0, color: "#fafafa", lineHeight: 1.1 }}>
            Card Benefits
            <span style={{ fontFamily: FONT, fontSize: 12.5, color: "#63636e", marginLeft: 12, letterSpacing: "0.1em" }}>{year}</span>
          </h1>
          {lastUpdated && (
            <div style={{ fontFamily: FONT, fontSize: 13.5, color: "#63636e" }}>
              Updated {formatPayDate(lastUpdated)}
            </div>
          )}
        </div>

        {loaded && cards.length > 0 && <AttentionPanel rows={attention} />}

        {!loaded ? (
          <p style={{ color: "#63636e", fontFamily: FONT }}>Loading…</p>
        ) : cards.length === 0 ? (
          <p style={{ color: "#63636e", fontFamily: FONT }}>No cards yet.</p>
        ) : (
          cards.map((c) => <CardBlock key={c.id} card={c} year={year} />)
        )}

        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center", marginTop: 6 }}>
          {[
            ["Claimed", "#7d7d88", "#7d7d88"],
            ["Complete", "#5ec98a", "#5ec98a"],
            ["Open now", "rgba(240,180,41,0.12)", "#f0b429"],
            ["Not claimed", "transparent", "rgba(255,255,255,0.07)"],
          ].map(([label, bg, border]) => (
            <div key={label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 12, height: 12, borderRadius: 3, background: bg, border: `1px solid ${border}` }} />
              <span style={{ fontFamily: FONT, fontSize: 11.5, letterSpacing: "0.1em", color: "#63636e" }}>{label}</span>
            </div>
          ))}
          <span style={{ fontFamily: FONT, fontSize: 11.5, color: "#4a4a54", marginLeft: "auto" }}>Hover a row for details</span>
        </div>

      </div>
    </div>
  );
}

/* ─── App shell ─── */

function App() {
  const [view, setView] = useState(() => {
    if (typeof window === "undefined") return "calc";
    return window.localStorage.getItem("view") || "calc";
  });
  const changeView = (v) => {
    setView(v);
    try { window.localStorage.setItem("view", v); } catch (e) {}
  };
  return (
    <div style={{
      minHeight: "100vh",
      background: "#08080a",
      color: "#fff",
      paddingTop: "env(safe-area-inset-top)",
      paddingBottom: "env(safe-area-inset-bottom)",
    }}>
      <style>{`
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
        input[type=number] { -moz-appearance: textfield; }
        input::placeholder { color: #52525b; }
      `}</style>
      <TabBar view={view} setView={changeView} />
      {view === "dash" ? <Dashboard /> : view === "cards" ? <Cards /> : <Calc />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
