        <div className="page-head">
          <div>
            <p className="eyebrow"><Link to="/tools" style={{ color: "inherit", textDecoration: "none" }}>Tools</Link> · Places I've been</p>
            <h1 style={{ margin: 0, lineHeight: 1.05 }}>Travel</h1>
          </div>
        </div>

        <div className="dash-stats">
          <StatCard label="Countries" value={data ? countries : "—"} sub={`of ${WORLD_COUNTRIES}`} accent="#2f7a4e" />
          <StatCard label="Of the world" value={data ? `${Math.round((countries / WORLD_COUNTRIES) * 100)}%` : "—"} sub="of all countries" accent="#1f3a2e" />
          <StatCard label="Continents" value={data ? `${continents.length} / 7` : "—"} sub={continents.join(" · ")} accent="#9a7128" />
          <StatCard label="Cities" value={data ? cityCount : "—"} sub={data && data.bucket.length ? `${data.bucket.length} on the bucket list` : ""} accent="#1f3a2e" />
        </div>

        <div ref={globeRef} style={{ ...panel, marginBottom: 32, scrollMarginTop: 80 }}>
          <div className="travel-grid">
            {features && data ? (
              <Globe features={features} visited={visited} bucket={bucket} selected={selected} onSelect={setSelected} />
            ) : (
              <div className="globe-wrap">
                <div className="globe-msg">
                  {mapError ? (
                    <div>Couldn't load the map.<br />
                      <button onClick={loadMap} className="refresh-btn" style={{ marginTop: 10 }}>Try again</button></div>
                  ) : "Loading the globe…"}
                </div>
              </div>
            )}
            <PlaceDetail iso={selected} place={selPlace} status={status} name={selName} onClose={() => setSelected(null)} />
          </div>
        </div>

        {data && (
          <>
            <div style={{ ...panelTitle, marginBottom: 12 }}>Been there · {countries}</div>
            <div className="place-grid" style={{ marginBottom: 32 }}>
              {data.visited.map((p) => (
                <button key={p.iso} className={"place-card" + (selected === p.iso ? " on" : "")}
                  onClick={() => (selected === p.iso ? setSelected(null) : pick(p.iso))} aria-pressed={selected === p.iso}>
                  <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 15, fontWeight: 600, color: "#1f3a2e" }}>
                    <span aria-hidden="true">{p.flag}</span>{p.name}
                  </span>
                  <span style={{ display: "block", fontSize: 12.5, color: "#6e776f", marginTop: 4, lineHeight: 1.5 }}>
                    {(p.cities || []).map((ct) => ct.name).join(" · ") || p.note || "—"}
                    {(p.cities || []).length > 0 && p.note ? ` · ${p.note}` : ""}
                  </span>
                </button>
              ))}
            </div>
            {data.bucket.length > 0 && (
              <>
                <div style={{ ...panelTitle, marginBottom: 12 }}>Bucket list · {data.bucket.length}</div>
                <div className="place-grid">
                  {data.bucket.map((p) => (
                    <button key={p.iso} className={"place-card" + (selected === p.iso ? " on" : "")}
                      style={selected === p.iso ? { borderColor: "#c9973a", boxShadow: "inset 0 0 0 1px #c9973a" } : undefined}
                      onClick={() => (selected === p.iso ? setSelected(null) : pick(p.iso))} aria-pressed={selected === p.iso}>
                      <span style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 15, fontWeight: 600, color: "#1f3a2e" }}>
                        <span aria-hidden="true">{p.flag}</span>{p.name}
                      </span>
                      <span style={{ display: "block", fontSize: 12.5, color: "#6e776f", marginTop: 4, lineHeight: 1.5 }}>
                        {(p.plans || []).join(" · ") || "Someday"}
                      </span>
                    </button>
                  ))}
                </div>
              </>
            )}
          </>
        )}
      </div>
    </div>
  );
}

/* ─── PTO ───
   Sutter PTO as Kronos counts it. Each PTO night takes `shift_hours` off the
   day it's worked; each biweekly payday adds `accrual_per_check` (0.1 per paid
   hour, capped at 80 hrs, so 8.0 at most). The balance may dip to `floor`.

   The plan (pto.json until the first Save, then the copy saved in Supabase)
   holds Kronos balances you've read off, per-payday overrides, and trips.
   A Kronos balance resets the running total at that point; everything after
   it is projected forward from there. Within one date the order is: a
   balance read at the start of the day, the check, a balance read off that
   check, then that night's PTO. */

const PTO_ISO = /^\d{4}-\d{2}-\d{2}$/;
const PTO_ORDER = { start: 0, payday: 1, check: 2, pto: 3 };
const PTO_RED = "#b5483b";
const PTO_GREEN = "#2f7a4e";

const ptoAddDays = (iso, days) => {
  const d = parseDay(iso);
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const ptoToday = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const ptoR2 = (x) => Math.round(x * 100) / 100;
// Balances always show two decimals, like Kronos; changes drop trailing zeros (+7.2, −12).
const ptoHrs = (v) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
const ptoChange = (v) => (v >= 0 ? "+" : "−") + String(ptoR2(Math.abs(v)));
const ptoDay = (iso) => parseDay(iso).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const ptoDayY = (iso) => parseDay(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const ptoNum = (v, d) => (Number.isFinite(Number(v)) && v !== null && v !== "" ? Number(v) : d);

function ptoNormalize(d) {
  const p = d && typeof d === "object" ? d : {};
  const R = p.rules || {};
  return {
    rules: {
      shift_hours: ptoNum(R.shift_hours, 12),
      accrual_per_check: ptoNum(R.accrual_per_check, 7.2),
      floor: ptoNum(R.floor, -24),
      first_payday: PTO_ISO.test(R.first_payday || "") ? R.first_payday : "2026-10-28",
      payday_every_days: Math.max(1, ptoNum(R.payday_every_days, 14)),
      through_year: ptoNum(R.through_year, 2027),
    },
    balances: (Array.isArray(p.balances) ? p.balances : [])
      .filter((b) => b && PTO_ISO.test(b.date || "") && Number.isFinite(Number(b.hours)))
      .map((b) => ({ date: b.date, when: b.when === "check" ? "check" : "start", hours: Number(b.hours), note: String(b.note || "") })),
    checks: p.checks && typeof p.checks === "object" && !Array.isArray(p.checks) ? p.checks : {},
    trips: (Array.isArray(p.trips) ? p.trips : []).filter((t) => t && t.id).map((t) => ({
      ...t, name: String(t.name || "Trip"), on: t.on !== false,
      days: [...new Set((Array.isArray(t.days) ? t.days : []).filter((x) => PTO_ISO.test(x)))].sort(),
    })),
  };
}

function ptoHorizon(plan, today) {
  const last = plan.trips.flatMap((t) => t.days).concat(today).sort().pop();
  // Through the end of next year at least, so the table never runs out.
  return `${Math.max(Number(last.slice(0, 4)), plan.rules.through_year, Number(today.slice(0, 4)) + 1)}-12-31`;
}

function ptoPaydays(plan, until) {
  const out = [];
  for (let d = plan.rules.first_payday; d <= until; d = ptoAddDays(d, plan.rules.payday_every_days)) out.push(d);
  return out;
}

// Every event from the first Kronos balance to the end of the horizon, with
// the running balance. `force` switches trips on or off for a what-if.
function ptoLedger(plan, today, force) {
  const R = plan.rules;
  const end = ptoHorizon(plan, today);
  const paydays = ptoPaydays(plan, end);
  const ev = [];
  for (const a of plan.balances) ev.push({ date: a.date, kind: a.when, hours: a.hours, label: a.note || "Kronos balance", anchor: a });
  for (const d of paydays) {
    const c = plan.checks[d] || {};
    ev.push({ date: d, kind: "payday", change: c.accrual != null ? Number(c.accrual) : R.accrual_per_check, label: "Payday" });
  }
  for (const t of plan.trips) {
    const on = force && t.id in force ? force[t.id] : t.on;
    if (on) for (const d of t.days) ev.push({ date: d, kind: "pto", change: -R.shift_hours, label: t.name, trip: t.id });
  }
  ev.sort((a, b) => a.date.localeCompare(b.date) || PTO_ORDER[a.kind] - PTO_ORDER[b.kind]);
  const rows = [];
  let bal = null;
  for (const e of ev) {
    const isAnchor = e.kind === "start" || e.kind === "check";
    if (bal == null && !isAnchor) continue; // nothing to count from until the first Kronos balance
    if (isAnchor) {
      rows.push({ ...e, change: bal == null ? 0 : ptoR2(e.hours - bal), balance: e.hours });
      bal = e.hours;
    } else {
      bal = ptoR2(bal + e.change);
      rows.push({ ...e, balance: bal });
    }
  }
  return { rows, end, paydays };
}

function ptoBalanceOn(rows, date) {
  let b = null;
  for (const r of rows) { if (r.date > date) break; b = r.balance; }
  return b;
}

function ptoLowest(rows, from) {
  let low = null;
  for (const r of rows) if (r.date >= from && (low == null || r.balance < low.balance)) low = r;
  return low;
}

function usePto() {
  const [st, setSt] = useState({ loading: true, saved: null, saving: false, source: "", error: "" });
  const load = useCallback(async () => {
    try {
      const r = await fetch("/api/pto", { cache: "no-store" });
      const d = await r.json();
      if (!r.ok || !d.data) throw new Error(d.error || `HTTP ${r.status}`);
      setSt({ loading: false, saved: ptoNormalize(d.data), saving: !!d.saving, source: d.source, error: d.error || "" });
    } catch (e) {
      // Worker or database down: show the defaults so the page still works as a what-if.
      try {
        const r = await fetch("/pto.json", { cache: "no-store" });
        setSt({ loading: false, saved: ptoNormalize(await r.json()), saving: false, source: "default", error: String(e.message || e) });
      } catch (e2) {
        setSt({ loading: false, saved: null, saving: false, source: "", error: String(e2.message || e2) });
      }
    }
  }, []);
  useEffect(() => { load(); }, [load]);
  const save = useCallback(async (plan) => {
    const r = await fetch("/api/pto", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ data: plan }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    setSt((s) => ({ ...s, saved: plan, source: "saved" }));
  }, []);
  return { ...st, save, reload: load };
}

/* Balance over time as a step line: flat between events, a drop on each PTO
   night, a rise on each payday. The floor is dashed; trips that count are
   shaded. Hover (or drag on a phone) for the balance on any day. */
function PtoChart({ rows, end, floor, trips, today }) {
  const wrapRef = useRef(null);
  const [w, setW] = useState(720);
  const [hover, setHover] = useState(null);
  useEffect(() => {
    const el = wrapRef.current;
    if (!el || typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(([e]) => setW(Math.max(280, Math.round(e.contentRect.width))));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  if (!rows.length) return null;
  const narrow = w < 560;
  const H = narrow ? 230 : 290;
  const m = { l: 38, r: 10, t: 30, b: 26 };
  const DAY = 86400000;
  const t0 = parseDay(rows[0].date).getTime();
  const t1 = parseDay(end).getTime() + DAY;
  const x = (iso) => m.l + ((parseDay(iso).getTime() - t0) / (t1 - t0)) * (w - m.l - m.r);
  const bals = rows.map((r) => r.balance);
  const sc = niceScale(Math.min(floor, ...bals), Math.max(0, ...bals), narrow ? 4 : 5);
  const y = (v) => m.t + (1 - (v - sc.lo) / (sc.hi - sc.lo)) * (H - m.t - m.b);

  let d = `M${x(rows[0].date).toFixed(1)},${y(rows[0].balance).toFixed(1)}`;
  for (const r of rows.slice(1)) d += `H${x(r.date).toFixed(1)}V${y(r.balance).toFixed(1)}`;
  d += `H${x(end) + (w - m.r - x(end))}`;

  // Month ticks; every other (or every third) month on narrow screens.
  const months = [];
  const s = parseDay(rows[0].date);
  for (let dt = new Date(s.getFullYear(), s.getMonth() + 1, 1); dt.getTime() < t1; dt.setMonth(dt.getMonth() + 1)) {
    months.push(new Date(dt));
  }
  const every = w < 420 ? 3 : narrow ? 2 : 1;
  const iso = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-01`;

  const bands = trips.filter((t) => t.on && t.days.length).map((t) => {
    const a = t.start && t.start < t.days[0] ? t.start : t.days[0];
    const z = t.end && t.end > t.days[t.days.length - 1] ? t.end : t.days[t.days.length - 1];
    return { id: t.id, name: t.name, x0: x(a), x1: Math.max(x(ptoAddDays(z, 1)), x(a) + 3) };
  });
  let lastLabelEnd = -Infinity;
  const bandLabels = bands.map((b) => {
    const cx = (b.x0 + b.x1) / 2;
    const half = b.name.length * 3;
    const show = cx - half > lastLabelEnd + 6 && cx + half < w;
    if (show) lastLabelEnd = cx + half;
    return show;
  });

  const onMove = (e) => {
    const box = e.currentTarget.getBoundingClientRect();
    const px = e.clientX - box.left;
    if (px < m.l || px > w - m.r) return setHover(null);
    let t = t0 + ((px - m.l) / (w - m.l - m.r)) * (t1 - t0);
    let day = ptoAddDays(rows[0].date, Math.floor((t - t0) / DAY));
    // Snap to an event within a few pixels so paydays and PTO nights are easy to land on.
    let best = null;
    for (const r of rows) {
      const dx = Math.abs(x(r.date) - px);
      if (dx <= 8 && (!best || dx < best.dx)) best = { dx, date: r.date };
    }
    if (best) day = best.date;
    if (day > end) day = end;
    setHover({ day, bal: ptoBalanceOn(rows, day), events: rows.filter((r) => r.date === day) });
  };

  const hx = hover ? x(hover.day) : 0;
  const todayX = today >= rows[0].date && today <= end ? x(today) : null;
  return (
    <div ref={wrapRef} style={{ position: "relative", width: "100%" }}>
      <svg width={w} height={H} style={{ display: "block", touchAction: "pan-y" }} role="img"
        aria-label="PTO balance over time. The full ledger below lists every value."
        onPointerMove={onMove} onPointerDown={onMove} onPointerLeave={() => setHover(null)}>
        {bands.map((b, i) => (
          <g key={b.id}>
            <rect x={b.x0} y={m.t} width={b.x1 - b.x0} height={H - m.t - m.b} fill="rgba(154,113,40,0.13)" />
            {bandLabels[i] && (
              <text x={(b.x0 + b.x1) / 2} y={m.t - 8} textAnchor="middle" fontSize="10.5" fill="#66706a" fontFamily="Inter, sans-serif">{b.name}</text>
            )}
          </g>
        ))}
        {sc.ticks.map((v) => (
          <g key={v}>
            <line x1={m.l} x2={w - m.r} y1={y(v)} y2={y(v)} stroke={v === 0 ? "rgba(31,58,46,0.32)" : "rgba(31,58,46,0.07)"} />
            <text x={m.l - 6} y={y(v) + 3.5} textAnchor="end" fontSize="10.5" fill="#66706a" fontFamily="Inter, sans-serif">{v < 0 ? `−${Math.abs(v)}` : v}</text>
          </g>
        ))}
        <line x1={m.l} x2={w - m.r} y1={y(floor)} y2={y(floor)} stroke={PTO_RED} strokeWidth="1.25" strokeDasharray="5 4" />
        <text x={w - m.r} y={y(floor) - 5} textAnchor="end" fontSize="10.5" fill="#66706a" fontFamily="Inter, sans-serif">
          {`floor ${floor < 0 ? "−" : ""}${Math.abs(floor)}`}
        </text>
        {months.map((dt, i) => i % every === 0 && (
          <text key={i} x={x(iso(dt))} y={H - 8} textAnchor="middle" fontSize="10.5" fill="#66706a" fontFamily="Inter, sans-serif">
            {dt.getMonth() === 0 ? `Jan ’${String(dt.getFullYear()).slice(2)}` : dt.toLocaleDateString("en-US", { month: "short" })}
          </text>
        ))}
        {todayX != null && (
          <g>
            <line x1={todayX} x2={todayX} y1={m.t} y2={H - m.b} stroke="rgba(31,58,46,0.45)" strokeDasharray="2 3" />
            <text x={todayX + 4} y={m.t + 10} fontSize="10.5" fill="#66706a" fontFamily="Inter, sans-serif">Today</text>
          </g>
        )}
        <path d={d} fill="none" stroke={PTO_GREEN} strokeWidth="2" strokeLinejoin="round" />
        {hover && hover.bal != null && (
          <g pointerEvents="none">
            <line x1={hx} x2={hx} y1={m.t} y2={H - m.b} stroke="rgba(31,58,46,0.35)" />
            <circle cx={hx} cy={y(hover.bal)} r="4.5" fill={PTO_GREEN} stroke="#fffdf8" strokeWidth="2" />
          </g>
        )}
      </svg>
      {hover && hover.bal != null && (
        <div style={{
          position: "absolute", top: 6, pointerEvents: "none", zIndex: 2,
          left: Math.min(Math.max(hx - 90, 0), w - 180), width: 180,
          background: "#fffdf8", border: "1px solid rgba(31,58,46,0.15)", borderRadius: 10,
          boxShadow: "0 6px 18px rgba(31,58,46,0.12)", padding: "9px 11px", fontFamily: FONT, fontSize: 12.5,
        }}>
          <div style={{ color: "#66706a", marginBottom: 3 }}>{ptoDayY(hover.day)}</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: "#1f3a2e" }}>{ptoHrs(hover.bal)} hrs</div>
          {hover.events.map((e, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 8, color: "#4f5d55", marginTop: 3 }}>
              <span>{e.kind === "start" || e.kind === "check" ? "Kronos" : e.label}</span>
              <span>{e.kind === "start" || e.kind === "check" ? `= ${ptoHrs(e.balance)}` : ptoChange(e.change)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* Work nights: live from the BSN Google Calendar through /api/shifts, or the
   shifts.json copy when that isn't connected. */
function useShifts() {
  const [st, setSt] = useState({ loading: true, shifts: [], source: "", fetched: "", error: "" });
  useEffect(() => {
    let live = false;
    (async () => {
      try {
        const r = await fetch("/api/shifts", { cache: "no-store" });
        const d = await r.json();
        if (d.source === "google" && Array.isArray(d.shifts)) {
          live = true;
          return setSt({ loading: false, shifts: d.shifts, source: "google", fetched: d.fetched, error: "" });
        }
        throw new Error(d.error || "Not connected");
      } catch (e) {
        if (live) return;
        try {
          const r = await fetch("/shifts.json", { cache: "no-store" });
          const d = await r.json();
          const shifts = (Array.isArray(d.nights) ? d.nights : []).filter((x) => PTO_ISO.test(x))
            .map((date) => ({ date, time: "19:00", summary: "CVICU Shift" }));
          setSt({ loading: false, shifts, source: "copy", fetched: d.pulled || "", error: String(e.message || e) });
        } catch (e2) {
          setSt({ loading: false, shifts: [], source: "", fetched: "", error: String(e2.message || e2) });
        }
      }
    })();
  }, []);
  return st;
}

function PtoSyncNote({ sync }) {
  const live = sync.source === "google";
  return (
    <span style={{ fontFamily: FONT, fontSize: 12.5, color: "#6e776f", display: "inline-flex", alignItems: "center" }}
      title={live ? "Work nights read from your BSN Google Calendar each time this page opens" : sync.error}>
      <span style={{ width: 6, height: 6, borderRadius: 3, display: "inline-block", marginRight: 6, background: live ? PTO_GREEN : "#c9973a" }} />
      {sync.loading ? "Loading schedule…" : live ? "Schedule synced with Google Calendar"
        : `Schedule copied ${sync.fetched ? ptoDay(sync.fetched) : ""} · Google sync not connected`}
    </span>
  );
}

/* One row per payday: hours earned, PTO used since the last check, and the
   balance right after the check. */
function PtoCheckTable({ rows, today, floor }) {
  const checks = [];
  let used = 0, nights = 0, adj = 0, labels = new Set();
  for (const r of rows) {
    if (r.kind === "pto") { used += r.change; nights++; labels.add(r.label); }
    else if ((r.kind === "start" || r.kind === "check") && r.change) adj += r.change;
    if (r.kind === "payday") {
      checks.push({ date: r.date, earned: r.change, used, nights, adj: ptoR2(adj), labels: [...labels], balance: r.balance });
      used = 0; nights = 0; adj = 0; labels = new Set();
    }
  }
  const start = rows[0];
  const nextIdx = checks.findIndex((c) => c.date > today);
  let year = "";
  return (
    <div style={{ ...panel, padding: "6px 16px 10px" }}>
      <table className="pto-table">
        <thead><tr><th>Payday</th><th>Earned</th><th>PTO used</th><th>Balance</th></tr></thead>
        <tbody>
          {start && (
            <tr className="past">
              <td>{ptoDayY(start.date)}</td>
              <td colSpan={2} style={{ textAlign: "left" }}>Starting balance from Kronos</td>
              <td>{ptoHrs(start.balance)}</td>
            </tr>
          )}
          {checks.map((c, i) => {
            const yr = c.date.slice(0, 4);
            const head = yr !== year && i > 0 ? yr : null;
            year = yr;
            return (
              <React.Fragment key={c.date}>
                {head && <tr className="pto-year"><td colSpan={4}>{head}</td></tr>}
                <tr className={(c.date <= today ? "past" : "") + (i === nextIdx ? " next" : "")}>
                  <td>
                    {ptoDay(c.date)}
                    {i === nextIdx && <span className="pto-next">Next</span>}
                    {c.adj ? <span className="pto-sub">Kronos {ptoChange(c.adj)}</span> : null}
                  </td>
                  <td style={{ color: c.date > today ? PTO_GREEN : undefined }}>{ptoChange(c.earned)}</td>
                  <td>
                    {c.nights ? <>{ptoChange(c.used)}<span className="pto-sub">{c.nights} night{c.nights === 1 ? "" : "s"} · {c.labels.join(", ")}</span></> : "—"}
                  </td>
                  <td style={{ fontWeight: 600, color: c.balance < floor ? PTO_RED : c.balance < 0 ? "#9a4452" : "#1f3a2e" }}>{ptoHrs(c.balance)}</td>
                </tr>
              </React.Fragment>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* Month calendar of work nights. Tap days to highlight them: it counts the
   work nights in them × 12 hrs and shows where the balance would land. A
   preview only; the plan doesn't change. */
const PTO_DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const PTO_VIEW_KEY = "pto-calendar-view";

function PtoCalendar({ plan, base, shifts, today }) {
  const R = plan.rules;
  const firstDay = base.rows.length ? base.rows[0].date : today;
  const lastDay = base.end;
  // "8w" (eight weeks from the Sunday of the week shown) or "month". The
  // choice is remembered on this device.
  const [view, setViewRaw] = useState(() => {
    try { return window.localStorage.getItem(PTO_VIEW_KEY) === "month" ? "month" : "8w"; } catch (e) { return "8w"; }
  });
  const setView = (v) => { setViewRaw(v); try { window.localStorage.setItem(PTO_VIEW_KEY, v); } catch (e) {} };
  const home = today < firstDay ? firstDay : today > lastDay ? lastDay : today;
  const [focus, setFocus] = useState(home); // any date inside the period shown
  const [sel, setSel] = useState(() => new Set());

  let start, end, lead;
  if (view === "month") {
    start = `${focus.slice(0, 7)}-01`;
    const [yy, mm] = focus.split("-").map(Number);
    end = `${focus.slice(0, 7)}-${String(new Date(yy, mm, 0).getDate()).padStart(2, "0")}`;
    lead = parseDay(start).getDay();
  } else {
    start = ptoAddDays(focus, -parseDay(focus).getDay());
    end = ptoAddDays(start, 55);
    lead = 0;
  }
  const step = (k) => {
    if (view === "month") {
      const d = parseDay(start);
      d.setMonth(d.getMonth() + k);
      setFocus(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`);
    } else {
      setFocus(ptoAddDays(start, 56 * k));
    }
  };
  const days = [];
  for (let d = start; d <= end; d = ptoAddDays(d, 1)) days.push(d);
  const sameYear = start.slice(0, 4) === end.slice(0, 4);
  const periodName = view === "month"
    ? parseDay(start).toLocaleDateString("en-US", { month: "long", year: "numeric" })
    : `${parseDay(start).toLocaleDateString("en-US", { month: "short", day: "numeric", ...(sameYear ? {} : { year: "numeric" }) })} – ${ptoDayY(end)}`;

  const work = useMemo(() => {
    const map = {};
    for (const s of shifts) (map[s.date] = map[s.date] || []).push(s);
    return map;
  }, [shifts]);
  // Paydays and what each adds, from the plan (the same Wednesdays as PAYDAY💸 on the calendar).
  const pays = useMemo(() => {
    const map = {};
    for (const r of base.rows) if (r.kind === "payday") map[r.date] = r.change;
    return map;
  }, [base]);
  const booked = useMemo(() => {
    const map = {};
    for (const t of plan.trips) if (t.on) for (const d of t.days) map[d] = t.name;
    return map;
  }, [plan]);

  const picked = [...sel].sort();
  const extra = picked.filter((d) => work[d] && !booked[d]);
  const already = picked.filter((d) => booked[d]);
  const led = useMemo(() => (extra.length
    ? ptoLedger({ ...plan, trips: [...plan.trips, { id: "__preview", name: "Highlighted", on: true, days: extra }] }, today)
    : base), [plan, base, today, extra.join()]);
  const rows = led.rows;

  const after = extra.length ? ptoBalanceOn(rows, extra[extra.length - 1]) : null;
  const low = extra.length ? ptoLowest(rows, extra[0]) : null;
  const fits = !low || low.balance >= R.floor;
  const from = today > start ? today : start;
  const lowAhead = from <= led.end ? ptoLowest(rows, from) : null;
  const room = lowAhead ? Math.max(0, Math.floor((lowAhead.balance - R.floor) / R.shift_hours + 1e-9)) : null;
  const workInPeriod = Object.keys(work).filter((d) => d >= start && d <= end).length;

  const toggle = (d) => setSel((s) => { const n = new Set(s); n.has(d) ? n.delete(d) : n.add(d); return n; });

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(<div key={`b${i}`} className="pto-cal-cell blank" />);
  for (const day of days) {
    const d = Number(day.slice(8));
    // In the 8-week view the 1st of each month (and the first square) says which month it is.
    const dayLabel = view === "8w" && (d === 1 || day === start)
      ? parseDay(day).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : d;
    const bal = rows[0] && day >= rows[0].date && day <= led.end ? ptoBalanceOn(rows, day) : null;
    const isWork = !!work[day], isBooked = !!booked[day], isSel = sel.has(day);
    const can = day >= today;
    // 8 weeks: every other month gets a warm tint, and a gold line steps
    // along each month boundary (above the first week, left of the 1st).
    const mo = day.slice(0, 7);
    const alt = view === "8w" && (Number(mo.slice(0, 4)) * 12 + Number(mo.slice(5))) % 2 === 1;
    const lineTop = view === "8w" && ptoAddDays(day, -7) >= start && ptoAddDays(day, -7).slice(0, 7) !== mo;
    const lineLeft = view === "8w" && parseDay(day).getDay() !== 0 && d === 1 && day !== start;
    const cls = "pto-cal-cell" + (alt ? " alt" : "") + (view === "8w" && d === 1 ? " m1" : "") + (isWork ? " work" : "") + (pays[day] != null ? " pay" : "") + (isBooked ? " pto" : "") + (isSel ? " sel" : "")
      + (day < today ? " past" : "") + (day === today ? " today" : "");
    const pay = pays[day];
    const tag = isBooked ? "PTO" : isWork ? (/\bOT\b/i.test(work[day][0].summary) ? "OT" : /swap/i.test(work[day][0].summary) ? "Swap" : "CVICU") : "";
    const what = (isBooked ? `PTO (${booked[day]})` : isWork ? work[day].map((s) => `${s.summary} ${s.time}`).join(", ") : "Off")
      + (pay != null ? ` · Payday ${ptoChange(pay)} hrs` : "");
    const label = `${ptoDayY(day)}: ${what}${bal != null ? `, ${ptoHrs(bal)} hrs` : ""}${isSel ? ", highlighted" : ""}`;
    const body = (
      <>
        {lineTop && <i className="pto-cal-line top" aria-hidden="true" />}
        {lineLeft && <i className="pto-cal-line left" aria-hidden="true" />}
        <span className="pto-cal-d">{dayLabel}</span>
        <span className="pto-cal-tag">{tag}</span>
        <span className="pto-cal-pay">{pay != null ? ptoChange(pay) : ""}</span>
        {bal != null && <span className="pto-cal-b" style={{ color: isSel ? undefined : bal < R.floor ? PTO_RED : bal < 0 ? "#9a4452" : undefined }}>{ptoHrs(bal)}</span>}
      </>
    );
    cells.push(can
      ? <button key={day} type="button" className={cls} aria-label={label} aria-pressed={isSel} onClick={() => toggle(day)} title={what}>{body}</button>
      : <div key={day} className={cls} aria-label={label} title={what}>{body}</div>);
  }

  const navBtn = (k, lbl, dis) => (
    <button type="button" className="pto-cal-nav" onClick={() => step(k)} disabled={dis} aria-label={lbl}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <path d={k < 0 ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7"} />
      </svg>
    </button>
  );
  const fact = (k, v, color) => (
    <div style={{ ...rowLine, alignItems: "baseline" }}>
      <span style={{ color: "#4f5d55" }}>{k}</span>
      <strong style={{ fontWeight: 600, color: color || "#1f3a2e", textAlign: "right" }}>{v}</strong>
    </div>
  );

  return (
    <div className="pto-split">
      <div style={{ ...panel, padding: "14px 14px 16px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
          <div className="pto-seg" role="group" aria-label="Calendar view">
            {[["8w", "8 weeks"], ["month", "Month"]].map(([k, l]) => (
              <button key={k} type="button" aria-pressed={view === k} className={view === k ? "on" : ""} onClick={() => setView(k)}>{l}</button>
            ))}
          </div>
          {(today < start || today > end) && today >= firstDay && today <= lastDay && (
            <button type="button" className="refresh-btn" onClick={() => setFocus(today)}>Today</button>
          )}
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 10 }}>
          {navBtn(-1, view === "month" ? "Previous month" : "Previous 8 weeks", start <= firstDay)}
          <div style={{ fontFamily: "var(--serif)", fontSize: 22, fontWeight: 500, color: "#1f3a2e", textAlign: "center" }}>{periodName}</div>
          {navBtn(1, view === "month" ? "Next month" : "Next 8 weeks", end >= lastDay)}
        </div>
        <div className="pto-cal-grid">
          {PTO_DOW.map((d) => <div key={d} className="pto-cal-dow">{d}</div>)}
          {cells}
        </div>
        <div className="pto-cal-key">
          <span><i className="pto-sw work" /> CVICU shift</span>
          <span><i className="pto-sw pay" /> Payday (+hrs)</span>
          <span><i className="pto-sw pto" /> PTO booked</span>
          <span><i className="pto-sw sel" /> Highlighted</span>
          <span>Numbers = hrs at the end of the day</span>
        </div>
      </div>

      <div>
        <div style={{ ...panel, padding: "16px 18px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
            <div style={{ ...panelTitle, marginBottom: 8 }}>Highlighted</div>
            {picked.length > 0 && <button type="button" className="pto-link" onClick={() => setSel(new Set())}>Clear</button>}
          </div>
          {!picked.length ? (
            <p style={{ fontSize: 13, color: "#66706a", lineHeight: 1.55, margin: 0 }}>
              Tap days on the calendar. Each work night you highlight uses {R.shift_hours} hrs of PTO; days off use none. Nothing is saved.
            </p>
          ) : (
            <>
              <div style={{ fontSize: 30, fontWeight: 600, lineHeight: 1.1, color: "#1f3a2e" }}>
                {extra.length * R.shift_hours} hrs
              </div>
              <div style={{ fontSize: 12.5, color: "#66706a", margin: "4px 0 10px" }}>
                {extra.length} work night{extra.length === 1 ? "" : "s"} in {picked.length} day{picked.length === 1 ? "" : "s"}
                {already.length ? ` · ${already.length} already PTO` : ""}
              </div>
              {extra.length > 0 && (
                <>
                  {fact("Balance after", `${ptoHrs(after)} hrs`, after < 0 ? PTO_RED : undefined)}
                  {fact("Lowest from then on", `${ptoHrs(low.balance)} · ${ptoDay(low.date)}`, low.balance < R.floor ? PTO_RED : undefined)}
                  <div className="pto-verdict">
                    <span className={"pto-badge " + (fits ? "ok" : "bad")}>
                      {fits ? "Fits" : `Short ${ptoHrs(R.floor - low.balance)} hrs`}
                    </span>
                    <span style={{ color: "#4f5d55" }}>
                      {fits ? `stays above ${ptoChange(R.floor)}` : `goes below ${ptoChange(R.floor)}`}
                    </span>
                  </div>
                </>
              )}
              <div style={{ marginTop: 10 }}>
                {picked.map((d) => (
                  <div key={d} style={{ ...rowLine, fontSize: 12.5 }}>
                    <span style={{ color: "#4f5d55" }}>{ptoDay(d)}</span>
                    <span style={{ color: "#66706a" }}>
                      {booked[d] ? `already PTO · ${booked[d]}` : work[d] ? `work · −${R.shift_hours}` : "off · 0"}
                    </span>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
        <div style={{ ...panel, padding: "16px 18px", marginTop: 14 }}>
          <div style={{ ...panelTitle, marginBottom: 8 }}>{periodName}</div>
          {fact("Work nights", workInPeriod)}
          {room != null && fact(picked.length ? "Room left after highlight" : "Room from here on", `${room} night${room === 1 ? "" : "s"} · ${room * R.shift_hours} hrs`, room > 0 ? PTO_GREEN : PTO_RED)}
          {lowAhead && <p style={{ fontSize: 12, color: "#66706a", lineHeight: 1.5, margin: "8px 0 0" }}>
            Tightest point ahead: {ptoHrs(lowAhead.balance)} on {ptoDayY(lowAhead.date)}.
          </p>}
        </div>
      </div>
    </div>
  );
}

function Pto() {
  const pto = usePto();
  const sync = useShifts();
  const [tab, setTab, tabHref] = useSubRoute("pto", "overview", ["overview", "calendar"]);
  const [draft, setDraft] = useState(null);
  const [busy, setBusy] = useState(false);
  const [saveErr, setSaveErr] = useState("");
  const today = ptoToday();
  const [kDate, setKDate] = useState(today);
  const [kHours, setKHours] = useState("");

  useEffect(() => { if (pto.saved) setDraft(pto.saved); }, [pto.saved]);
  const plan = draft;
  const dirty = !!(draft && pto.saved && JSON.stringify(draft) !== JSON.stringify(pto.saved));
  useEffect(() => {
    if (!dirty) return;
    const warn = (e) => { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", warn);
    return () => window.removeEventListener("beforeunload", warn);
  }, [dirty]);

  const led = useMemo(() => (plan ? ptoLedger(plan, today) : null), [plan, today]);
  const update = (fn) => setDraft((p) => { const n = JSON.parse(JSON.stringify(p)); fn(n); return ptoNormalize(n); });
  const setAnchor = (date, when, hours, note) => update((n) => {
    const rest = n.balances.filter((b) => !(b.date === date && b.when === when));
    if (hours == null && !rest.length) return; // keep at least one starting balance
    n.balances = hours == null ? rest : [...rest, { date, when, hours, note }];
    n.balances.sort((a, b) => a.date.localeCompare(b.date) || PTO_ORDER[a.when] - PTO_ORDER[b.when]);
  });
  const doSave = async () => {
    setBusy(true); setSaveErr("");
    try { await pto.save(draft); } catch (e) { setSaveErr(String(e.message || e)); }
    setBusy(false);
  };

  if (!plan || !led) {
    return (
      <div className="nw-page" style={{ padding: "28px 24px 56px" }}>
        <div style={{ maxWidth: 1040, margin: "0 auto", color: "#66706a", fontSize: 14 }}>
          {pto.loading ? "Loading PTO…" : `Couldn't load PTO. ${pto.error}`}
        </div>
      </div>
    );
  }

  const R = plan.rules;
  const rows = led.rows;
  const now = ptoBalanceOn(rows, today);
  const nextPay = rows.find((r) => r.kind === "payday" && r.date > today);
  const low = ptoLowest(rows, today);
  const last = rows[rows.length - 1];
  const lastK = [...plan.balances].sort((a, b) => a.date.localeCompare(b.date) || PTO_ORDER[a.when] - PTO_ORDER[b.when]).pop();
  const kIsPayday = led.paydays.includes(kDate);

  return (
    <div className="nw-page" style={{ padding: "28px 24px 56px" }}>
      <div style={{ maxWidth: 1040, margin: "0 auto" }}>
        <div className="page-head">
          <div>
            <p className="eyebrow"><Link to="/tools" style={{ color: "inherit", textDecoration: "none" }}>Tools</Link> · Sutter Kronos</p>
            <h1 style={{ margin: 0, lineHeight: 1.05 }}>PTO</h1>
          </div>
          <PtoSyncNote sync={sync} />
        </div>

        <SubTabs options={[["overview", "Overview"], ["calendar", "Calendar"]]} value={tab} onChange={setTab} href={tabHref} />

        <div className="dash-stats">
          <StatCard label="Balance today" value={now == null ? "—" : `${ptoHrs(now)}`}
            sub={lastK ? `hrs · Kronos ${ptoHrs(lastK.hours)} on ${ptoDay(lastK.date)}` : "hrs"} accent={now < 0 ? PTO_RED : "#1f3a2e"} />
          <StatCard label="Next check" value={nextPay ? ptoChange(nextPay.change) : "—"}
            sub={nextPay ? `${ptoDay(nextPay.date)} → ${ptoHrs(nextPay.balance)} hrs` : ""} accent={PTO_GREEN} />
          <StatCard label="Lowest ahead" value={low ? ptoHrs(low.balance) : "—"}
            sub={low ? `${ptoDayY(low.date)} · ${low.balance >= R.floor ? `${ptoHrs(low.balance - R.floor)} above the ${ptoChange(R.floor)} floor` : "below the floor"}` : ""}
            accent={low && low.balance < R.floor ? PTO_RED : low && low.balance < 0 ? "#9a7128" : "#1f3a2e"} />
          <StatCard label={`End of ${led.end.slice(0, 4)}`} value={last ? ptoHrs(last.balance) : "—"} sub="hrs, with PTO booked so far" accent="#1f3a2e" />
        </div>

        {tab === "calendar" ? (
          <PtoCalendar plan={plan} base={led} shifts={sync.shifts} today={today} />
        ) : (<>
          <div style={{ ...panel, marginBottom: 28, padding: "18px 18px 10px" }}>
            <div style={{ ...panelTitle, marginBottom: 6 }}>Balance (hrs)</div>
            <PtoChart rows={rows} end={led.end} floor={R.floor} trips={plan.trips} today={today} />
          </div>

          <div className="pto-split">
            <section>
              <div style={{ ...panelTitle, marginBottom: 12 }}>Every check</div>
              <PtoCheckTable rows={rows} today={today} floor={R.floor} />
              <p style={{ fontSize: 12, color: "#66706a", lineHeight: 1.5, margin: "10px 2px 0" }}>
                +{R.accrual_per_check} per check (0.1 per paid hour, 8.0 max) · {R.shift_hours} hrs per PTO night · may go to {ptoChange(R.floor)}.
                PTO used counts the nights since the previous check; on a payday the check posts first.
              </p>
            </section>

            <section>
              <div style={{ ...panelTitle, marginBottom: 12 }}>Kronos balance</div>
              <div style={{ ...panel, padding: 16 }}>
                <p style={{ margin: "0 0 12px", fontSize: 12.5, color: "#66706a", lineHeight: 1.5 }}>
                  Enter what Kronos or your stub shows. It replaces the running total from that day on.
                </p>
                <form className="pto-row-form" style={{ margin: 0 }} onSubmit={(e) => {
                  e.preventDefault();
                  const v = Number(kHours);
                  if (kHours.trim() === "" || !Number.isFinite(v) || !PTO_ISO.test(kDate)) return;
                  setAnchor(kDate, kIsPayday ? "check" : "start", ptoR2(v), kIsPayday ? "Paystub" : "Kronos");
                  setKHours("");
                }}>
                  <input type="date" value={kDate} onChange={(e) => setKDate(e.target.value)} aria-label="Date read from Kronos" />
                  <input type="number" step="0.01" inputMode="decimal" value={kHours} onChange={(e) => setKHours(e.target.value)}
                    placeholder="Hours" aria-label="PTO hours in Kronos" style={{ width: 96 }} />
                  <button type="submit" className="refresh-btn edit-btn" disabled={kHours.trim() === ""}>Set</button>
                </form>
                <p style={{ fontSize: 12, color: "#66706a", margin: "8px 0 4px", lineHeight: 1.5 }}>
                  {kIsPayday ? "A payday: counts as the balance right after that check." : "Counts as the balance at the start of that day."}
                </p>
                {[...plan.balances].reverse().map((b) => (
                  <div key={b.date + b.when} style={{ ...rowLine, alignItems: "center" }}>
                    <span style={{ color: "#4f5d55" }}>
                      {ptoDayY(b.date)}{b.when === "check" ? " · after check" : ""}
                    </span>
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                      <strong style={{ fontWeight: 600 }}>{ptoHrs(b.hours)}</strong>
                      {plan.balances.length > 1 && (
                        <button type="button" className="pto-x" aria-label={`Remove the ${ptoDayY(b.date)} balance`}
                          onClick={() => setAnchor(b.date, b.when, null)}>×</button>
                      )}
                    </span>
                  </div>
                ))}
              </div>
            </section>
          </div>
        </>)}

        {(dirty || saveErr) && (
          <div className="edit-bar" role="region" aria-label="Unsaved changes">
            <div className="edit-bar-inner">
              <span style={{ fontFamily: FONT, fontSize: 13, color: saveErr ? PTO_RED : "#9a7128", marginRight: "auto" }}>
                {saveErr ? `Couldn't save: ${saveErr}` : pto.saving ? "Unsaved changes" : "What-if only — saving is off"}
              </span>
              <button type="button" onClick={() => { setDraft(pto.saved); setSaveErr(""); }} disabled={busy} className="bar-btn">
                {pto.saving ? "Cancel" : "Reset"}
              </button>
              {pto.saving && (
                <button type="button" onClick={doSave} disabled={busy || !dirty} className="bar-btn bar-btn-save">
                  {busy ? "Saving…" : "Save"}
                </button>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── Tools ───
   Odds and ends that don't need a tab of their own. Add an entry to TOOLS
   (and a page in PAGES) to list another one. */

const TOOLS = [
  { to: "/pay", name: "Pay Calc", blurb: "Estimate a Sutter biweekly paycheck from Week 1 / Week 2 hours, with overtime past 40 hours a week.",
    icon: <g><rect x="5" y="2.5" width="14" height="19" rx="2.5" /><path d="M8.5 7h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01" /></g> },
  { to: "/property", name: "Property", blurb: "Rental deal analyzer: cash needed, cash flow, cash-on-cash ROI and 3/5/10-year projections. Saved deals sync across devices.",
    icon: <path d="M3 11l9-7 9 7M5.5 9.5V20h13V9.5M10 20v-5h4v5" /> },
  { to: "/travel", name: "Travel", blurb: "A spinning globe with every country you've been to filled in, the cities you visited, and the bucket list.",
    icon: <g><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z" /></g> },
  { to: "/pto", name: "PTO", blurb: "Running Kronos PTO balance check by check, and a calendar of your work schedule: highlight days to see how much PTO they'd use.",
    icon: <g><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M3.5 10h17M8 3v4M16 3v4M8.5 15l2.3 2.3 4.7-4.6" /></g> },
];

function Tools() {
  return (
    <div className="nw-page" style={{ padding: "28px 24px 56px" }}>
      <div style={{ maxWidth: 1040, margin: "0 auto" }}>
        <div className="page-head">
          <div>
            <p className="eyebrow">Misc</p>
            <h1 style={{ margin: 0, lineHeight: 1.05 }}>Tools</h1>
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 12 }}>
          {TOOLS.map((t) => (
            <Link key={t.to} to={t.to} className="tool-card">
              <span style={{ color: "#9a7128" }}><NavIcon>{t.icon}</NavIcon></span>
              <span style={{ display: "block", fontSize: 15.5, fontWeight: 600, color: "#1f3a2e", margin: "10px 0 4px" }}>{t.name}</span>
              <span style={{ display: "block", fontSize: 12.5, color: "#6e776f", lineHeight: 1.5 }}>{t.blurb}</span>
            </Link>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const route = useRouter();
  const { view } = route;
  useEffect(() => {
    const label = PAGE_TITLES[view] || NAV.find(([key]) => key === view)[1];
    document.title = `${label} · Gill & Co.`;
  }, [view]);
  return (
    <RouteContext.Provider value={route}>
    <div style={{ minHeight: "100vh", color: "#1f3a2e" }}>
      <style>{`
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
        input[type=number] { -moz-appearance: textfield; }
        input::placeholder { color: #a1a59c; }
      `}</style>
      <TabBar view={view} />
      <main className="app-main">
        {view === "dash" ? <Dashboard /> : view === "cards" ? <Cards /> : view === "prop" ? <Property /> : view === "tools" ? <Tools /> : view === "trav" ? <Travel /> : view === "pto" ? <Pto /> : view === "worth" ? <NetWorth /> : <Calc />}
      </main>
    </div>
    </RouteContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
