function Cards() {
  const [cards, setCards] = useState([]);
  const [year, setYear] = useState(new Date().getFullYear());
  const [firstYear, setFirstYear] = useState(new Date().getFullYear());
  const [loaded, setLoaded] = useState(false);
  const claims = useCardClaims();

  /* Edit mode. Nothing on this page changes by accident: taps only count
     after Edit, they're staged here (dashed gold ring) and nothing is saved
     until Save. Cancel drops them. Each entry remembers the state it started
     from, so tapping a chip back again un-stages it. */
  const [editing, setEditing] = useState(false);
  const [pending, setPending] = useState(() => new Map());
  const [savingEdits, setSavingEdits] = useState(false);
  const canEdit = claims.status.saving;

  const stage = useCallback((cardId, benefitId, periods, claimed) => {
    setPending((m) => {
      const out = new Map(m);
      for (const period of periods) {
        const k = claimKey(cardId, benefitId, period);
        const base = out.has(k) ? out.get(k).base : !claimed;
        if (claimed === base) out.delete(k);
        else out.set(k, { card_id: cardId, benefit_id: benefitId, period, claimed, base });
      }
      return out;
    });
  }, []);

  // Saved claims with the staged changes laid on top.
  const claimsFor = useCallback((cardId, benefitId) => {
    const saved = claims.claimsFor(cardId, benefitId);
    let on = null, off = null;
    for (const p of pending.values()) {
      if (p.card_id !== cardId || p.benefit_id !== benefitId) continue;
      if (!on) { on = new Set(saved.on); off = new Set(saved.off); }
      if (p.claimed) { on.add(p.period); off.delete(p.period); }
      else { on.delete(p.period); off.add(p.period); }
    }
    return on ? { on, off } : saved;
  }, [claims.claimsFor, pending]);

  const changedFor = useCallback((cardId, benefitId) => {
    const set = new Set();
    for (const p of pending.values()) if (p.card_id === cardId && p.benefit_id === benefitId) set.add(p.period);
    return set;
  }, [pending]);

  const cancelEdits = () => { setPending(new Map()); setEditing(false); };

  const saveEdits = async () => {
    setSavingEdits(true);
    const groups = new Map();
    for (const p of pending.values()) {
      const g = `${p.card_id}|${p.benefit_id}|${p.claimed}`;
      if (!groups.has(g)) groups.set(g, { card_id: p.card_id, benefit_id: p.benefit_id, claimed: p.claimed, periods: [] });
      groups.get(g).periods.push(p.period);
    }
    const left = new Map(pending);
    for (const g of groups.values()) {
      if (await claims.setClaimed(g.card_id, g.benefit_id, g.periods, g.claimed)) {
        for (const period of g.periods) left.delete(claimKey(g.card_id, g.benefit_id, period));
      }
    }
    // Anything that failed stays staged so it can be retried.
    setPending(left);
    setSavingEdits(false);
    if (!left.size) setEditing(false);
  };

  // Closing or reloading the tab with unsaved changes asks first.
  useEffect(() => {
    if (!pending.size) return;
    const warn = (e) => { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", warn);
    return () => window.removeEventListener("beforeunload", warn);
  }, [pending.size]);

  const onToggle = editing && canEdit ? stage : null;
  const [sub, setSub, subHref] = useSubRoute("cards", "claim", loaded ? ["claim", ...cards.map((c) => c.id)] : null);

  useEffect(() => {
    fetch("/cards.json", { cache: "no-store" })
      .then((r) => r.ok ? r.json() : { cards: [] })
      .then((data) => {
        setCards(Array.isArray(data.cards) ? data.cards : []);
        // `data.year` is the first year tracked, not the year to show. The view
        // always opens on the current calendar year so Jan 1 rolls over on its
        // own; earlier years stay reachable through the picker.
        if (data.year) setFirstYear(data.year);
        setLoaded(true);
      })
      .catch(() => setLoaded(true));
  }, []);

  // Claim keys already carry their year ("2026-03", "2026-Q1", "2026"), so a
  // new year needs no migration — its periods simply start out unclaimed.
  const years = useMemo(() => {
    const seen = new Set([new Date().getFullYear(), firstYear, ...claims.years]);
    return [...seen].sort((a, b) => b - a);
  }, [firstYear, claims.years]);

  const attention = useMemo(() => {
    const rows = [];
    for (const c of cards) {
      for (const b of c.benefits || []) {
        const st = benefitStatus(b, year, claimsFor(c.id, b.id));
        if (st.open.length) {
          rows.push({
            card: c, benefit: b, open: st.open, atStake: st.atStake,
            expiresAt: st.expiresAt, daysLeft: st.daysLeft,
          });
        }
      }
    }
    // Soonest deadline first; larger dollars break ties.
    return rows.sort((a, b) => (a.daysLeft - b.daysLeft) || (b.atStake - a.atStake));
  }, [cards, year, claimsFor]);

  return (
    <div className="nw-page" style={{ padding: "28px 24px 56px" }}>
      <div style={{ maxWidth: 1040, margin: "0 auto" }}>

        <div className="page-head">
          <div>
          <p className="eyebrow">Credits &amp; perks</p>
          <h1 style={{ margin: 0, lineHeight: 1.05 }}>
            Cards
            {years.length > 1 ? (
              <span style={{ display: "inline-flex", gap: 4, marginLeft: 12, verticalAlign: "middle" }}>
                {years.map((y) => (
                  <button key={y} onClick={() => setYear(y)} style={{
                    fontFamily: FONT, fontSize: 12.5, letterSpacing: "0.1em", cursor: "pointer",
                    padding: "2px 7px", borderRadius: 5, background: y === year ? "rgba(31,58,46,0.1)" : "transparent",
                    border: "1px solid " + (y === year ? "rgba(31,58,46,0.175)" : "transparent"),
                    color: y === year ? "#34483e" : "#858b83",
                  }}>{y}</button>
                ))}
              </span>
            ) : (
              <span style={{ fontFamily: FONT, fontSize: 12.5, color: "#858b83", marginLeft: 12, letterSpacing: "0.1em" }}>{year}</span>
            )}
          </h1>
          </div>
          <CardsSyncStatus status={claims.status} onRefresh={claims.reload} refreshing={claims.refreshing}
            onEdit={canEdit && !editing ? () => setEditing(true) : null} />
        </div>

        {!claims.status.loading && !claims.status.saving && (
          <p style={{ color: "#6e776f", fontFamily: FONT, fontSize: 12.5, margin: "0 0 12px" }}>
            Showing what YNAB found; marking credits is off until the database is reachable. {claims.status.error && `(${claims.status.error})`}
          </p>
        )}
        {claims.msg && <p style={{ color: "#b5483b", fontFamily: FONT, fontSize: 12.5, margin: "0 0 12px" }}>{claims.msg}</p>}

        {loaded && cards.length > 0 && (
          <SubTabs value={sub} onChange={setSub} href={subHref}
            options={[["claim", attention.length ? `Claim now · ${attention.length}` : "Claim now"], ...cards.map((c) => [c.id, c.name])]} />
        )}

        {!loaded ? (
          <p style={{ color: "#858b83", fontFamily: FONT }}>Loading…</p>
        ) : cards.length === 0 ? (
          <p style={{ color: "#858b83", fontFamily: FONT }}>No cards yet.</p>
        ) : sub === "claim" ? (
          <AttentionPanel rows={attention} onMark={onToggle} />
        ) : (
          cards.filter((c) => c.id === sub).map((c) => (
            <CardBlock key={c.id} card={c} year={year} claimsFor={claimsFor} onToggle={onToggle} changedFor={changedFor} />
          ))
        )}

        {sub !== "claim" && (
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center", marginTop: 6 }}>
          {[
            ["Captured", "rgba(47,122,78,0.13)", "#2f7a4e"],
            ["Posts on its own", "transparent", "rgba(47,122,78,0.28)"],
            ["Open now", "rgba(154,113,40,0.12)", "#9a7128"],
            ["Not claimed", "transparent", "rgba(31,58,46,0.088)"],
          ].map(([label, bg, border]) => (
            <div key={label} style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 12, height: 12, borderRadius: 3, background: bg, border: `1px solid ${border}` }} />
              <span style={{ fontFamily: FONT, fontSize: 11.5, letterSpacing: "0.1em", color: "#858b83" }}>{label}</span>
            </div>
          ))}
          <span style={{ fontFamily: FONT, fontSize: 11.5, color: "#b9bbb2", marginLeft: "auto" }}>
            {editing ? "Tap a period to change it, then Save" : canEdit ? "Tap Edit to change what's marked" : "Hover a row for details"}
          </span>
        </div>
        )}

        {editing && (
          <>
            <div style={{ height: 76 }} />
            <div className="edit-bar" role="region" aria-label="Unsaved changes">
              <div className="edit-bar-inner">
                <span style={{ fontFamily: FONT, fontSize: 13, color: "#9a7128", marginRight: "auto" }}>
                  {pending.size ? `${pending.size} unsaved change${pending.size === 1 ? "" : "s"}` : "Editing — tap periods to change them"}
                </span>
                <button type="button" onClick={cancelEdits} disabled={savingEdits} className="bar-btn">Cancel</button>
                <button type="button" onClick={saveEdits} disabled={savingEdits || !pending.size} className="bar-btn bar-btn-save">
                  {savingEdits ? "Saving…" : "Save"}
                </button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* Percent state is stored exactly as typed (7.25 means 7.25%), never as a
   round-tripped fraction, so a rate like 6.875% keeps its precision. */
const pctVal = (v) => n(v) / 100;

const commas = (v) =>
  v === "" || v == null || isNaN(Number(v)) ? "" : Number(v).toLocaleString("en-US");

function PropRow({ label, note, children }) {
  return (
    <div style={{
      display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12,
      padding: "10px 0", borderBottom: "1px solid rgba(31,58,46,0.062)",
    }}>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontSize: 13.5, color: "#34483e" }}>{label}</div>
        {note && <div style={{ fontSize: 11.5, color: "#858b83", marginTop: 2 }}>{note}</div>}
      </div>
      {children}
    </div>

}

const propInputStyle = {
  background: "transparent", border: "none", outline: "none", color: "#1f3a2e",
  fontFamily: FONT, fontSize: 15, textAlign: "right", width: 96,
};

function PropInputShell({ children }) {
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 3, flexShrink: 0,
      borderBottom: "1px solid #a1a59c", paddingBottom: 4,
    }}>{children}</div>
  );
}

function MoneyInput({ label, note, value, onChange }) {
  const [text, setText] = useState(commas(value));
  const [focused, setFocused] = useState(false);
  useEffect(() => { if (!focused) setText(commas(value)); }, [value, focused]);
  return (
    <PropRow label={label} note={note}>
      <PropInputShell>
        <span style={{ color: "#6e776f", fontSize: 14 }}>$</span>
        <input
          type="text" inputMode="decimal" value={text} placeholder="—"
          onFocus={() => { setFocused(true); setText(value === "" || value == null ? "" : String(value)); }}
          onBlur={() => {
            setFocused(false);
            const raw = parseFloat(text.replace(/,/g, ""));
            if (text.trim() === "" || isNaN(raw)) { onChange(""); setText(""); }
            else { onChange(raw); setText(commas(raw)); }
          }}
          onChange={(e) => {
            const cleaned = e.target.value.replace(/[^0-9.,]/g, "");
            setText(cleaned);
            const num = parseFloat(cleaned.replace(/,/g, ""));
            if (cleaned.trim() === "") onChange(""); else if (!isNaN(num)) onChange(num);
          }}
          style={propInputStyle} />
      </PropInputShell>
    </PropRow>
  );
}

function RateInput({ label, note, value, onChange }) {
  return (
    <PropRow label={label} note={note}>
      <PropInputShell>
        <input
          type="text" inputMode="decimal" value={value} placeholder="—"
          onChange={(e) => {
            const cleaned = e.target.value.replace(/[^0-9.]/g, "");
            const parts = cleaned.split(".");
            onChange(parts.length > 2 ? parts[0] + "." + parts.slice(1).join("") : cleaned);
          }}
          style={{ ...propInputStyle, width: 66 }} />
        <span style={{ color: "#6e776f", fontSize: 14 }}>%</span>
      </PropInputShell>
    </PropRow>
  );
}

const LOAN_TERM_MONTHS = 360;

/* Pure deal math — everything downstream reads from this. */
function analyzeDeal(inp) {
  const sp = n(inp.salePrice), miscV = n(inp.misc), rehabV = n(inp.rehab), rentV = n(inp.rent);
  const ccPct = pctVal(inp.closingCostPct), ptRate = pctVal(inp.propTaxRate);
  const ir = pctVal(inp.interestRate), dp = pctVal(inp.downPct);
  const insV = n(inp.insurance), hoaV = n(inp.hoa), utilV = n(inp.utilities), lawV = n(inp.lawyer);
  const mgmt = pctVal(inp.mgmtPct), capex = pctVal(inp.capexPct), vac = pctVal(inp.vacancyPct);
  const repairs = pctVal(inp.repairsPct);

  const closingCost = sp * ccPct;
  const totalCost = sp + miscV + closingCost + rehabV;
  const annualPropTax = sp * ptRate;
  const monthlyPropTax = annualPropTax / 12;
  const mgmtFee = rentV * mgmt, capexAmt = rentV * capex, vacancyLoss = rentV * vac;
  const repairAmt = rentV * repairs;

  const downAmt = sp * dp;
  const loanAmt = Math.max(0, sp - downAmt);
  const r = ir / 12;
  /* A 0% loan still has to be repaid — amortize it straight-line rather than
     letting the mortgage silently cost nothing. */
  const pAndI = loanAmt <= 0 ? 0
    : ir > 0
      ? (loanAmt * r * Math.pow(1 + r, LOAN_TERM_MONTHS)) / (Math.pow(1 + r, LOAN_TERM_MONTHS) - 1)
      : loanAmt / LOAN_TERM_MONTHS;

  const rentBasedExp = mgmtFee + repairAmt + capexAmt + vacancyLoss;
  const fixedMonthlyExp = monthlyPropTax + insV + hoaV + utilV + lawV;
  const totalExpNoLoan = fixedMonthlyExp + rentBasedExp;
  const totalExpWithLoan = totalExpNoLoan + pAndI;
  const monthlyProfit = rentV - totalExpWithLoan;
  const annualProfit = monthlyProfit * 12;
  const cashNeeded = downAmt + closingCost + miscV + rehabV;
  const cashOnCash = cashNeeded > 0 ? annualProfit / cashNeeded : null;

  /* Remaining balance after m payments (closed form, clamped at payoff). */
  const balanceAfter = (m) => {
    if (loanAmt <= 0) return 0;
    const bal = r > 0
      ? loanAmt * Math.pow(1 + r, m) - (pAndI * (Math.pow(1 + r, m) - 1)) / r
      : loanAmt - pAndI * m;
    return Math.max(0, bal);
  };

  return {
    sp, miscV, rehabV, rentV, closingCost, totalCost, annualPropTax, monthlyPropTax,
    mgmtFee, repairAmt, capexAmt, vacancyLoss, insV, hoaV, utilV, lawV,
    mgmt, repairs, capex, vac, ptRate,
    ccPct, dp, ir, downAmt, loanAmt, pAndI, rentBasedExp, fixedMonthlyExp,
    totalExpNoLoan, totalExpWithLoan, monthlyProfit, annualProfit, cashNeeded,
    cashOnCash, balanceAfter,
    hasData: sp > 0 && rentV > 0,
  };
}

/* Year-by-year cash flow. Rent and the rent-linked expenses grow with rent;
   tax/insurance/HOA/utilities inflate; the mortgage payment is fixed. */
function cashFlowYears(d, rentGrowth, expInflation, years) {
  const rows = [];
  let cumulative = 0;
  for (let t = 0; t < years; t++) {
    const rent = d.rentV * Math.pow(1 + rentGrowth, t);
    const expenses = d.fixedMonthlyExp * Math.pow(1 + expInflation, t)
      + d.rentBasedExp * Math.pow(1 + rentGrowth, t)
      + d.pAndI;
    const profit = rent - expenses;
    cumulative += profit * 12;
    rows.push({
      year: t + 1, rent, expenses, profit,
      annual: profit * 12, cumulative,
      coc: d.cashNeeded > 0 ? (profit * 12) / d.cashNeeded : null,
    });
  }
  return rows;
}

/* Total return over `years`: rent profit + appreciation + principal paydown. */
function totalReturn(d, rentGrowth, expInflation, apprRate, years) {
  const rows = cashFlowYears(d, rentGrowth, expInflation, years);
  const cumCashFlow = rows.length ? rows[rows.length - 1].cumulative : 0;
  const apprGain = d.sp * Math.pow(1 + apprRate, years) - d.sp;
  const paydown = d.loanAmt - d.balanceAfter(years * 12);
  const totalGain = cumCashFlow + apprGain + paydown;
  const total = d.cashNeeded > 0 ? totalGain / d.cashNeeded : null;
  /* CAGR is only defined while the position is still worth something. */
  const multiple = total == null ? null : 1 + total;
  const annualized = multiple != null && multiple > 0 ? Math.pow(multiple, 1 / years) - 1 : null;
  return { rows, cumCashFlow, apprGain, paydown, totalGain, total, annualized };
}

const pctLabel = (v, dp = 2) => v == null ? "—" : `${(v * 100).toFixed(dp)}%`;
const gradeCoc = (v) => v == null ? "#6e776f" : v >= 0.08 ? "#2f7a4e" : v >= 0.04 ? "#9a7128" : "#b5483b";

/* ─── Property charts ───
   Palette: the documented categorical hues, validated for this dark surface
   with --pairs all (order-independent, so a zero-value slice can drop out
   without creating an unchecked adjacency). Worst CVD ΔE 6.9 sits in the
   6–8 floor band, which is legal only alongside secondary encoding — hence
   the legend, the value labels and the 2px surface gap between slices. */
const C_PI = "#456f9f", C_TAX = "#9a7128", C_OPS = "#a0566e", C_PROFIT = "#2f7a4e";
const C_CF = "#456f9f", C_APPR = "#9a7128", C_PD = "#4f8f70";
const SURFACE = "#fffdf8";

function monthlyBuckets(d) {
  const taxIns = d.monthlyPropTax + d.insV + d.hoaV + d.utilV + d.lawV;
  return [
    { label: "Mortgage", color: C_PI, value: d.pAndI,
      items: [["Principal + interest", d.pAndI]] },
    { label: "Taxes & insurance", color: C_TAX, value: taxIns,
      items: [["Property tax", d.monthlyPropTax], ["Insurance", d.insV],
              ["HOA", d.hoaV], ["Utilities", d.utilV], ["Lawyer", d.lawV]] },
    { label: "Management & reserves", color: C_OPS, value: d.rentBasedExp,
      items: [["Management", d.mgmtFee], ["Repairs & maintenance", d.repairAmt],
              ["Capital expenditures", d.capexAmt], ["Vacancy", d.vacancyLoss]] },
    { label: "Profit", color: C_PROFIT, value: Math.max(0, d.monthlyProfit), items: [] },
  ].filter((b) => b.value > 0.005);
}

function cashBuckets(d) {
  return [
    { label: "Down payment", color: C_PI, value: d.downAmt, items: [] },
    { label: "Closing costs", color: C_TAX, value: d.closingCost, items: [] },
    { label: "Rehab", color: C_OPS, value: d.rehabV, items: [] },
    { label: "Misc", color: C_PROFIT, value: d.miscV, items: [] },
  ].filter((b) => b.value > 0.005);
}

function Donut({ buckets, centerLabel, centerValue, note }) {
  const [hot, setHot] = useState(null);
  const total = buckets.reduce((s, b) => s + b.value, 0);
  const size = 200, cx = size / 2, cy = size / 2, r = size / 2 - 3, ir = r * 0.62;

  if (total <= 0) {
    return <div style={{ color: "#858b83", fontSize: 12.5, padding: "28px 0", textAlign: "center" }}>Nothing to show yet</div>;
  }

  let cum = -Math.PI / 2;
  const slices = buckets.map((b, i) => {
    const ang = (b.value / total) * Math.PI * 2;
    const a1 = cum, a2 = cum + ang; cum = a2;
    const big = ang > Math.PI ? 1 : 0;
    const P = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
    const [x1, y1] = P(r, a1), [x2, y2] = P(r, a2);
    const [xi2, yi2] = P(ir, a2), [xi1, yi1] = P(ir, a1);
    return { ...b, i, pct: (b.value / total) * 100,
      d: `M ${x1} ${y1} A ${r} ${r} 0 ${big} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${ir} ${ir} 0 ${big} 0 ${xi1} ${yi1} Z` };
  });

  const shown = hot != null ? slices[hot] : null;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "center" }}>
        <svg width={size} height={size} role="img" aria-label={centerLabel}>
          {slices.map((s) => (
            <path key={s.i} d={s.d} fill={s.color}
              /* 2px surface-coloured gap keeps adjacent fills separable */
              stroke={SURFACE} strokeWidth="2"
              opacity={hot == null || hot === s.i ? 1 : 0.35}
              onMouseEnter={() => setHot(s.i)} onMouseLeave={() => setHot(null)}
              style={{ cursor: "default", transition: "opacity .12s" }} />
          ))}
          <text x={cx} y={cy - 6} textAnchor="middle" style={{ fill: "#6e776f", fontSize: 10.5, fontFamily: FONT, letterSpacing: "0.06em" }}>
            {shown ? shown.label.toUpperCase() : centerLabel}
          </text>
          <text x={cx} y={cy + 17} textAnchor="middle" style={{ fill: "#1f3a2e", fontSize: 18, fontFamily: FONT, fontWeight: 600 }}>
            {shown ? fmt0(shown.value) : centerValue}
          </text>
          {shown && (
            <text x={cx} y={cy + 34} textAnchor="middle" style={{ fill: "#6e776f", fontSize: 11, fontFamily: FONT }}>
              {shown.pct.toFixed(1)}%
            </text>
          )}
        </svg>
      </div>
      <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 2 }}>
        {slices.map((s) => {
          const subs = s.items.filter(([, v]) => v > 0.005);
          return (
            <div key={s.i} onMouseEnter={() => setHot(s.i)} onMouseLeave={() => setHot(null)}
              style={{ padding: "5px 6px", borderRadius: 6, background: hot === s.i ? "rgba(31,58,46,0.062)" : "transparent" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 9, minWidth: 0 }}>
                  <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, flexShrink: 0 }} />
                  <span style={{ fontSize: 12.5, color: "#34483e" }}>{s.label}</span>
                </div>
                <div style={{ display: "flex", gap: 10, alignItems: "baseline", flexShrink: 0 }}>
                  <span style={{ fontFamily: FONT, fontSize: 13, color: "#22362c" }}>{fmt0(s.value)}</span>
                  <span style={{ fontFamily: FONT, fontSize: 12, color: "#6e776f", minWidth: 40, textAlign: "right" }}>{s.pct.toFixed(1)}%</span>
                </div>
              </div>
              {subs.length > 1 && hot === s.i && (
                <div style={{ paddingLeft: 19, marginTop: 4, display: "flex", flexDirection: "column", gap: 2 }}>
                  {subs.map(([lbl, val]) => (
                    <div key={lbl} style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: "#6e776f" }}>
                      <span>{lbl}</span><span style={{ fontFamily: FONT }}>{fmt(val)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
      {note && <div style={{ fontSize: 11.5, color: "#a1a59c", marginTop: 10, lineHeight: 1.5 }}>{note}</div>}
    </div>
  );
}

/* Per-year cumulative gain, split by where it came from, plus the annualized
   return you'd have realised selling at the end of that year. */
function returnSeries(d, rentGrowth, expInflation, apprRate, years) {
  return cashFlowYears(d, rentGrowth, expInflation, years).map((r, i) => {
    const t = i + 1;
    const cf = r.cumulative;
    const ap = d.sp * Math.pow(1 + apprRate, t) - d.sp;
    const pd = d.loanAmt - d.balanceAfter(t * 12);
    const gain = cf + ap + pd;
    const ret = d.cashNeeded > 0 ? gain / d.cashNeeded : null;
    const mult = ret == null ? null : 1 + ret;
    return { year: t, cf, ap, pd, gain, ret,
      cagr: mult != null && mult > 0 ? Math.pow(mult, 1 / t) - 1 : null };
  });
}

/* Rect with only its data-end corners rounded, so the stack still sits flat
   on the baseline. */
function capRect(x, y, w, h, r, up) {
  const rr = Math.min(r, h, w / 2);
  return up
    ? `M ${x} ${y + h} L ${x} ${y + rr} Q ${x} ${y} ${x + rr} ${y} L ${x + w - rr} ${y} Q ${x + w} ${y} ${x + w} ${y + rr} L ${x + w} ${y + h} Z`
    : `M ${x} ${y} L ${x} ${y + h - rr} Q ${x} ${y + h} ${x + rr} ${y + h} L ${x + w - rr} ${y + h} Q ${x + w} ${y + h} ${x + w} ${y + h - rr} L ${x + w} ${y} Z`;
}

/* Round axis bounds and ticks to human numbers (1/2/5 x 10^n) so the labels
   read $15k/$30k/$45k rather than whatever the data max happened to be. */
function niceScale(lo, hi, count) {
  if (hi === lo) hi = lo + 1;
  const raw = (hi - lo) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1)));
  const nrm = raw / mag;
  const step = (nrm <= 1 ? 1 : nrm <= 2 ? 2 : nrm <= 5 ? 5 : 10) * mag;
  const nlo = Math.floor(lo / step) * step;
  const nhi = Math.ceil(hi / step) * step;
  const ticks = [];
  for (let v = nlo; v <= nhi + step * 1e-6; v += step) ticks.push(Math.abs(v) < step * 1e-6 ? 0 : v);
  return { lo: nlo, hi: nhi, ticks };
}

function ReturnChart({ series }) {
  const [hot, setHot] = useState(null);
  const W = 580, PADL = 54, PADR = 14, TOP = 16;
  const HA = 150, GAP = 40, HB = 74;
  const yA0 = TOP, yA1 = TOP + HA;
  const yB0 = yA1 + GAP, yB1 = yB0 + HB;
  const H = yB1 + 30;
  const plotW = W - PADL - PADR;
  const n = series.length;
  const band = plotW / n;
  const bw = Math.min(46, band * 0.6);

  const SERIES = [
    { key: "cf", label: "Rent profit", color: C_CF },
    { key: "ap", label: "Appreciation", color: C_APPR },
    { key: "pd", label: "Principal paydown", color: C_PD },
  ];

  /* One shared dollar scale across the stack, with a real zero line so a
     losing year reads as below-zero rather than as a short bar. */
  let hi = 0, lo = 0;
  for (const r of series) {
    let up = 0, dn = 0;
    for (const s of SERIES) { const v = r[s.key]; if (v >= 0) up += v; else dn += v; }
    hi = Math.max(hi, up); lo = Math.min(lo, dn);
  }
  const dS = niceScale(lo, hi, 4);
  const yD = (v) => yA1 - ((v - dS.lo) / (dS.hi - dS.lo)) * HA;
  const zeroY = yD(0);

  const cagrs = series.map((r) => r.cagr).filter((v) => v != null);
  const cS = niceScale(cagrs.length ? Math.min(...cagrs, 0) : 0,
                       cagrs.length ? Math.max(...cagrs, 0) : 1, 3);
  const yC = (v) => yB1 - ((v - cS.lo) / (cS.hi - cS.lo)) * HB;
  const xC = (i) => PADL + band * i + band / 2;

  const pts = series.filter((r) => r.cagr != null).map((r, i) => [xC(series.indexOf(r)), yC(r.cagr)]);
  const linePath = pts.map(([x, y], i) => `${i ? "L" : "M"} ${x} ${y}`).join(" ");
  const money = (v) => {
    const sign = v < 0 ? "\u2212" : "";
    const a = Math.abs(v);
    return a >= 1000 ? `${sign}$${Math.round(a / 1000)}k` : `${sign}$${Math.round(a)}`;
  };
  const tick = { fill: "#858b83", fontSize: 10, fontFamily: FONT };
  const r = hot != null ? series[hot] : null;

  return (
    <div style={{ position: "relative" }}>
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 8 }}>
        {SERIES.map((s) => (
          <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 7 }}>
            <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color }} />
            <span style={{ fontSize: 11.5, color: "#66706a" }}>{s.label}</span>
          </div>
        ))}
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}
        onMouseLeave={() => setHot(null)}>
        <text x={PADL} y={yA0 - 4} style={{ ...tick, fill: "#6e776f" }}>Cumulative gain</text>
        {dS.ticks.map((v) => {
          return (
            <g key={v}>
              <line x1={PADL} x2={W - PADR} y1={yD(v)} y2={yD(v)} stroke="rgba(31,58,46,0.062)" strokeWidth="1" />
              <text x={PADL - 8} y={yD(v) + 3} textAnchor="end" style={tick}>{money(v)}</text>
            </g>
          );
        })}
        <line x1={PADL} x2={W - PADR} y1={zeroY} y2={zeroY} stroke="rgba(31,58,46,0.275)" strokeWidth="1" />

        {series.map((row, i) => {
          let up = 0, dn = 0;
          const segs = [];
          for (const s of SERIES) {
            const v = row[s.key];
            if (!v) continue;
            if (v >= 0) { segs.push({ ...s, v, from: up, sign: 1 }); up += v; }
            else { segs.push({ ...s, v, from: dn, sign: -1 }); dn += v; }
          }
          const topPos = Math.max(...segs.filter((s) => s.sign > 0).map((s) => s.from + s.v), -Infinity);
          const botNeg = Math.min(...segs.filter((s) => s.sign < 0).map((s) => s.from + s.v), Infinity);
          return (
            <g key={i} opacity={hot == null || hot === i ? 1 : 0.45} style={{ transition: "opacity .12s" }}>
              {segs.map((s) => {
                const y0 = yD(s.from), y1 = yD(s.from + s.v);
                const top = Math.min(y0, y1), h = Math.abs(y1 - y0);
                /* 2px surface gap so neighbouring fills stay separable */
                const hh = Math.max(0, h - 2);
                const isEnd = s.sign > 0 ? s.from + s.v === topPos : s.from + s.v === botNeg;
                const x = xC(i) - bw / 2;
                return isEnd
                  ? <path key={s.key} d={capRect(x, s.sign > 0 ? top : top + 2, bw, hh, 4, s.sign > 0)} fill={s.color} />
                  : <rect key={s.key} x={x} y={s.sign > 0 ? top : top + 2} width={bw} height={hh} fill={s.color} />;
              })}
            </g>
          );
        })}

        <text x={PADL} y={yB0 - 6} style={{ ...tick, fill: "#6e776f" }}>Annualized return if sold that year</text>
        {cS.ticks.map((v, i) => (
          <g key={i}>
            <line x1={PADL} x2={W - PADR} y1={yC(v)} y2={yC(v)} stroke="rgba(31,58,46,0.062)" strokeWidth="1" />
            <text x={PADL - 8} y={yC(v) + 3} textAnchor="end" style={tick}>{(v * 100).toFixed(0).replace("-", "\u2212")}%</text>
          </g>
        ))}
        {cS.lo < 0 && cS.hi > 0 && <line x1={PADL} x2={W - PADR} y1={yC(0)} y2={yC(0)} stroke="rgba(31,58,46,0.275)" strokeWidth="1" />}
        <path d={linePath} fill="none" stroke="#66706a" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {series.map((row, i) => row.cagr == null ? null : (
          <circle key={i} cx={xC(i)} cy={yC(row.cagr)} r={hot === i ? 5.5 : 4}
            fill={hot === i ? "#1f3a2e" : "#34483e"} stroke={SURFACE} strokeWidth="2" />
        ))}

        {hot != null && (
          <line x1={xC(hot)} x2={xC(hot)} y1={yA0} y2={yB1}
            stroke="rgba(31,58,46,0.312)" strokeWidth="1" strokeDasharray="3 3" pointerEvents="none" />
        )}
        {series.map((_, i) => (
          <rect key={i} x={PADL + band * i} y={yA0} width={band} height={yB1 - yA0}
            fill="transparent" onMouseEnter={() => setHot(i)} />
        ))}
        {series.map((row, i) => (
          <text key={i} x={xC(i)} y={H - 10} textAnchor="middle"
            style={{ ...tick, fill: hot === i ? "#34483e" : "#858b83" }}>{row.year}</text>
        ))}
        <text x={W / 2} y={H - 26} textAnchor="middle" style={{ ...tick, fill: "#b9bbb2" }}> </text>
      </svg>

      {r && (
        <div style={{
          position: "absolute", top: 0, right: 0, background: "#fffdf8",
          border: "1px solid rgba(31,58,46,0.15)", borderRadius: 9, padding: "9px 12px",
          pointerEvents: "none", minWidth: 178, boxShadow: "0 6px 22px rgba(31,58,46,0.14)",
        }}>
          <div style={{ fontSize: 11, color: "#6e776f", marginBottom: 6 }}>After year {r.year}</div>
          {SERIES.map((s) => (
            <div key={s.key} style={{ display: "flex", justifyContent: "space-between", gap: 14, fontSize: 12, padding: "1px 0" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 7, color: "#66706a" }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: s.color }} />{s.label}
              </span>
              <span style={{ fontFamily: FONT, color: r[s.key] >= 0 ? "#22362c" : "#b5483b" }}>{fmt0(r[s.key])}</span>
            </div>
          ))}
          <div style={{ display: "flex", justifyContent: "space-between", gap: 14, fontSize: 12.5,
            marginTop: 6, paddingTop: 6, borderTop: "1px solid rgba(31,58,46,0.125)" }}>
            <span style={{ color: "#34483e", fontWeight: 550 }}>Total gain</span>
            <span style={{ fontFamily: FONT, fontWeight: 600, color: r.gain >= 0 ? "#2f7a4e" : "#b5483b" }}>{fmt0(r.gain)}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 14, fontSize: 12, marginTop: 3 }}>
            <span style={{ color: "#66706a" }}>Annualized</span>
            <span style={{ fontFamily: FONT, color: "#22362c" }}>{r.cagr == null ? "—" : (r.cagr * 100).toFixed(1) + "%"}</span>
          </div>
        </div>
      )}
    </div>
  );
}

/* The slider's range is anchored to the last typed price, so dragging never
   moves the goalposts under you. */
function PriceSlider({ value, onChange }) {
  const base = useRef(n(value) || 150000);
  const fromSlider = useRef(false);
  useEffect(() => {
    if (fromSlider.current) { fromSlider.current = false; return; }
    if (n(value) > 0) base.current = n(value);
  }, [value]);

  const cur = n(value);
  const lo = Math.max(1000, Math.round(base.current * 0.7 / 1000) * 1000);
  const hi = Math.max(lo + 1000, Math.round(base.current * 1.3 / 1000) * 1000);
  const delta = cur - base.current;
  const pct = base.current ? (delta / base.current) * 100 : 0;

  return (
    <PropCard title="Listing price">
      <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap", marginTop: 6, marginBottom: 10 }}>
        <span style={{ fontFamily: FONT, fontSize: 26, fontWeight: 600, color: "#1f3a2e" }}>{fmt0(cur)}</span>
        {Math.abs(delta) >= 1 && (
          <span style={{ fontFamily: FONT, fontSize: 13, color: delta > 0 ? "#b5483b" : "#2f7a4e" }}>
            {delta > 0 ? "+" : "−"}{fmt0(Math.abs(delta))} ({pct > 0 ? "+" : "−"}{Math.abs(pct).toFixed(1)}%)
          </span>
        )}
        {Math.abs(delta) >= 1 && (
          <button onClick={() => { fromSlider.current = true; onChange(base.current); }}
            style={{ background: "transparent", border: "1px solid rgba(31,58,46,0.15)", borderRadius: 6,

  salePrice: "", misc: "", closingCostPct: "4", rehab: "",
  rent: "", propTaxRate: "", interestRate: "7.25", downPct: "25",
  insurance: "", hoa: "", utilities: "", lawyer: "",

const DRAFT_KEY = "property-draft";
/* Deals are saved through /api/deals in worker.js; the in-progress draft is
   cached per browser so switching tabs mid-deal doesn't discard it. */
function useDeals(v, setAll) {
  const [available, setAvailable] = useState(null);   // null until we know
  const [deals, setDeals] = useState([]);
  const [currentId, setCurrentId] = useState(null);
  const [name, setName] = useState("");
  const [status, setStatus] = useState("");

  const flash = (msg) => { setStatus(msg); setTimeout(() => setStatus((s) => s === msg ? "" : s), 2500); };

  const call = async (path, init) => {
    const res = await fetch(path, { cache: "no-store", ...init });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `error ${res.status}`);
    return body;
  };

  const refresh = useCallback(async () => {
    try {
      const d = await call("/api/deals");
      setDeals(d.deals || []); setAvailable(true);
    } catch (e) { setAvailable(false); }
  }, []);

  useEffect(() => { refresh(); }, [refresh]);

  const save = async (asNew) => {
    const label = (name || "").trim() || "Untitled deal";
    setStatus("Saving…");
    try {
      const d = await call("/api/deals", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: asNew ? undefined : currentId || undefined, name: label, data: v }),
      });
      setCurrentId(d.id); setName(label); flash("Saved");
      refresh();
    } catch (e) { flash("Couldn't save — " + e.message); }
  };

  const load = (id) => {
    const d = deals.find((x) => x.id === id);
    if (!d) return;
    setAll({ ...PROP_DEFAULTS, ...(d.data || {}) });
    setCurrentId(d.id); setName(d.name || ""); flash("Loaded");
  };

  const remove = async () => {
    if (!currentId) return;
    try {
      await call(`/api/deals?id=${encodeURIComponent(currentId)}`, { method: "DELETE" });
      setCurrentId(null); setName(""); flash("Deleted"); refresh();
    } catch (e) { flash("Couldn't delete — " + e.message); }
  };

  const startNew = () => { setAll({ ...PROP_DEFAULTS }); setCurrentId(null); setName(""); };

  return { available, deals, currentId, name, setName, status, save, load, remove, startNew, refresh };
}

      <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 12, flexWrap: "wrap" }}>
        <button onClick={() => d.save(false)} style={btn(true)}>{d.currentId ? "Save" : "Save deal"}</button>
        {d.currentId && <button onClick={() => d.save(true)} style={btn(false)}>Save as new</button>}
        {d.currentId && <button onClick={d.remove} style={btn(false)}>Delete</button>}
        <button onClick={d.startNew} style={btn(false)}>New</button>
        {d.status && <span style={{ fontSize: 12, color: "#6e776f", marginLeft: "auto" }}>{d.status}</span>}
      </div>
    </PropCard>
  );
}

function Property() {
  const [v, setV] = useState(() => {
    try {
      const saved = window.localStorage.getItem(DRAFT_KEY);
      if (saved) return { ...PROP_DEFAULTS, ...JSON.parse(saved) };
    } catch (e) {}
    return { ...PROP_DEFAULTS };
  });
  const set = useCallback((key) => (val) => setV((prev) => ({ ...prev, [key]: val })), []);
  const [sub, setSub, subHref] = useSubRoute("prop", "deal", ["deal", "projections"]);
  const [showSync, setShowSync] = useState(false);
  const deals = useDeals(v, setV);

  /* Keep the in-progress deal across tab switches and reloads. */
  useEffect(() => {
    try { window.localStorage.setItem(DRAFT_KEY, JSON.stringify(v)); } catch (e) {}
  }, [v]);

  return (
    <div className="prop-wrap">
      <div>
        <div className="page-head">
          <div>
            <p className="eyebrow"><Link to="/tools" style={{ color: "inherit", textDecoration: "none" }}>Tools</Link> · Rental deal analyzer</p>
            <h1 style={{ margin: 0, lineHeight: 1.05 }}>Property</h1>
          </div>
          {deals.available && (
            <button onClick={() => setShowSync((x) => !x)} style={{
              background: showSync ? "rgba(154,113,40,0.14)" : "transparent", color: "#9a7128",
              border: "1px solid rgba(154,113,40,0.4)", borderRadius: 999, padding: "0 16px", minHeight: 36,
              fontFamily: FONT, fontSize: 12.5, cursor: "pointer",
            }}>Saved deals</button>
          )}
        </div>

        {showSync && deals.available && <DealsBar d={deals} />}

        <SubTabs options={[["deal", "Deal"], ["projections", "Projections"]]} value={sub} onChange={setSub} href={subHref} />
        {sub === "deal" ? <DealTab v={v} set={set} /> : <ProjectionsTab v={v} set={set} />}
      </div>
    </div>
  );
}

const NW_COLORS = {
  liquid: "#2f7a4e",
  netWorth: "#22362c",

// Cash and the Fidelity CMA share greens to read as liquid.
const ACCOUNT_COLORS = ["#2f7a4e", "#3c6e4e", "#9a7128", "#7a5fb0", "#3f72b5", "#b5483b"];
const accountColor = (i) => ACCOUNT_COLORS[(i + 1) % ACCOUNT_COLORS.length];

const parseDay = (iso) => {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const shortDate = (iso) =>
  parseDay(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const signed = (v, f = fmt) => (v >= 0 ? "+" : "−") + f(Math.abs(v));

const panel = {

const rowLine = { display: "flex", justifyContent: "space-between", gap: 12, padding: "8px 0", borderTop: "1px solid rgba(31,58,46,0.062)", fontSize: 13.5, fontFamily: FONT };

/* At a glance, laid out like a financial statement: what you own, what you
   owe, and the bottom line. Debts read in parentheses, accountant-style. */
function GlanceStatement({ totals, ynabOk }) {

      <Line label="Investments" note="Fidelity · incl. retirement" value={fmt0(totals.investments)} />
      <Total label="Total assets" value={fmt0(assets)} color={NW_COLORS.liquid} />

/* ─── Travel ───
   A globe that turns on its own, with the countries in travel.json filled in:
   green for visited, gold for the bucket list. d3-geo and the world map load
   only when this page opens. Drag to turn it; tap a country (on the globe or
   in the list) to stop the spin, turn it to face you and show its cities. */

const GEO_LIBS = [
  "https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js",
  "https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js",
  "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js",
];
// Country ids are ISO 3166 numeric codes, which is what `iso` in travel.json uses.
const WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json";
const WORLD_50M_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json";
const ZOOM_MIN = 1;
const ZOOM_MAX = 12;
const ZOOM_DETAIL = 2; // at 2x and closer, draw the finer map
const WORLD_COUNTRIES = 195;
const TRAVEL_COLORS = {
  ocean: "#d9e4de", land: "#f3ecdc", border: "#fffdf8",
  visited: "#2f7a4e", bucket: "#c9973a", selected: "#1f3a2e", city: "#fffdf8",
};

const loadedScripts = {};
const loadScript = (src) => {
  if (!loadedScripts[src]) loadedScripts[src] = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { delete loadedScripts[src]; s.remove(); reject(new Error("couldn't load the map")); };
    document.head.appendChild(s);
  });
  return loadedScripts[src];
};

const fetchCountries = (url) => fetch(url)
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error("couldn't load the map"))))
  .then((topo) => topojson.feature(topo, topo.objects.countries).features);

let worldPromise = null;
function loadWorld() {
  if (!worldPromise) {
    worldPromise = GEO_LIBS.reduce((p, src) => p.then(() => loadScript(src)), Promise.resolve())
      .then(() => fetchCountries(WORLD_URL))
      .catch((e) => { worldPromise = null; throw e; });
  }
  return worldPromise;
}

/* The 1:50m map (~750 KB) has small countries and islands the 1:110m one
   drops. It loads only once you zoom in. */
let detailPromise = null;
function loadDetail() {
  if (!detailPromise) detailPromise = fetchCountries(WORLD_50M_URL).catch((e) => { detailPromise = null; throw e; });
  return detailPromise;
}

/* Where to turn the globe for a country: the middle of its cities when we
   have them (France's map shape includes French Guiana, which would drag a
   plain centroid out into the Atlantic), else the shape's centroid. */
function focusPoint(place, feature) {
  const pts = (place && place.cities || []).map((c) => c.at).filter(Boolean);
  if (pts.length) return [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
  return feature ? d3.geoCentroid(feature) : null;
}

function Globe({ features, visited, bucket, selected, onSelect }) {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  const [size, setSize] = useState(0);
  const [zoomed, setZoomed] = useState(false);
  // Rotation, zoom and gesture state change every frame, so they live in a
  // ref rather than React state. Start over the Atlantic, tilted a little.
  const st = useRef({ rot: [30, -22, 0], k: 1, drag: null, pinch: null, pointers: new Map(),
    anim: null, idleUntil: 0, proj: null, drawn: "" });
  const detailRef = useRef(null);
  const live = useRef({});
  live.current = { visited, bucket, selected, onSelect };

  // The finer map takes over once you're zoomed in far enough to see the difference.
  const shapes = () => (st.current.k >= ZOOM_DETAIL && detailRef.current) || features;

  const preloadDetail = (k) => {
    if (k < ZOOM_DETAIL * 0.75 || detailRef.current) return;
    loadDetail().then((f) => { detailRef.current = f; st.current.drawn = ""; }).catch(() => {});
  };
  const applyZoom = useCallback((k) => {
    const s = st.current;
    s.k = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, k));
    preloadDetail(s.k);
    setZoomed(s.k > 1.01);
  }, []);

  // Buttons zoom smoothly; pinch and scroll follow your fingers directly.
  const animateZoom = (k) => {
    const s = st.current;
    const to = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, k));
    s.anim = { from: [s.rot[0], s.rot[1], s.k], d: [0, 0, to - s.k], t0: performance.now(), ms: 350 };
    s.idleUntil = performance.now() + 2500;
    preloadDetail(to);
  };

  useEffect(() => {
    const ro = new ResizeObserver(([e]) => setSize(Math.floor(e.contentRect.width)));
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);

  const cities = useMemo(() => ({
    type: "MultiPoint",
    coordinates: Object.values(visited).flatMap((p) => p.cities.map((c) => c.at).filter(Boolean)),
  }), [visited]);

  useEffect(() => {
    if (!size) return;
    const canvas = canvasRef.current;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = canvas.style.height = size + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = size / 2 - 1.5;
    const c = size / 2;
    const proj = d3.geoOrthographic().translate([c, c]).clipAngle(90)
      .clipExtent([[-2, -2], [size + 2, size + 2]]).precision(0.6);
    st.current.proj = proj;
    st.current.drawn = "";
    const path = d3.geoPath(proj, ctx);
    const grat = d3.geoGraticule10();
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const draw = () => {
      const { visited: v, bucket: b, selected: sel } = live.current;
      const k = st.current.k;
      const R = r * k;
      const lit = [c - R * 0.35, c - R * 0.4];
      const ocean = ctx.createRadialGradient(lit[0], lit[1], R * 0.1, c, c, R);
      ocean.addColorStop(0, "#e9efea");
      ocean.addColorStop(1, TRAVEL_COLORS.ocean);
      const shade = ctx.createRadialGradient(lit[0], lit[1], R * 0.2, c, c, R * 1.02);
      shade.addColorStop(0, "rgba(255,255,255,0.18)");
      shade.addColorStop(0.65, "rgba(255,255,255,0)");
      shade.addColorStop(1, "rgba(31,58,46,0.16)");
      const list = shapes();

      ctx.clearRect(0, 0, size, size);
      ctx.beginPath(); path({ type: "Sphere" }); ctx.fillStyle = ocean; ctx.fill();
      ctx.beginPath(); path(grat); ctx.strokeStyle = "rgba(31,58,46,0.07)"; ctx.lineWidth = 0.6; ctx.stroke();
      ctx.lineWidth = k > 2 ? 0.8 : 0.6;
      ctx.strokeStyle = TRAVEL_COLORS.border;
      for (const f of list) {
        ctx.beginPath(); path(f);
        ctx.fillStyle = f.id === sel ? TRAVEL_COLORS.selected : v[f.id] ? TRAVEL_COLORS.visited
          : b[f.id] ? TRAVEL_COLORS.bucket : TRAVEL_COLORS.land;
        ctx.fill(); ctx.stroke();
      }
      const selFeature = sel && list.find((f) => f.id === sel);
      if (selFeature) {
        ctx.beginPath(); path(selFeature);
        ctx.strokeStyle = "#e3c27a"; ctx.lineWidth = 1.4; ctx.stroke();
      }
      path.pointRadius(Math.max(1.8, size / 200) * Math.min(2, Math.sqrt(k)));
      ctx.beginPath(); path(cities);
      ctx.fillStyle = TRAVEL_COLORS.city; ctx.fill();
      ctx.strokeStyle = "rgba(31,58,46,0.55)"; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.beginPath(); path({ type: "Sphere" });
      ctx.fillStyle = shade; ctx.fill();
      ctx.strokeStyle = "rgba(31,58,46,0.22)"; ctx.lineWidth = 1; ctx.stroke();
    };

    let raf;
    let last = performance.now();
    const frame = (now) => {
      const s = st.current;
      const dt = Math.min(now - last, 50);
      last = now;
      if (s.anim) {
        const t = Math.min(1, (now - s.anim.t0) / s.anim.ms);
        const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        s.rot = [s.anim.from[0] + s.anim.d[0] * e, s.anim.from[1] + s.anim.d[1] * e, 0];
        s.k = s.anim.from[2] + s.anim.d[2] * e;
        if (t >= 1) { s.anim = null; applyZoom(s.k); }
      } else if (!s.drag && !s.pinch && !live.current.selected && !reduceMotion && s.k <= 1.15 && now > s.idleUntil) {
        s.rot = [s.rot[0] + dt * 0.008, s.rot[1], 0]; // 8° a second, only when zoomed out
      }
      // Only repaint when something moved: the finer map is too heavy to
      // redraw 60 times a second for nothing.
      const key = `${s.rot[0].toFixed(3)},${s.rot[1].toFixed(3)},${s.k.toFixed(4)},${live.current.selected},${!!detailRef.current}`;
      if (key !== s.drawn) {
        proj.rotate(s.rot).scale(r * s.k);
        draw();
        s.drawn = key;
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, [size, features, cities, applyZoom]);

  // Turn the chosen country to face you, keeping the zoom you're at.
  useEffect(() => {
    if (!selected) { st.current.idleUntil = performance.now() + 600; return; }
    const feature = features.find((f) => f.id === selected);
    const at = focusPoint(visited[selected] || bucket[selected], feature);
    if (!at) return;
    const s = st.current;
    const from = [s.rot[0], s.rot[1], s.k];
    const to = [-at[0], Math.max(-55, Math.min(55, -at[1]))];
    const dLon = ((to[0] - from[0]) % 360 + 540) % 360 - 180;
    s.anim = { from, d: [dLon, to[1] - from[1], 0], t0: performance.now(), ms: 900 };
  }, [selected, features, visited, bucket]);

  // Scroll wheel / trackpad pinch over the globe zooms it. React's onWheel is
  // passive, so this is a native listener that can stop the page scrolling.
  useEffect(() => {
    const el = canvasRef.current;
    const onWheel = (e) => {
      e.preventDefault();
      const dy = e.deltaY * (e.deltaMode === 1 ? 16 : 1);
      st.current.anim = null;
      st.current.idleUntil = performance.now() + 2500;
      applyZoom(st.current.k * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)));
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, [applyZoom]);

  const pointer = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return [e.clientX - rect.left, e.clientY - rect.top];
  };
  const twoFingers = () => {
    const [a, b] = [...st.current.pointers.values()];
    return Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
  };
  const onPointerDown = (e) => {
    const s = st.current;
    const [x, y] = pointer(e);
    s.pointers.set(e.pointerId, [x, y]);
    s.anim = null;
    try { canvasRef.current.setPointerCapture(e.pointerId); } catch (_) { /* pointer already gone */ }
    if (s.pointers.size === 2) {
      s.pinch = { dist: twoFingers(), k: s.k };
      if (s.drag) s.drag.moved = true; // a pinch is never a tap
    } else if (s.pointers.size === 1) {
      s.drag = { x, y, rot: [...s.rot], moved: false };
    }
  };
  const onPointerMove = (e) => {
    const s = st.current;
    if (!s.pointers.has(e.pointerId)) return;
    const [x, y] = pointer(e);
    s.pointers.set(e.pointerId, [x, y]);
    if (s.pinch && s.pointers.size >= 2) { applyZoom(s.pinch.k * twoFingers() / s.pinch.dist); return; }
    if (!s.drag) return;
    const dx = x - s.drag.x;
    const dy = y - s.drag.y;
    if (Math.hypot(dx, dy) > 5) s.drag.moved = true;
    if (!s.drag.moved) return;
    const deg = 57.3 / ((size / 2) * s.k); // degrees per pixel at the centre: slower when zoomed in
    s.rot = [s.drag.rot[0] + dx * deg, Math.max(-80, Math.min(80, s.drag.rot[1] - dy * deg)), 0];
  };
  const onPointerUp = (e) => {
    const s = st.current;
    s.pointers.delete(e.pointerId);
    s.idleUntil = performance.now() + 2500;
    if (s.pinch) {
      // One finger lifted mid-pinch: carry on dragging with the other from where it is.
      s.pinch = null;
      const rest = [...s.pointers.values()][0];
      s.drag = rest ? { x: rest[0], y: rest[1], rot: [...s.rot], moved: true } : null;
      return;
    }
    const drag = s.drag;
    s.drag = null;
    if (!drag || drag.moved || !s.proj) return;
    const [x, y] = pointer(e);
    const c = size / 2;
    if (Math.hypot(x - c, y - c) > (c - 1.5) * s.k) return live.current.onSelect(null);
    const at = s.proj.invert([x, y]);
    const hit = at && shapes().find((f) => d3.geoContains(f, at));
    live.current.onSelect(hit ? (hit.id === live.current.selected ? null : hit.id) : null);
  };
  const onPointerCancel = (e) => {
    const s = st.current;
    s.pointers.delete(e.pointerId);
    if (!s.pointers.size) { s.drag = null; s.pinch = null; }
    s.idleUntil = performance.now() + 2500;
  };

  return (
    <div ref={wrapRef} className="globe-wrap">
      <canvas ref={canvasRef} role="img" aria-label={`Globe with ${Object.keys(visited).length} visited countries filled in`}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerCancel} />
      <div className="globe-zoom">
        <button type="button" aria-label="Zoom in" onClick={() => animateZoom(st.current.k * 1.8)}>+</button>
        <button type="button" aria-label="Zoom out" disabled={!zoomed} onClick={() => animateZoom(st.current.k / 1.8)}>−</button>
        {zoomed && (
          <button type="button" aria-label="Zoom all the way out" onClick={() => animateZoom(1)}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
        )}
      </div>
    </div>
  );
}

      .catch(() => setData({ visited: [], bucket: [] }));
  }, []);
  const loadMap = useCallback(() => {
    setMapError("");
    loadWorld().then(setFeatures).catch((e) => setMapError(String(e.message || e)));

  useEffect(loadMap, [loadMap]);

  const visited = useMemo(() => Object.fromEntries((data ? data.visited : []).map((p) => [p.iso, { ...p, cities: p.cities || [] }])), [data]);

  const selPlace = visited[selected] || bucket[selected];

  return (
